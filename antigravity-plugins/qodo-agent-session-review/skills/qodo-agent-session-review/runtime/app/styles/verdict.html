<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Verdict: the merge decision as four questions, each answered by a picture first. 1) Is this the right way to build
   it (the routes, side by side)? 2) What does it touch, and how much does that matter (the criticality map)? 3) What
   could go wrong (Merge Risk on a radius x damage grid)? 4) Can it be approved (the gate, bound to the commits)? */
:root{
  --bg:#f7f5f0; --surface:#fffdf8; --ink:#1d2433; --muted:#5d6472; --faint:#868c97; --line:#e3ded3; --line-strong:#cbc4b5;
  --sunk:#efebe2; --accent:#2f4fa8; --accent-text:#2f4fa8; --accent-soft:#e6ebf8;
  --high:#b5382f; --high-soft:#f7e3e0; --med:#b06c0c; --med-soft:#f6ead6; --low:#3b7a4b; --low-soft:#e2efe5; --und:#8a8f99; --und-soft:#ecebe7;
  --ok:#2f7d4e; --ok-soft:#e1f0e6; --stop:#b5382f; --stop-soft:#f7e3e0;
  --hl:#fbf1c9; --shadow:0 1px 2px rgba(29,36,51,.06), 0 10px 28px rgba(29,36,51,.08);
  --f-display:"Newsreader", "Iowan Old Style", Georgia, serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --fg:var(--ink);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14161b; --surface:#1b1e25; --ink:#e8e6e1; --muted:#a2a7b2; --faint:#7f8591; --line:#2c303a; --line-strong:#3d4250;
  --sunk:#22262f; --accent:#93a9ff; --accent-text:#a9bbff; --accent-soft:#232b45;
  --high:#f08474; --high-soft:#3a1f1c; --med:#e6ac4f; --med-soft:#382a14; --low:#7cc391; --low-soft:#1a3022; --und:#8f95a2; --und-soft:#262931;
  --ok:#7cc391; --ok-soft:#1a3022; --stop:#f08474; --stop-soft:#3a1f1c; --hl:#3a3415;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#14161b; --surface:#1b1e25; --ink:#e8e6e1; --muted:#a2a7b2; --faint:#7f8591; --line:#2c303a; --line-strong:#3d4250;
  --sunk:#22262f; --accent:#93a9ff; --accent-text:#a9bbff; --accent-soft:#232b45;
  --high:#f08474; --high-soft:#3a1f1c; --med:#e6ac4f; --med-soft:#382a14; --low:#7cc391; --low-soft:#1a3022; --und:#8f95a2; --und-soft:#262931;
  --ok:#7cc391; --ok-soft:#1a3022; --stop:#f08474; --stop-soft:#3a1f1c; --hl:#3a3415;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font:15px/1.6 var(--f-body); margin:0; padding-inline:16px; padding-block:0 72px}
main{max-width:1040px; margin:0 auto; display:flex; flex-direction:column; gap:56px; padding-top:28px}
h1,h2,h3{font-family:var(--f-display); font-weight:600; text-wrap:balance; margin:0; letter-spacing:-.01em}
h1{font-size:clamp(28px,4vw,40px); line-height:1.12}
h2{font-size:clamp(23px,3vw,30px); line-height:1.2}
h3{font-size:19px; line-height:1.3}
p{margin:0; max-width:70ch}
a{color:var(--accent-text)}
code,.mono{font-family:var(--f-mono); font-size:.86em}
p code,li code,td code{background:var(--sunk); padding:1px 5px; border-radius:4px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button{font:inherit; color:inherit}
section{display:flex; flex-direction:column; gap:20px; min-width:0; scroll-margin-top:84px}
.n{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font:600 11.5px/1.2 var(--f-body); letter-spacing:.09em; text-transform:uppercase; color:var(--faint)}
.qno{font:600 13px/1 var(--f-mono); color:var(--accent-text)}
.qhead{display:flex; flex-direction:column; gap:6px; border-top:2px solid var(--ink); padding-top:14px}
.lede{font-size:16.5px; color:var(--muted); max-width:72ch}
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; min-width:0}
.callout{border-left:3px solid var(--med); background:var(--med-soft); padding:10px 14px; border-radius:0 8px 8px 0}
.callout.ok{border-color:var(--ok); background:var(--ok-soft)}
.callout.stop{border-color:var(--stop); background:var(--stop-soft)}
.badge{display:inline-flex; align-items:center; gap:4px; font:600 11.5px/1.5 var(--f-body); padding:1px 8px; border-radius:999px; border:1px solid var(--line-strong); color:var(--muted); white-space:nowrap}
.badge.doc{border-color:var(--accent); color:var(--accent-text)}
.badge.inf{border-style:dashed}
.badge.chosen{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.lv{display:inline-flex; align-items:center; gap:5px; font:600 12px/1.5 var(--f-body); padding:0 8px; border-radius:5px; white-space:nowrap}
.lv.high{background:var(--high-soft); color:var(--high)} .lv.medium{background:var(--med-soft); color:var(--med)}
.lv.low{background:var(--low-soft); color:var(--low)} .lv.undeclared,.lv.unknown{background:var(--und-soft); color:var(--und)}
.btn{border:1px solid var(--line-strong); background:var(--surface); border-radius:7px; padding:6px 12px; cursor:pointer; font-weight:500; font-size:13.5px}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--ink); color:var(--bg); border-color:var(--ink)}

/* the bar */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; margin-inline:-16px; padding:10px 16px; background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.bar .in{max-width:1040px; margin:0 auto; display:flex; gap:12px; align-items:center}
.bar .t{flex:1; min-width:0; font-size:13.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar .t b{color:var(--ink)}
.jump{display:flex; gap:4px; flex-wrap:nowrap}
.jump a{font:500 12.5px/1 var(--f-body); color:var(--muted); text-decoration:none; border:1px solid var(--line); border-radius:6px; padding:6px 8px; white-space:nowrap}
.jump a:hover{background:var(--sunk); color:var(--ink)}
.jump a .k{font-family:var(--f-mono); color:var(--faint); margin-right:4px}
@media (max-width:760px){ .jump a span:not(.k){display:none} .jump a .k{margin:0} }

/* the verdict: four answers in a strip */
.top{display:flex; flex-direction:column; gap:18px}
.ruling{display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 18px; align-items:center; padding:18px 20px; border-radius:12px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow)}
.seal{width:64px; height:64px; border-radius:50%; display:grid; place-items:center; border:2px solid currentColor; font:600 12px/1.1 var(--f-body); text-transform:uppercase; letter-spacing:.06em; text-align:center}
.seal.stop{color:var(--stop)} .seal.ok{color:var(--ok)}
.ruling .say{font:600 clamp(20px,2.6vw,26px)/1.25 var(--f-display)}
.ruling .sub{color:var(--muted); font-size:14px}
.strip{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
@media (max-width:820px){ .strip{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:460px){ .strip{grid-template-columns:minmax(0,1fr)} }
.ans{display:flex; flex-direction:column; gap:6px; text-decoration:none; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0}
.ans:hover{border-color:var(--line-strong)}
.ans .q{font-size:13px; color:var(--muted)}
.ans .a{font-weight:600; font-size:14.5px; line-height:1.35}
.ans .m{display:flex; gap:6px; flex-wrap:wrap}

/* 1. routes */
.sizes{display:flex; flex-direction:column; gap:10px}
.srow{display:grid; grid-template-columns:minmax(120px,240px) minmax(0,1fr); gap:12px; align-items:center}
@media (max-width:560px){ .srow{grid-template-columns:minmax(0,1fr)} }
.srow .nm{font-weight:600; font-size:14px; line-height:1.3}
.track{position:relative; height:26px; background:var(--sunk); border-radius:5px; overflow:hidden}
.fill{position:absolute; inset:0 auto 0 0; background:var(--ink); border-radius:5px; min-width:3px}
.fill.alt{background:var(--accent)}
.track .v{position:absolute; left:8px; top:0; bottom:0; display:flex; align-items:center; font:500 12.5px/1 var(--f-body); color:var(--ink); mix-blend-mode:normal; white-space:nowrap}
.track .v.on{color:var(--bg)}
.track.none{background:repeating-linear-gradient(135deg, var(--sunk) 0 6px, transparent 6px 12px); border:1px dashed var(--line-strong)}
.matrix{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
.matrix table{border-collapse:collapse; width:100%; min-width:620px; font-size:14px}
.matrix th,.matrix td{padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle}
.matrix tr:last-child td{border-bottom:0}
.matrix thead th{font:600 13.5px/1.3 var(--f-body); vertical-align:bottom}
.matrix thead th.ch{background:var(--accent-soft)}
.matrix td.ch{background:color-mix(in srgb, var(--accent-soft) 55%, transparent)}
.matrix tbody th{font-weight:500; color:var(--muted); white-space:nowrap}
.fit{display:inline-flex; align-items:center; gap:6px; font-size:13px}
.fit i{width:12px; height:12px; border-radius:50%; display:inline-block; border:2px solid currentColor; flex:none}
.fit.better{color:var(--ok)} .fit.better i{background:currentColor}
.fit.similar{color:var(--muted)} .fit.similar i{background:linear-gradient(90deg, currentColor 50%, transparent 50%)}
.fit.worse{color:var(--stop)}
.fit.unknown{color:var(--und)} .fit.unknown i{border-style:dashed}
.routes{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr)); gap:12px}
.route{display:flex; flex-direction:column; gap:10px}
.route.chosen{border-color:var(--ink); box-shadow:inset 0 3px 0 var(--ink)}
.route .hd{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.route h3{font-size:18px}
.route ul{margin:0; padding-left:18px; display:grid; gap:2px; font-size:14px}
.route .two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:420px){ .route .two{grid-template-columns:1fr} }
.route .prove{font-size:13.5px; border-top:1px dashed var(--line-strong); padding-top:8px}
.route .src{font-size:13px}
.why{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:12px}

/* 2. criticality map */
.legend{display:flex; gap:8px 14px; flex-wrap:wrap; font-size:13px; color:var(--muted); align-items:center}
.sw{display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px; margin-right:5px}
.sw.high{background:var(--high)} .sw.medium{background:var(--med)} .sw.low{background:var(--low)}
.sw.undeclared{background:repeating-linear-gradient(135deg, var(--und) 0 2px, transparent 2px 5px); border:1px solid var(--und)}
.sw.sug{background:transparent; border:2px dashed var(--muted)}
.cmap{display:flex; flex-direction:column; gap:14px}
.repo{display:grid; grid-template-columns:minmax(110px,200px) minmax(0,1fr); gap:12px; align-items:start}
@media (max-width:640px){ .repo{grid-template-columns:minmax(0,1fr)} }
.repo .rn{font-weight:600; font-size:14px; line-height:1.3; padding-top:4px; overflow-wrap:anywhere}
.repo .rn small{display:block; color:var(--faint); font-weight:400; font-size:12.5px}
.tiles{display:flex; flex-wrap:wrap; gap:4px}
.tile{position:relative; height:46px; border-radius:6px; padding:5px 7px; font:500 11.5px/1.25 var(--f-mono); overflow:hidden; color:#fff; cursor:default; display:flex; flex-direction:column; justify-content:space-between; min-width:28px}
.tile.high{background:var(--high)} .tile.medium{background:var(--med)} .tile.low{background:var(--low)}
.tile.undeclared{background:repeating-linear-gradient(135deg, var(--und-soft) 0 5px, var(--surface) 5px 10px); color:var(--muted); border:1px solid var(--line-strong)}
.tile.sug{outline:1.5px dashed currentColor; outline-offset:-4px}
.tile .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tile .ln{opacity:.85; font-size:10.5px}
.tile .lock{position:absolute; top:4px; right:5px; font-size:12px}
:root[data-theme="dark"] .tile.high,:root[data-theme="dark"] .tile.medium,:root[data-theme="dark"] .tile.low{color:#14161b}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tile.high,:root:not([data-theme="light"]) .tile.medium,:root:not([data-theme="light"]) .tile.low{color:#14161b} }
.sugs{display:flex; flex-direction:column; gap:8px}
.sugrow{display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 12px; align-items:baseline; font-size:14px}
.sugrow code{overflow-wrap:anywhere}
.decl{display:flex; flex-direction:column; gap:8px}
.decl pre{margin:0; background:var(--sunk); border-radius:8px; padding:12px; font:12.5px/1.5 var(--f-mono); overflow-x:auto; max-height:260px}
.mix{display:flex; flex-direction:column; gap:8px}
.mrow{display:grid; grid-template-columns:minmax(120px,200px) minmax(0,1fr) auto; gap:10px; align-items:center; font-size:13.5px}
@media (max-width:560px){ .mrow{grid-template-columns:minmax(0,1fr) auto} .mrow .bar2{grid-column:1/-1; order:3} }
.bar2{display:flex; height:14px; border-radius:4px; overflow:hidden; background:var(--sunk)}
.bar2 span{display:block; height:100%}
.k-production{background:var(--ink)} .k-config{background:var(--accent)} .k-test{background:var(--low)} .k-docs{background:var(--line-strong)} .k-generated{background:var(--und)}
.k-from_base{background:repeating-linear-gradient(135deg, var(--med) 0 3px, transparent 3px 6px)}

/* 3. merge risk grid */
.riskwrap{display:grid; grid-template-columns:minmax(0,380px) minmax(0,1fr); gap:20px; align-items:start}
@media (max-width:820px){ .riskwrap{grid-template-columns:minmax(0,1fr)} }
.grid3{display:grid; grid-template-columns:28px repeat(3,minmax(0,1fr)); grid-template-rows:repeat(3,minmax(84px,auto)) 28px; gap:4px}
.cell{border-radius:6px; padding:6px; display:flex; flex-wrap:wrap; gap:4px; align-content:flex-start}
.cell.r-low{background:var(--low-soft)} .cell.r-medium{background:var(--med-soft)} .cell.r-high{background:var(--high-soft)}
.ax{font:600 11px/1.2 var(--f-body); color:var(--faint); text-transform:uppercase; letter-spacing:.06em; display:flex; align-items:center; justify-content:center; text-align:center}
.ax.y{writing-mode:vertical-rl; transform:rotate(180deg)}
.dot{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font:600 12px/1 var(--f-mono); background:var(--surface); border:2px solid var(--ink); color:var(--ink); cursor:pointer; text-decoration:none}
.dot.c-high{box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--ink)}
.dot.c-medium{border-width:3px}
.dot:hover,.dot.on{background:var(--ink); color:var(--bg)}
.scen{display:flex; flex-direction:column; gap:8px}
.sc{display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:4px 10px; align-items:start; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface)}
.sc.on{border-color:var(--ink); background:var(--hl)}
.sc .no{font:600 12px/26px var(--f-mono); text-align:center; border:1.5px solid var(--ink); border-radius:50%; width:26px; height:26px}
.sc .nm{font-weight:600}
.sc .fx{grid-column:2/-1; font-size:13.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 12px}
.sc .fx b{color:var(--ink); font-weight:500}
.sc details{grid-column:2/-1; font-size:13.5px}
.sc details summary{cursor:pointer; color:var(--accent-text)}
.sc details p{margin-top:4px}

/* 4. the gate */
.gate{display:flex; flex-direction:column; gap:0; border:1px solid var(--line); border-radius:10px; background:var(--surface); overflow:hidden}
.gstep{display:grid; grid-template-columns:34px minmax(0,1fr) auto; gap:4px 12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line)}
.gstep:last-child{border-bottom:0}
.gstep .ic{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:14px}
.gstep.pass .ic{background:var(--ok-soft); color:var(--ok)} .gstep.fail .ic{background:var(--stop-soft); color:var(--stop)}
.gstep .w{font-size:14.5px}
.gstep .st{font:600 12px/1 var(--f-body); text-transform:uppercase; letter-spacing:.06em}
.gstep.pass .st{color:var(--ok)} .gstep.fail .st{color:var(--stop)}
.gstep.res{background:var(--sunk)}
.heads{display:flex; flex-wrap:wrap; gap:6px; font-size:13px}
.heads code{background:var(--sunk); padding:1px 6px; border-radius:4px}
.side{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:12px}
.ppl{display:flex; flex-direction:column; gap:6px; font-size:14px}
.opts{display:flex; flex-direction:column; gap:8px}
.opt{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--surface); cursor:pointer}
.opt:has(input:checked){border-color:var(--ink); background:var(--hl)}
.opt input{margin-top:4px}
textarea{width:100%; min-height:80px; border:1px solid var(--line-strong); border-radius:8px; padding:10px; background:var(--surface); color:var(--ink); font:14px/1.5 var(--f-body)}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
#mdout{white-space:pre-wrap; background:var(--sunk); border-radius:8px; padding:12px; font:12.5px/1.5 var(--f-mono); margin:0}
.empty{border:1px dashed var(--line-strong); border-radius:10px; padding:14px 16px; color:var(--muted); font-size:14px}
.empty code{background:var(--sunk); padding:1px 5px; border-radius:4px}
.tip{position:fixed; z-index:60; max-width:320px; background:var(--ink); color:var(--bg); border-radius:8px; padding:8px 10px; font-size:12.5px; line-height:1.4; pointer-events:none; box-shadow:var(--shadow)}
</style>

<div class="bar"><div class="in">
  <div class="t" id="bt"></div>
  <nav class="jump" aria-label="Questions">
    <a href="#q1"><span class="k">1</span><span>Approach</span></a><a href="#q2"><span class="k">2</span><span>What it touches</span></a>
    <a href="#q3"><span class="k">3</span><span>What could go wrong</span></a><a href="#q4"><span class="k">4</span><span>Approval</span></a>
  </nav>
  <div id="cknav"></div>
</div></div>
<main id="main"></main>

<script>
const C = KIT.cases[KIT.pick()];
const { esc, md } = KIT;
const $ = (s, el = document) => el.querySelector(s);
const W = { high: "High", medium: "Medium", low: "Low", unknown: "Unknown", undeclared: "Not declared", small: "Small", large: "Large" };
const fmt = (n) => Number(n || 0).toLocaleString();
const repoName = (r) => String(r || "").split("/").pop();
const RISK = C.risk || {};
const CRIT = C.criticality || { files: [] };
const ROUTES = C.routes;
const Q = (C.story || []).find((b) => b.kind === "question");

/* ---------- the verdict: one sentence, four answers ---------- */
function verdict() {
  const ap = RISK.approval || { result: "human review", reasons: [] };
  const ok = ap.result === "approve";
  const ro = ROUTES && !ROUTES.skip && ROUTES.options ? ROUTES : null;
  const chosen = ro ? ro.options.find((o) => o.id === ro.chosen) : null;
  const alts = ro ? ro.options.filter((o) => o.id !== ro.chosen) : [];
  const files = CRIT.files || [];
  const lv = (l) => files.filter((f) => f.level === l).length;
  const sug = files.filter((f) => f.suggested && f.source !== "declared").length;
  const declared = files.filter((f) => f.source === "declared").length;
  const g = CRIT.gate || { count: 0 };
  const better = (o) => Object.values(o.fit || {}).filter((v) => v === "better").length;
  const doubt = ro && ((ro.unargued || []).length || alts.some((o) => chosen && better(o) > better(chosen)));
  const a1 = !ro ? (ROUTES && ROUTES.skip ? "Not questioned: one way to build it" : "Not written yet")
    : `Chosen: ${chosen ? chosen.name : "?"}${doubt ? ". Worth a second look" : ""}`;
  const a2 = declared ? `${fmt(declared)} of ${fmt(files.length)} files declared` : `Nothing declared; ${fmt(files.length - lv("undeclared"))} file${files.length - lv("undeclared") === 1 ? " has a" : "s have"} suggested level${files.length - lv("undeclared") === 1 ? "" : "s"}`;
  const a3 = `${W[RISK.level] || "Unknown"}${RISK.range ? ` (could be ${W[RISK.range[0]]}–${W[RISK.range[1]]})` : ""}`;
  const a4 = ok ? "Qodo would approve" : (g.count ? `No: ${fmt(g.count)} protected file${g.count === 1 ? "" : "s"}` : "No: a human reviews");
  const say = ok ? "Qodo would approve this package" : "A person has to decide this one";
  const shorten = (r) => r.replace(/current commit on (.+)\.$/, (m, list) => { const n = list.split(", ").length; return n > 2 ? `current commit on ${n} PRs.` : m; });
  const noMap = CRIT.error ? "" : !(CRIT.has_map || CRIT.codeowners) ? " No paths are declared or protected." : "";
  const sub = (ok ? "Every condition passes on the current commits." : (ap.reasons || []).filter((r) => !/within|No open|reviewed every/.test(r)).slice(0, 2).map(shorten).join(" ")) + noMap;
  return `<div class="top">
    <div><div class="lbl">Merge verdict · ${esc(C.blurb || "")}</div><h1 style="margin-top:6px">${esc(C.title)}</h1></div>
    <div class="ruling"><div class="seal ${ok ? "ok" : "stop"}" aria-hidden="true">${ok ? "Auto<br>OK" : "Human<br>call"}</div>
      <div><div class="say">${esc(say)}</div><div class="sub">${esc(sub)}</div></div></div>
    <div class="strip">
      <a class="ans" href="#q1"><span class="q"><span class="qno">1</span> Is this the right way?</span><span class="a">${esc(a1)}</span>
        <span class="m">${alts.length ? `<span class="badge">${alts.length} other route${alts.length === 1 ? "" : "s"}</span>` : ""}${ro && ro.unargued && ro.unargued.length ? `<span class="badge" style="border-color:var(--med);color:var(--med)">${ro.unargued.length} dismissed without a reason</span>` : ""}</span></a>
      <a class="ans" href="#q2"><span class="q"><span class="qno">2</span> How much does it matter?</span><span class="a">${esc(a2)}</span>
        <span class="m">${["high", "medium"].filter(lv).map((l) => `<span class="lv ${l}">${fmt(lv(l))} ${W[l].toLowerCase()}</span>`).join("")}<span class="lv undeclared">${fmt(lv("undeclared"))} not declared</span></span></a>
      <a class="ans" href="#q3"><span class="q"><span class="qno">3</span> What could go wrong?</span><span class="a">Merge Risk: ${esc(a3)}</span>
        <span class="m"><span class="badge">${(RISK.scenarios || []).length} scenario${(RISK.scenarios || []).length === 1 ? "" : "s"}</span></span></a>
      <a class="ans" href="#q4"><span class="q"><span class="qno">4</span> Can Qodo approve it?</span><span class="a">${esc(a4)}</span>
        <span class="m"><span class="badge">for the current commits</span></span></a>
    </div></div>`;
}

/* ---------- 1. routes ---------- */
function routesSec() {
  const head = `<div class="qhead"><span class="qno">Question 1</span><h2>Is this the right way to build it?</h2></div>`;
  if (!ROUTES) return `<section id="q1">${head}<div class="empty">The review hasn't weighed other ways to build this yet. Ask: <code>/review-prs write the routes for review session ${esc(C.session)}</code> (storytelling.md, "Other ways to build this").</div></section>`;
  if (ROUTES.skip) return `<section id="q1">${head}<p class="lede">Not questioned: ${md(ROUTES.skip)}</p></section>`;
  const R = ROUTES, opts = R.options || [];
  const max = Math.max(1, ...opts.map((o) => (o.size || {}).lines || 0));
  const sizes = `<div class="card sizes"><div class="lbl">Code each route asks the team to own</div>${opts.map((o) => {
    const n = (o.size || {}).lines, w = n ? Math.max(1.2, 100 * n / max) : 0;
    return `<div class="srow"><div class="nm">${esc(o.name)}${o.id === R.chosen ? ' <span class="badge chosen">chosen</span>' : ""}</div>
      <div><div class="track${n ? "" : " none"}">${n ? `<div class="fill${o.id === R.chosen ? "" : " alt"}" style="width:${w}%"></div>` : ""}
        <span class="v${n && w > 40 ? " on" : ""}" style="${n && w <= 40 ? `left:calc(${w}% + 8px)` : ""}">${n ? fmt(n) + " lines" : "not built"}</span></div>
        <div class="muted" style="font-size:12.5px;margin-top:3px">${esc((o.size || {}).label || "")}</div></div></div>`;
  }).join("")}</div>`;
  const crit = R.criteria && R.criteria.length ? R.criteria : [...new Set(opts.flatMap((o) => Object.keys(o.fit || {})))];
  const WORD = { better: "Better", similar: "About the same", worse: "Worse", unknown: "Not known yet" };
  const matrix = crit.length ? `<div class="matrix"><table><thead><tr><th class="lbl">Weighed on</th>${opts.map((o) => `<th class="${o.id === R.chosen ? "ch" : ""}">${esc(o.name)}</th>`).join("")}</tr></thead>
    <tbody>${crit.map((c) => `<tr><th scope="row">${esc(c)}</th>${opts.map((o) => { const f = (o.fit || {})[c] || "unknown"; return `<td class="${o.id === R.chosen ? "ch" : ""}"><span class="fit ${f}"><i></i>${WORD[f]}</span></td>`; }).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="muted" style="font-size:13px">Each cell compares a route with the others on that criterion, from the sources linked on each route. "Not known yet" means nothing has measured it.</p>` : "";
  const list = (h, xs) => xs && xs.length ? `<div><div class="lbl">${h}</div><ul>${xs.map((x) => `<li>${md(x)}</li>`).join("")}</ul></div>` : "";
  const cards = `<div class="routes">${opts.map((o) => `<article class="card route${o.id === R.chosen ? " chosen" : ""}">
      <div class="hd">${o.id === R.chosen ? '<span class="badge chosen">Chosen</span>' : ""}<span class="badge ${o.source === "documented" ? "doc" : "inf"}">${o.source === "documented" ? "Documented" : "Inferred by the review"}</span></div>
      <h3>${esc(o.name)}</h3><p style="font-size:14.5px">${md(o.idea)}</p>
      <div class="two">${list("Reuses", o.reuses)}${list("Builds", o.builds)}</div>
      ${o.touches && o.touches.length ? `<div class="muted" style="font-size:13px"><span class="lbl">Changes</span> ${o.touches.map(esc).join(" · ")}</div>` : ""}
      ${o.covers ? `<div style="font-size:14px"><span class="lbl">Covers</span><br>${md(o.covers)}</div>` : ""}
      ${list("Risks", o.risks)}
      ${o.prove ? `<div class="prove"><span class="lbl">Would have to prove</span><br>${md(o.prove)}</div>` : ""}
      ${o.ref ? `<div class="src">Source: <a href="${esc(o.ref.url)}" target="_blank" rel="noopener">${esc(o.ref.title)}</a></div>` : ""}
    </article>`).join("")}</div>`;
  const why = `<div class="why">
    ${R.why ? `<div class="card"><div class="lbl">Why this route</div><p style="margin-top:6px">${md(R.why)}</p></div>` : ""}
    ${R.reconsider ? `<div class="card callout"><div class="lbl">Reconsider if</div><p style="margin-top:6px">${md(R.reconsider)}</p></div>` : ""}
  </div>${(R.unargued || []).map((u) => `<div class="callout stop"><div class="lbl">Dismissed without a reason</div><p style="margin-top:4px">${md(u)}</p></div>`).join("")}`;
  return `<section id="q1">${head}<p class="lede">${md(R.question || "The ways this could have been built, what each reuses and builds, and why this one.")}</p>${sizes}${matrix}${why}${cards}</section>`;
}

/* ---------- 2. criticality map ---------- */
function folderOf(path, depth = 2) { const p = path.split("/"); return p.length === 1 ? "(root)" : p.slice(0, Math.min(depth, p.length - 1)).join("/"); }
const RANK = { high: 3, medium: 2, low: 1, undeclared: 0 };
function critSec() {
  const head = `<div class="qhead"><span class="qno">Question 2</span><h2>What does it touch, and how much does that matter?</h2></div>`;
  if (CRIT.error) return `<section id="q2">${head}<div class="empty">The criticality map couldn't be read: ${esc(CRIT.error)}</div></section>`;
  const files = CRIT.files || [];
  const byRepo = {}, depth = {};
  /* a repo whose change sits in a few folders is read one level deeper, so its parts can differ */
  [...new Set(files.map((f) => f.repo))].forEach((repo) => { const fs = files.filter((f) => f.repo === repo); let d = 2;
    while (d < 5 && new Set(fs.map((f) => folderOf(f.path, d))).size <= 3 && new Set(fs.map((f) => folderOf(f.path, d + 1))).size > new Set(fs.map((f) => folderOf(f.path, d))).size) d++;
    depth[repo] = d; });
  files.forEach((f) => {
    const r = byRepo[f.repo] = byRepo[f.repo] || {};
    /* one tile per folder and level: a High file doesn't paint its Medium neighbours */
    const name = folderOf(f.path, depth[f.repo]), k = name + "\u0000" + f.level, t = r[k] = r[k] || { name, lines: 0, level: f.level, sug: false, lock: false, src: new Set(), files: 0, why: f.reason || "" };
    t.lines += f.lines || 0; t.files += 1; t.src.add(f.source);
    if (f.source === "discovered" || (f.suggested && f.level === "undeclared")) t.sug = true;
    if (!t.why && f.suggested_why) t.why = `suggested ${f.suggested}: ${f.suggested_why}`;
    if (f.protected) { t.lock = true; t.by = f.protected_by; }
  });
  const total = Math.max(1, ...Object.values(byRepo).map((r) => Object.values(r).reduce((a, t) => a + t.lines, 0)));
  const map = `<div class="card cmap">${Object.entries(byRepo).map(([repo, ts]) => {
    const all = Object.values(ts).sort((a, b) => RANK[b.level] - RANK[a.level] || b.lines - a.lines);
    const sum = all.reduce((a, t) => a + t.lines, 0);
    /* small folders fold into one tile per level, so every tile left can carry its name */
    const big = all.filter((t, i) => t.lock || t.lines >= 0.04 * sum || i < 3);
    const rest = all.filter((t) => !big.includes(t));
    const folded = ["high", "medium", "low", "undeclared"].map((l) => { const xs = rest.filter((t) => t.level === l); if (!xs.length) return null;
      return { name: `+${xs.length} folder${xs.length === 1 ? "" : "s"}`, lines: xs.reduce((a, t) => a + t.lines, 0), files: xs.reduce((a, t) => a + t.files, 0), level: l,
               sug: xs.some((t) => t.sug), lock: false, src: new Set(xs.flatMap((t) => [...t.src])), why: xs.map((t) => t.name).slice(0, 8).join(", ") + (xs.length > 8 ? "…" : "") }; }).filter(Boolean);
    const arr = big.concat(folded);
    return `<div class="repo"><div class="rn">${esc(repoName(repo))}<small>${fmt(sum)} changed lines</small></div><div class="tiles">${arr.map((t) => {
      const w = Math.max(76, Math.round(720 * t.lines / total));
      const tipTxt = `${t.name} · ${t.files} file${t.files === 1 ? "" : "s"}, ${fmt(t.lines)} lines · ${t.level === "undeclared" ? "not declared" : t.level}${t.src.has("declared") ? " (declared)" : t.sug ? " (the review's suggestion, not confirmed)" : ""}${t.why ? " — " + t.why : ""}${t.lock ? " · protected: " + t.by : ""}`;
      const sug = t.sug && !t.src.has("declared");   // declared files in the tile: it's the team's level, not a suggestion
      return `<div class="tile ${t.level}${sug ? " sug" : ""}" style="flex:0 1 ${w}px" data-tip="${esc(tipTxt)}" tabindex="0" aria-label="${esc(tipTxt)}">${t.lock ? '<span class="lock" aria-hidden="true">🔒</span>' : ""}<span class="nm">${esc(t.name.startsWith("+") ? t.name.split(" ")[0] : t.name.split("/").pop())}</span><span class="ln">${fmt(t.lines)}</span></div>`;
    }).join("")}</div></div>`;
  }).join("")}
    <div class="legend"><span><i class="sw high"></i>High</span><span><i class="sw medium"></i>Medium</span><span><i class="sw low"></i>Low</span><span><i class="sw undeclared"></i>Not declared</span><span><i class="sw sug"></i>Suggested by the review, not confirmed</span><span>🔒 Protected: never auto-approved</span><span class="muted">Tile width: changed lines</span></div></div>`;
  const declared = files.filter((f) => f.source === "declared").length;
  const disc = CRIT.discovered || [];
  const rule = `<div class="callout${declared ? " ok" : ""}"><b>${declared ? `${fmt(declared)} files follow the team's declared map.` : "The team hasn't declared a map for these repos."}</b>
    ${disc.length ? ` The review suggests ${disc.length} level${disc.length === 1 ? "" : "s"} below; a suggestion counts once someone declares it, and a suggested Low reads as not declared, because a wrong Low hides damage.` : ""}
    ${CRIT.codeowners ? " CODEOWNERS protects the paths it owns." : ""}</div>`;
  const sugs = disc.length ? `<div class="card sugs"><div class="lbl">The review's suggestions</div>${disc.map((e) => `<div class="sugrow"><span class="lv ${e.level === "low" ? "undeclared" : e.level}">${e.level === "low" ? "Low? (reads as not declared)" : W[e.level]}</span>
      <div><code>${esc(repoName(e.repo))}: ${e.paths.map(esc).join(", ")}</code><br><span class="muted">${md(e.reason)}</span></div></div>`).join("")}</div>` : "";
  const snippet = JSON.stringify({ criticality: { map: disc.map((e) => ({ repo: e.repo, paths: e.paths, level: e.level, owner: "", reason: e.reason, verify_after: "" })) } }, null, 2);
  const decl = disc.length ? `<div class="card decl"><div class="lbl">Declare them</div><p class="muted" style="font-size:14px">Edit what's wrong, add an owner and a date to re-check, and put it in your Agent Session Review config. Add <code>"approve": "never"</code> to an entry to keep Qodo from approving PRs that touch it.</p>
      <pre id="declpre">${esc(snippet)}</pre><div class="row"><button class="btn" data-copy-decl>Copy</button></div></div>` : "";
  const prs = C.prs || [];
  const KINDS = ["production", "config", "test", "docs", "generated", "from_base"];
  const KN = { production: "production", config: "config", test: "tests", docs: "docs", generated: "generated", from_base: "merged in from the base" };
  const mix = `<div class="card mix"><div class="lbl">What the lines are, per PR</div>${prs.map((p) => {
    const s = p.size || {}, sum = KINDS.reduce((a, k) => a + (s[k] || 0), 0) || 1;
    return `<div class="mrow"><span>${esc(repoName(p.repo))} #${p.number}</span><span class="bar2" data-tip="${esc(KINDS.filter((k) => s[k]).map((k) => `${KN[k]}: ${fmt(s[k])}`).join(" · "))}">${KINDS.map((k) => s[k] ? `<span class="k-${k}" style="width:${100 * s[k] / sum}%"></span>` : "").join("")}</span><span class="n muted">${fmt(s.production || 0)} prod</span></div>`;
  }).join("")}<div class="legend">${KINDS.map((k) => `<span><i class="sw k-${k}"></i>${KN[k]}</span>`).join("")}</div></div>`;
  return `<section id="q2">${head}<p class="lede">Every changed folder, sized by its changed lines and coloured by how much it matters to the business. Hover or focus a tile for its reason.</p>${map}${rule}<div class="side">${sugs}${decl}</div>${mix}</section>`;
}

/* ---------- 3. merge risk ---------- */
function riskSec() {
  const head = `<div class="qhead"><span class="qno">Question 3</span><h2>What could go wrong?</h2></div>`;
  if (RISK.error || !RISK.scenarios) return `<section id="q3">${head}<div class="empty">Merge Risk isn't available: ${esc(RISK.error || "no scenarios")}</div></section>`;
  const sc = RISK.scenarios;
  const RX = ["small", "medium", "large"], DY = ["high", "medium", "low"];
  const T1 = (RISK.tables || {}).T1 || {};
  const cellRisk = (r, d) => (T1[r] || [])[["low", "medium", "high"].indexOf(d)] || "low";
  const cells = DY.map((d) => `<div class="ax y">${W[d]}</div>${RX.map((r) => `<div class="cell r-${cellRisk(r, d)}">${sc.filter((s) => s.factors.radius.level === r && s.factors.damage.level === d).map((s) =>
    `<a class="dot c-${s.factors.complexity.level}" href="#sc-${s.i}" data-sc="${s.i}" data-tip="${esc(`${s.component}: ${W[s.risk]} risk; complexity ${W[s.factors.complexity.level] || "unknown"}`)}">${s.i + 1}</a>`).join("")}</div>`).join("")}`).join("");
  const unplaced = sc.filter((s) => !RX.includes(s.factors.radius.level) || !DY.includes(s.factors.damage.level));
  const grid = `<div class="card"><div class="lbl" style="margin-bottom:8px">Each scenario by reach and damage</div><div class="grid3" role="img" aria-label="Scenarios placed by blast radius and potential damage">${cells}<div></div>${RX.map((r) => `<div class="ax">${W[r]}</div>`).join("")}</div>
    <div class="legend" style="margin-top:10px"><span>↑ potential damage</span><span>→ blast radius</span><span>ring: complexity</span>${unplaced.length ? `<span>${unplaced.length} not placed (a factor unknown)</span>` : ""}</div></div>`;
  const cr = (s) => { const f = s.criticality_from || {}; return s.criticality === "undeclared" ? `not declared${f.suggested ? ` (suggested ${f.suggested})` : ""}` : `${s.criticality}${{ declared: ", declared", review: ", the review's judgment", discovered: ", suggested" }[f.source] || ""}`; };
  const rows = (C.impact || []);
  const list = `<div class="scen">${sc.slice().sort((a, b) => (RANK[b.risk] ?? 1.5) - (RANK[a.risk] ?? 1.5)).map((s) => { const r = rows[s.i] || {};
    return `<div class="sc" id="sc-${s.i}"><span class="no">${s.i + 1}</span><span class="nm">${esc(s.component)}</span><span class="lv ${s.risk}">${W[s.risk]}</span>
      <div class="fx"><span>Reach <b>${W[s.factors.radius.level] || "Unknown"}</b></span><span>Damage <b>${W[s.factors.damage.level] || "Unknown"}</b></span><span>Complexity <b>${W[s.factors.complexity.level] || "Unknown"}</b></span><span>Importance <b>${esc(cr(s))}</b></span></div>
      <details><summary>Why, and how we'd undo it</summary><p>${md(s.factors.damage.why || "")}</p>${r.fails ? `<p><b>If it fails:</b> ${md(r.fails)}</p>` : ""}${r.notice ? `<p><b>We'd notice:</b> ${md(r.notice)}</p>` : ""}${s.recoverability ? `<p><b>Undo:</b> ${md(s.recoverability)}</p>` : ""}</details></div>`; }).join("")}</div>`;
  return `<section id="q3">${head}<p class="lede">${md(RISK.headline || "")} ${md(RISK.because || "")}</p><div class="riskwrap">${grid}${list}</div></section>`;
}

/* ---------- 4. approval ---------- */
function gateSec() {
  const head = `<div class="qhead"><span class="qno">Question 4</span><h2>Can Qodo approve it?</h2></div>`;
  const ap = RISK.approval || { reasons: [] };
  const g = CRIT.gate || { count: 0 };
  const rs = ap.reasons || [];
  const find = (re) => rs.find((r) => re.test(r)) || "";
  const steps = [
    { w: g.error ? find(/couldn't be read/) : g.count ? find(/protected paths \(/) : Object.keys(g.unseen || {}).length ? find(/weren't collected/) : g.owners_unchecked ? find(/ownership wasn't looked up/) : "No changed file is on a protected path.", pass: !g.count && !g.error && !Object.keys(g.unseen || {}).length && !g.owners_unchecked },
    { w: find(/^Risk is/), pass: /within/.test(find(/^Risk is/)) },
    { w: find(/high-severity/), pass: /^No open/.test(find(/high-severity/)) },
    { w: find(/review of the current commit|reviewed every PR/), pass: /reviewed every PR/.test(find(/review of the current commit|reviewed every PR/)) },
  ];
  const ok = ap.result === "approve";
  const prot = g.count ? `<details class="card"><summary><b>${fmt(g.count)} protected file${g.count === 1 ? "" : "s"}</b> in ${g.prs.map((k) => esc(repoName(k.split("#")[0])) + " #" + k.split("#")[1]).join(", ")}</summary><ul>${g.protected.map((f) => `<li><code>${esc(f.path)}</code> <span class="muted">${esc(f.protected_by)}</span></li>`).join("")}</ul></details>`
    : CRIT.error ? `<div class="callout stop">The criticality map couldn't be read (${esc(CRIT.error)}). Fix the <code>criticality</code> config; until then a person approves.</div>`
    : `<div class="muted" style="font-size:14px">${CRIT.has_map || CRIT.codeowners ? "The map protects none of the changed paths." : "No paths are protected: the team's map is empty and CODEOWNERS protection is off. Protect paths with <code>\"approve\": \"never\"</code> in the map, or set <code>criticality.codeowners</code> to <code>\"protect\"</code>."}</div>`;
  const gate = `<div class="gate">${steps.map((s, i) => `<div class="gstep ${s.pass ? "pass" : "fail"}"><span class="ic" aria-hidden="true">${s.pass ? "✓" : "✕"}</span><span class="w">${esc(s.w)}</span><span class="st">${s.pass ? "pass" : "stops it"}</span></div>`).join("")}
    <div class="gstep res ${ok ? "pass" : "fail"}"><span class="ic" aria-hidden="true">${ok ? "✓" : "✕"}</span><span class="w"><b>${ok ? "Qodo would approve, within the " + W[ap.limit] + " limit." : "Qodo reviews, and a person approves."}</b></span><span class="st">${ok ? "approve" : "human review"}</span></div></div>
    <div class="heads"><span class="muted">This holds for</span>${Object.entries(ap.heads || {}).map(([k, sha]) => `<code>${esc(repoName(k.split("#")[0]))}#${esc(k.split("#")[1])} ${esc(sha)}</code>`).join("")}<span class="muted">A new commit voids it.</span></div>`;
  const rb = C.rollback || {};
  const plan = rb.plan || {};
  const rbCard = `<div class="card ppl"><div class="lbl">If it has to come back out</div>${plan.steps && plan.steps.length ? `<span>${plan.steps.length} rollback step${plan.steps.length === 1 ? "" : "s"}, ${(plan.one_way || []).length} thing${(plan.one_way || []).length === 1 ? "" : "s"} a revert can't undo.</span>${(plan.one_way || []).slice(0, 2).map((o) => `<span class="muted">Can't undo: ${md(o.what)}</span>`).join("")}` : "<span>No rollback plan written.</span>"}${(rb.uncovered || []).length ? `<span style="color:var(--stop)">${rb.uncovered.length} rollback-sensitive file${rb.uncovered.length === 1 ? "" : "s"} no step covers</span>` : ""}</div>`;
  const who = (C.reviewers || []).slice(0, 4);
  const ppl = `<div class="card ppl"><div class="lbl">Who should look</div>${who.length ? who.map((r) => `<span><b>@${esc(r.login)}</b>${r.weak ? " (weak signal)" : ""} <span class="muted">${esc((r.evidence || [])[0] || "")}</span></span>`).join("") : "<span class='muted'>No suggestion yet.</span>"}</div>`;
  const opts = (Q && Q.options) || [];
  const choose = `<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="lbl">Your call</div>${Q && Q.ask ? `<p>${md(Q.ask)}</p>` : ""}
    <div class="opts">${opts.map((o, i) => `<label class="opt"><input type="radio" name="call" value="${i}"><span>${md(o)}</span></label>`).join("")}</div>
    <textarea id="why" placeholder="Why (goes with the answer)"></textarea>
    <div class="row"><button class="btn pri" data-copy-md>Copy the verdict as Markdown</button>${KIT.served ? KIT.publishHtml((C.prs || []).map((p) => p.key).slice(0, 3)) : ""}</div><pre id="mdout" hidden></pre></div>`;
  return `<section id="q4">${head}<p class="lede">Four conditions, checked separately. Any one stops automatic approval; a protected path stops it even when the rest of the PR is fine.</p>${gate}${prot}<div class="side">${rbCard}${ppl}</div>${choose}</section>`;
}

function verdictMd() {
  const pick = document.querySelector('input[name="call"]:checked');
  const ap = RISK.approval || {};
  const ro = ROUTES && ROUTES.options ? ROUTES.options.find((o) => o.id === ROUTES.chosen) : null;
  const lines = [`## Verdict: ${C.title}`, "",
    `- **Approach:** ${ro ? ro.name : "not weighed"}${ROUTES && ROUTES.reconsider ? `. Reconsider if: ${ROUTES.reconsider}` : ""}`,
    `- **Criticality:** ${(CRIT.files || []).filter((f) => f.source === "declared").length ? "declared map applied" : "nothing declared; the review's suggestions only"}`,
    `- **Merge Risk:** ${W[RISK.level] || "Unknown"}. ${RISK.because || RISK.headline || ""}`,
    `- **Auto-approval:** ${ap.result || "human review"}. ${(ap.reasons || []).join(" ")}`,
    `- **For commits:** ${Object.entries(ap.heads || {}).map(([k, s]) => `${k} ${s}`).join(", ")}`];
  if (pick) lines.push("", `**Decision:** ${Q.options[+pick.value]}`);
  const why = ($("#why") || {}).value;
  if (why && why.trim()) lines.push("", why.trim());
  return lines.join("\n");
}

/* ---------- render and wire ---------- */
$("#main").innerHTML = verdict() + routesSec() + critSec() + riskSec() + gateSec();
$("#bt").innerHTML = `<b>${esc(C.title)}</b> · Verdict`;
$("#cknav").innerHTML = KIT.navHtml(); KIT.liveBanner(document.querySelector(".bar")); KIT.freshBar(document.querySelector(".bar"), C);
const copy = async (text, btn) => {
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch (_) { const pre = $("#mdout"); pre.hidden = false; pre.textContent = text; const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected: press ⌘C"; }
  setTimeout(() => { btn.textContent = btn.dataset.copyDecl !== undefined ? "Copy" : "Copy the verdict as Markdown"; }, 2200);
};
document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-copy-decl]"); if (d) copy($("#declpre").textContent, d);
  const m = e.target.closest("[data-copy-md]"); if (m) { const t = verdictMd(); $("#mdout").hidden = false; $("#mdout").textContent = t; copy(t, m); }
  const dot = e.target.closest("[data-sc]");
  if (dot) { document.querySelectorAll(".sc.on,.dot.on").forEach((x) => x.classList.remove("on")); dot.classList.add("on"); const s = document.getElementById("sc-" + dot.dataset.sc); if (s) s.classList.add("on"); }
});
const tip = $("#tip");
const showTip = (el) => { const t = el && el.dataset.tip; if (!t) { tip.hidden = true; return; } tip.textContent = t; tip.hidden = false;
  const r = el.getBoundingClientRect(); const x = Math.min(innerWidth - tip.offsetWidth - 8, Math.max(8, r.left)); const y = r.top - tip.offsetHeight - 8 < 8 ? r.bottom + 8 : r.top - tip.offsetHeight - 8;
  tip.style.left = x + "px"; tip.style.top = y + "px"; };
document.addEventListener("mouseover", (e) => showTip(e.target.closest("[data-tip]")));
document.addEventListener("focusin", (e) => showTip(e.target.closest("[data-tip]")));
document.addEventListener("scroll", () => { tip.hidden = true; }, { passive: true });
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test((e.target.tagName || ""))) return;
  if (/^[1-4]$/.test(e.key)) { e.preventDefault(); document.getElementById("q" + e.key).scrollIntoView({ behavior: "smooth", block: "start" }); }
});
</script>
