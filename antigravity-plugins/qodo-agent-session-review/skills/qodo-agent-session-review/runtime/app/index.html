<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Session Review</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">◧</span><b>Agent Session Review</b><span id="session" class="muted mono"></span></div>
  <nav id="tabs" class="tabs" aria-label="Pull requests"></nav>
  <div class="top-actions">
    <button id="toggle-notes" class="btn ghost" aria-expanded="false" aria-controls="drawer">Notes <span id="note-count" class="count">0</span></button>
    <button id="finish" class="btn primary" title="Turn what you did in this review into memory: your preferences and confirmed knowledge">✨ Make memories</button>
  </div>
</header>
<div class="layout no-drawer">
  <main id="main" tabindex="-1"></main>
  <aside id="drawer" class="drawer" aria-label="Notes and marks"></aside>
</div>
<div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"><div id="modal-body"></div></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
