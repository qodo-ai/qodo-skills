name: Prepare skill update

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prepare-skill-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'qodo-ai/qodo-skills' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never check out the PR head, even for a same-repository PR.
      - name: Check out trusted preparation tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node on the GitHub runner
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install trusted validation dependencies
        run: npm ci --ignore-scripts

      - name: Prepare and commit generated files to the PR
        env:
          GH_TOKEN: ${{ github.token }}
          SKILL_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/run-skill-pr-preparation.mjs
