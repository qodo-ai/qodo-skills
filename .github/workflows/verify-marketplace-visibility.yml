name: 'Marketplaces: Verify listings'

on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_run:
    workflows: ['Marketplaces: Ship release']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Immutable release to inspect (empty uses latest successful shipment per provider)'
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: qodo-marketplace-visibility
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.repository == 'qodo-ai/qodo-skills' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_targets: ${{ steps.plan.outputs.has_targets }}
    steps:
      - name: Check out trusted verification automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Resolve immutable provider targets
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/plan-marketplace-verification.mjs

  verify:
    name: Verify ${{ matrix.provider }} (${{ matrix.tag }})
    needs: plan
    if: needs.plan.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted verification automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read the immutable release contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.commit }}
          path: release-source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Require exact provider-visible listings
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
          RELEASE_TAG: ${{ matrix.tag }}
          RELEASE_COMMIT: ${{ matrix.commit }}
          RELEASE_CATALOG: release-source/distribution/marketplaces.json
          SOURCE_CATALOG: distribution/marketplaces.json
        run: node scripts/verify-marketplace-visibility.mjs

      # Announce once, on the transition to visible: the 15-minute schedule
      # re-verifies the same target forever, so only post when the most recent
      # earlier run that checked this provider+tag did not pass. Manual
      # inspections of an explicit tag (no shipping run) never announce.
      # Best-effort: Slack must never fail verification.
      - name: 'slack: announce the listing is live'
        if: success() && matrix.shippingRun
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROVIDER: ${{ matrix.provider }}
          RELEASE_TAG: ${{ matrix.tag }}
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_AGENTIC_TOOLBOX_OPS_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_AGENTIC_TOOLBOX_OPS_URL not set - skipping the announcement"
            exit 0
          fi
          JOB_NAME="Verify ${PROVIDER} (${RELEASE_TAG})"
          previous=''
          for id in $(gh api "repos/${REPO}/actions/workflows/verify-marketplace-visibility.yml/runs?status=completed&per_page=30" \
                        --jq ".workflow_runs[] | select(.id != ${RUN_ID}) | .id"); do
            previous="$(gh api "repos/${REPO}/actions/runs/${id}/jobs?per_page=100" |
              jq -r --arg n "$JOB_NAME" '[.jobs[] | select(.name == $n and (.conclusion == "success" or .conclusion == "failure"))][0].conclusion // empty')"
            [ -z "$previous" ] || break
          done
          if [ "$previous" = 'success' ]; then
            echo "${JOB_NAME} was already visible in an earlier run - nothing to announce."
            exit 0
          fi
          case "$PROVIDER" in
            claude) NAME='Claude Code marketplace' ;;
            kiro) NAME='Kiro Powers directory' ;;
            *) NAME="${PROVIDER} marketplace" ;;
          esac
          jq -n --arg t "🛒 ${NAME} now serves qodo-skills ${RELEASE_TAG} · <${RUN_URL}|verification>" '{text: $t}' > "${RUNNER_TEMP}/slack.json"
          curl -sS --fail-with-body --max-time 30 \
            -X POST -H 'Content-type: application/json' \
            --data @"${RUNNER_TEMP}/slack.json" "$WEBHOOK"
