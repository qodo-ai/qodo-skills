name: 'Repository catalog: publish opt-in snapshot'

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Full main-branch commit to publish as a data-only prerelease; no marketplace release'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: qodo-repository-catalog
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.repository == 'qodo-ai/qodo-skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: skills-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Select the immutable main source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo 'Use a full lowercase commit SHA'; exit 1; }
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          git worktree add --detach "${RUNNER_TEMP}/catalog-source" "$SOURCE_COMMIT"
      - name: Publish only the data catalog
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_ROOT: ${{ runner.temp }}/catalog-source
          CATALOG_OUTPUT_DIR: ${{ runner.temp }}/repository-catalog
        run: node scripts/publish-repository-catalog.mjs
