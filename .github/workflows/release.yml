name: Release skills

on:
  push:
    branches: [main]
    paths:
      - distribution/catalog.json
      - releases/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qodo-skills-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'qodo-ai/qodo-skills'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify the release package
        run: npm test

      - name: Publish the immutable tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./distribution/catalog.json').package.version")"
          TAG="v${VERSION}"
          NOTES="${RUNNER_TEMP}/qodo-release-notes.md"
          node scripts/release-notes.mjs "${NOTES}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "${TAG}")" = "${GITHUB_SHA}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.immutable')" = 'true'
            exit 0
          fi

          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq '.enabled')" != 'true' ]]; then
            echo 'Release immutability is disabled. Enable it before creating a tag or release.' >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            if [[ "$(git rev-list -n 1 "${TAG}")" != "${GITHUB_SHA}" ]]; then
              echo "${TAG} already points to a different commit; refusing to publish." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Qodo skills ${TAG}"
            git push origin "${TAG}"
          fi

          gh release create "${TAG}" --verify-tag --title "Qodo skills ${TAG}" --notes-file "${NOTES}" \
            distribution/qodo-skills-direct.json \
            distribution/qodo-skills-direct.json.sha256 \
            distribution/qodo-skills-index.json \
            distribution/qodo-skills-index.json.sha256
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.immutable')" != 'true' ]]; then
            echo 'Published release is mutable. Enable repository release immutability before any consumer rollout.' >&2
            exit 1
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '[.assets[].name] | sort | join(" ")')" = \
            'qodo-skills-direct.json qodo-skills-direct.json.sha256 qodo-skills-index.json qodo-skills-index.json.sha256'
