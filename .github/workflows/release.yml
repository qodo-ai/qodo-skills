name: Release skills

on:
  push:
    branches: [main]
    paths:
      - distribution/catalog.json
      - releases/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qodo-skills-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'qodo-ai/qodo-skills'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify the release package
        run: npm test

      - name: Publish the immutable tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./distribution/catalog.json').package.version")"
          TAG="v${VERSION}"
          NOTES="${RUNNER_TEMP}/qodo-release-notes.md"
          node scripts/release-notes.mjs "${NOTES}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            exit 0
          fi

          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Qodo skills ${TAG}"
            git push origin "${TAG}"
          fi

          gh release create "${TAG}" --verify-tag --title "Qodo skills ${TAG}" --notes-file "${NOTES}"

      - name: Open the version-pinned Codex import train
        env:
          GH_TOKEN: ${{ secrets.QODO_IN_HARNESS_DISPATCH_TOKEN }}
        run: |
          test -n "${GH_TOKEN}" || { echo "QODO_IN_HARNESS_DISPATCH_TOKEN is required" >&2; exit 1; }
          VERSION="$(node -p "require('./distribution/catalog.json').package.version")"
          gh api --method POST repos/qodo-ai/qodo-in-harness/dispatches \
            -f event_type=qodo-skills-released \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[tag]=v${VERSION}" \
            -f "client_payload[sha]=${GITHUB_SHA}"
