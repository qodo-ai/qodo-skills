name: 'Release: Publish skills'

on:
  push:
    branches: [main]
    paths: ['releases/v*.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qodo-skills-release
  cancel-in-progress: false

jobs:
  # Nudge #agentic-toolbox-ops once if the skills-release approval sits
  # unclicked for 15 minutes. Runs beside `release` and exits as soon as the
  # gate resolves. Best-effort: it can never fail or block the release.
  approval-reminder:
    if: >-
      github.repository == 'qodo-ai/qodo-skills' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: 'slack: remind if release approval is pending'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ENVIRONMENTS: skills-release
          SUBJECT: qodo-skills release
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_AGENTIC_TOOLBOX_OPS_URL }}
        run: .github/scripts/pending-approval-reminder.sh

  release:
    if: >-
      github.repository == 'qodo-ai/qodo-skills' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: skills-release
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate release tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in gh git node npm mktemp sha256sum cmp rm; do
            command -v "${tool}" >/dev/null 2>&1 || {
              echo "Release requires '${tool}', but it is not available on this runner." >&2
              exit 1
            }
          done

      - name: Require the captured release commit to belong to main
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "$(git rev-parse origin/main)"; then
            echo 'Refusing to publish: the captured release commit is not on main.' >&2
            exit 1
          fi

      - name: Resolve the immutable release source commit
        id: release-source
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./distribution/catalog.json').package.version")"
          TAG="v${VERSION}"
          RELEASE_COMMIT="${GITHUB_SHA}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
            if [[ "$(git cat-file -t "refs/tags/${TAG}")" != 'tag' ]]; then
              echo "${TAG} is not an annotated tag; refusing recovery." >&2
              exit 1
            fi
            RELEASE_COMMIT="$(git rev-parse "refs/tags/${TAG}^{}")"
            if ! git merge-base --is-ancestor "${RELEASE_COMMIT}" "${GITHUB_SHA}"; then
              echo "${TAG} is not an ancestor of current main; refusing recovery." >&2
              exit 1
            fi
          fi
          echo "commit=${RELEASE_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Install locked validation dependencies
        run: npm ci

      - name: Verify the release package
        env:
          QODO_SKILLS_TEST_MODE: committed
        run: npm test

      - name: Require dedicated release App configuration
        env:
          RELEASE_APP_ID: ${{ vars.QODO_SKILLS_RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.QODO_SKILLS_RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_APP_ID}" =~ ^[0-9]+$ ]] || { echo 'QODO_SKILLS_RELEASE_APP_ID must be configured in skills-release.' >&2; exit 1; }
          test -n "${RELEASE_APP_PRIVATE_KEY}" || { echo 'QODO_SKILLS_RELEASE_APP_PRIVATE_KEY must be configured in skills-release.' >&2; exit 1; }

      - name: Mint installation-wide read-only release preflight token
        id: release-preflight-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.QODO_SKILLS_RELEASE_APP_ID }}
          private-key: ${{ secrets.QODO_SKILLS_RELEASE_APP_PRIVATE_KEY }}
          owner: qodo-ai
          permission-administration: read

      - name: Verify runtime release prerequisites
        env:
          GH_TOKEN: ${{ steps.release-preflight-token.outputs.token }}
        run: scripts/verify-release-prerequisites.sh

      - name: Materialize the immutable release source
        env:
          RELEASE_COMMIT: ${{ steps.release-source.outputs.commit }}
        run: |
          set -euo pipefail
          RELEASE_SOURCE_DIR="${RUNNER_TEMP}/qodo-release-source"
          git worktree add --detach "${RELEASE_SOURCE_DIR}" "${RELEASE_COMMIT}"
          test "$(git -C "${RELEASE_SOURCE_DIR}" rev-parse HEAD)" = "${RELEASE_COMMIT}"
          test -z "$(git -C "${RELEASE_SOURCE_DIR}" status --porcelain --untracked-files=all)"

      - name: Build deterministic release assets from the immutable source
        env:
          RELEASE_COMMIT: ${{ steps.release-source.outputs.commit }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix "${RUNNER_TEMP}/qodo-release-source"
          node "${RUNNER_TEMP}/qodo-release-source/scripts/build-release-index.mjs" \
            --output-dir "${RUNNER_TEMP}/qodo-release-index" \
            --source-commit "${RELEASE_COMMIT}"
          node "${RUNNER_TEMP}/qodo-release-source/scripts/build-enterprise-bundle.mjs" \
            --output "${RUNNER_TEMP}/qodo-enterprise-release" \
            --commit "${RELEASE_COMMIT}" \
            --release-index "${RUNNER_TEMP}/qodo-release-index/qodo-skills-index.json"
          CATALOG_EXPECTED="$(node -p 'require("node:fs").readFileSync(process.argv[1], "utf8").includes("qodo-repository-catalog.json")' "${RUNNER_TEMP}/qodo-release-source/scripts/publish-release.sh")"
          if [[ "${CATALOG_EXPECTED}" == true ]]; then
            node "${RUNNER_TEMP}/qodo-release-source/scripts/build-repository-catalog.mjs" \
              --output-dir "${RUNNER_TEMP}/qodo-enterprise-release" \
              --source-commit "${RELEASE_COMMIT}"
          fi
          node "${RUNNER_TEMP}/qodo-release-source/scripts/release-notes.mjs" \
            "${RUNNER_TEMP}/qodo-release-notes.md"

      - name: Publish the immutable tag and GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          QODO_ENTERPRISE_RELEASE_DIR: ${{ runner.temp }}/qodo-enterprise-release
          QODO_RELEASE_COMMIT: ${{ steps.release-source.outputs.commit }}
          QODO_RELEASE_NOTES_FILE: ${{ runner.temp }}/qodo-release-notes.md
          QODO_RELEASE_SOURCE_DIR: ${{ runner.temp }}/qodo-release-source
          QODO_RELEASE_INDEX_DIR: ${{ runner.temp }}/qodo-release-index
        run: scripts/publish-release.sh

      # Short announcement to #agentic-toolbox-ops. `always()` so a failure
      # after approval is reported rather than silent. Best-effort: Slack must
      # never red-X a release that published.
      - name: 'slack: announce the release'
        if: always()
        continue-on-error: true
        env:
          TAG: ${{ steps.release-source.outputs.tag }}
          STATUS: ${{ job.status }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_AGENTIC_TOOLBOX_OPS_URL }}
        run: |
          set -euo pipefail
          TEXT=''
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_AGENTIC_TOOLBOX_OPS_URL not set - skipping the announcement"
          elif [ "$STATUS" = 'success' ]; then
            TEXT="📦 qodo-skills ${TAG} released · <${SERVER_URL}/${REPO}/releases/tag/${TAG}|release notes> · by ${ACTOR}"
          elif [ "$PUBLISH_OUTCOME" = 'failure' ] && [ -n "${TAG:-}" ]; then
            # This run reached publication; say whether the release went public.
            IS_DRAFT="$(timeout 30 gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
            case "$IS_DRAFT" in
              false) TEXT="⚠️ qodo-skills ${TAG} is public, but this release run failed · <${RUN_URL}|view the run>" ;;
              true) TEXT="⛔ qodo-skills ${TAG} release did NOT complete (left as a draft) · <${RUN_URL}|view the run>" ;;
              *) TEXT="⛔ qodo-skills ${TAG} publication failed; could not confirm whether it is public · <${RUN_URL}|view the run>" ;;
            esac
          else
            TEXT="⛔ qodo-skills ${TAG:-(version unresolved)} release did NOT complete (${STATUS}) · <${RUN_URL}|view the run>"
          fi
          if [ -n "$TEXT" ]; then
            jq -n --arg t "$TEXT" '{text: $t}' > "${RUNNER_TEMP}/slack.json"
            curl -sS --fail-with-body --max-time 30 \
              -X POST -H 'Content-type: application/json' \
              --data @"${RUNNER_TEMP}/slack.json" "$WEBHOOK"
          fi

  # Tell #agentic-toolbox-ops when a reviewer rejects the skills-release
  # approval, so nobody re-runs or re-approves it without checking why. A
  # failure after approval is announced by the release job itself, so this
  # posts only for a rejection. Best-effort: it can never fail the release.
  announce-rejection:
    needs: release
    if: failure() && github.repository == 'qodo-ai/qodo-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: read
    steps:
      - name: 'slack: announce a rejected release'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_AGENTIC_TOOLBOX_OPS_URL }}
        run: |
          set -euo pipefail
          # The latest rejection of this run's skills-release gate, as "login<TAB>comment".
          REJECTION="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/approvals" --jq '
            [ .[] | select(.state == "rejected" and any(.environments[]; .name == "skills-release")) ]
            | last | select(. != null) | [.user.login, (.comment // "")] | @tsv')"
          if [ -z "$REJECTION" ]; then
            echo "The release was not rejected; nothing to announce."
          elif [ -z "${WEBHOOK:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_AGENTIC_TOOLBOX_OPS_URL not set - skipping the rejection notice"
          else
            IFS=$'\t' read -r WHO WHY <<<"$REJECTION"
            # Slack treats &, < and > as markup; escape the free-text comment.
            WHY="$(printf '%s' "$WHY" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"
            TEXT="🚫 qodo-skills release rejected by ${WHO}${WHY:+: “${WHY}”} · check with them before re-running or re-approving · <${RUN_URL}|view the run>"
            jq -n --arg t "$TEXT" '{text: $t}' > "${RUNNER_TEMP}/slack.json"
            curl -sS --fail-with-body --max-time 30 \
              -X POST -H 'Content-type: application/json' \
              --data @"${RUNNER_TEMP}/slack.json" "$WEBHOOK"
          fi
