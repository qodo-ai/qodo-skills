<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Review Console: dark in both of the viewer's themes, on purpose (the views are described in README). */
:root{
  --bg:#141414; --panel:#1C1C1C; --raised:#212121; --chip:#252525; --hover:#2A2A2A;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14); --line3:rgba(255,255,255,.28);
  --ink:#FFFFFF; --ink2:#E6E6E6; --ink3:#C9C9C9; --muted:#A6A6A6; --faint:#8F8F8F; --dim:#5E5E5E;
  --accent:#7968FA; --accent-hover:#8A7BFB; --accent-text:#BDB5FD; --accent-soft:rgba(121,104,250,.16); --accent-line:rgba(156,143,251,.45);
  --mint:#87F5D8; --sky:#89CDF3; --vio:#BB68FA; --lime:#D2E534; --pink:#F92672; --amber:#E8B86A;
  --add-bg:rgba(135,245,216,.10); --add-bar:rgba(135,245,216,.7); --del-bg:rgba(249,38,114,.12); --del-bar:rgba(249,38,114,.75);
  /* the names kit.js styles its switcher and diagram explorer with */
  --surface:#1C1C1C; --sunk:#252525; --warn:#E8B86A; --hl:rgba(210,229,52,.14);
  --shadow:0 4px 12px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.3);
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:var(--bg); color:var(--ink2); font:15px/1.5 var(--f-body); font-feature-settings:"cv11","ss01"}
a{color:var(--accent-text); text-decoration:none} a:hover{color:#D6D1FF}
button,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
code{font:.86em var(--f-mono); background:var(--chip); padding:.05em .35em; border-radius:4px; color:var(--ink2)}
h1,h2,h3{margin:0; color:var(--ink); line-height:1.2; text-wrap:balance; font-weight:600; letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.mono{font-family:var(--f-mono)}
.n{font-variant-numeric:tabular-nums}
.eb{font:600 11.5px/1.2 var(--f-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.eb.v{color:var(--accent-text)} .eb.l{color:var(--lime)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.wrap{max-width:1240px; margin:0 auto; padding-inline:24px}
.btn{display:inline-flex; gap:8px; align-items:center; border:1px solid var(--line2); background:transparent; color:var(--ink); border-radius:8px; padding:8px 12px; font:500 13.5px/1 var(--f-body); white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.on{border-color:rgba(255,255,255,.45); background:rgba(255,255,255,.08)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#fff; font:600 12.5px/1 var(--f-mono); letter-spacing:.1em; text-transform:uppercase; padding:11px 16px}
.btn.pri:hover{background:var(--accent-hover)}
.btn.mono{font:500 12px/1 var(--f-mono)}
.btn.read{border-color:rgba(135,245,216,.5); background:rgba(135,245,216,.10); color:var(--mint)}
.seg{font:500 13px/1 var(--f-body); padding:8px 12px; border-radius:8px; border:1px solid var(--line2); background:transparent; color:var(--ink3); white-space:nowrap; text-align:left}
.seg:hover{background:rgba(255,255,255,.04)}
.seg[aria-pressed="true"]{border-color:rgba(255,255,255,.5); background:rgba(255,255,255,.08); color:#fff}
.seg.good[aria-pressed="true"]{border-color:var(--mint)} .seg.bad[aria-pressed="true"]{border-color:var(--pink)}
.segs{display:flex; flex-wrap:wrap; gap:8px}
.bar{display:block; height:4px; border-radius:999px; background:#333; overflow:hidden; min-width:60px}
.bar > i{display:block; height:100%; background:var(--mint); border-radius:999px; transition:width .7s var(--ease)}

/* status glyphs: the reviewer's state of a layer, PR, lane or the whole review */
.g{display:inline-block; flex:none; width:12px; height:12px; border-radius:999px; border:1.5px solid #5E5E5E}
.g.sm{width:9px; height:9px} .g.xs{width:8px; height:8px}
.g.exploring{border-color:var(--sky); background:linear-gradient(90deg, var(--sky) 50%, transparent 50%)}
.g.waiting{border-color:var(--vio); background:radial-gradient(circle, var(--vio) 0 30%, transparent 34%)}
.g.verified{border-color:var(--mint); background:var(--mint)}
.g.concern{border-color:var(--pink); background:var(--pink)}
.pill{display:inline-flex; gap:8px; align-items:center; font:600 11.5px/1 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; color:var(--muted)}
.pill.exploring{color:var(--sky)} .pill.waiting{color:var(--vio)} .pill.verified{color:var(--mint)} .pill.concern{color:var(--pink)}
.tk{display:inline-block; font:600 10.5px/1 var(--f-mono); letter-spacing:.1em; text-transform:uppercase; border:1px solid; border-radius:4px; padding:4px 6px; white-space:nowrap}
.tk.risk,.tk.high,.tk.critical{color:var(--pink); border-color:var(--pink)}
.tk.gap,.tk.medium{color:var(--amber); border-color:rgba(232,184,106,.5)}
.tk.decision{color:var(--accent-text); border-color:var(--accent-line)}
.tk.good{color:var(--mint); border-color:rgba(135,245,216,.5)}
.tk.low,.tk.info,.tk.plain{color:var(--muted); border-color:var(--line2)}
.tk.lime{color:var(--lime); border-color:var(--lime)}

/* ---------- header ---------- */
header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:rgba(20,20,20,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.crumb{display:flex; gap:10px; align-items:center; padding-block:12px; font-size:14.5px; color:var(--ink2); border-bottom:1px solid var(--line); flex-wrap:wrap}
.crumb .sep{color:var(--dim)} .crumb .tt{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1 1 200px}
.crumb .tt .mono{font-size:12px; color:var(--faint); margin-left:6px}
.trow{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
nav.views{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; flex:1 1 auto}
nav.views button{font:500 14.5px/1 var(--f-body); padding:16px 8px 14px; border:0; border-bottom:2px solid transparent; margin-bottom:-1px; background:none; color:var(--ink3); white-space:nowrap; transition:color .2s var(--ease), border-color .2s var(--ease)}
nav.views button:hover{color:#fff}
nav.views button[aria-selected="true"]{color:var(--accent-text); border-bottom-color:var(--accent)}
.prog{display:flex; gap:12px; align-items:center; font:500 12.5px/1 var(--f-mono); color:var(--ink3); white-space:nowrap}
.prog .bar{width:140px}
.nbtn .c{color:var(--muted); font-variant-numeric:tabular-nums}
main{padding-block:32px 120px}
body.notes-open main, body.notes-open header .wrap{padding-right:384px}

/* ---------- overview ---------- */
.hero{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px 24px; align-items:end; padding-bottom:28px; border-bottom:1px solid var(--line)}
.hero h1{font-size:32px; margin-top:12px}
.hero p{margin:10px 0 0; font-size:17px; color:var(--ink2); max-width:70ch}
.meta{display:flex; gap:10px 18px; flex-wrap:wrap; align-items:center; margin-top:16px; font:500 12.5px/1 var(--f-mono); color:var(--ink3)}
.cols{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:24px 48px; padding-block:24px 28px}
.cols > div{display:flex; flex-direction:column; gap:12px; min-width:0}
.prose p{margin:0; font-size:15.5px; line-height:1.55; color:var(--ink2); max-width:68ch}
.prose .eb{margin-top:10px}
.src{display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink2)}
.src:hover{background:var(--chip); color:var(--ink)}
.src .ic{width:24px; height:24px; border-radius:6px; background:var(--chip); display:grid; place-items:center; font:600 11px/1 var(--f-mono); color:var(--ink3)}
.src b{font-weight:500; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.src .k{font:600 10.5px/1.4 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
.src .u{font:500 11.5px/1 var(--f-mono); color:var(--faint); white-space:nowrap}
.look{display:flex; flex-direction:column}
.look button{display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:4px 10px; align-items:baseline; text-align:left; border:0; border-bottom:1px solid var(--line); background:none; padding:12px 8px; margin:0 -8px; border-radius:8px; color:var(--ink2)}
.look button:hover{background:rgba(255,255,255,.04)}
.look .no{font:500 12px/1 var(--f-mono); color:var(--faint)}
.look b{font-weight:500; color:var(--ink); font-size:15px}
.look p{grid-column:2 / -1; margin:0; color:var(--muted); font-size:14px; line-height:1.45}
.look .go{font:500 12px/1 var(--f-mono); color:var(--accent-text); white-space:nowrap}
.scopeln{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--panel); font-size:14px}
.scopeln p{flex-basis:100%; margin:0; color:var(--muted)}

/* merge lanes */
.lanes{background:var(--panel); border-radius:20px; padding:22px 26px 14px; display:flex; flex-direction:column; gap:6px}
.lanes > .h{display:flex; justify-content:space-between; align-items:center; gap:12px; padding-bottom:10px}
.lane{border-radius:14px; border:1px solid transparent; transition:background .2s var(--ease), border-color .2s var(--ease)}
.lane.open{background:var(--raised); border-color:rgba(255,255,255,.10)}
.lane > .hd{display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:4px 16px; align-items:center; width:100%; text-align:left; border:0; background:none; padding:16px 12px; color:var(--ink2)}
.ord{width:28px; height:28px; border-radius:999px; display:grid; place-items:center; font:600 12px/1 var(--f-mono); border:1.5px solid var(--line3); color:var(--ink2)}
.ord.done{background:var(--mint); border-color:var(--mint); color:var(--bg)}
.ord.free{border-style:dashed; color:var(--faint)}
.lane .tt b{font-size:17px; color:var(--ink); font-weight:600}
.lane .tt .eb{margin-left:10px; font-size:10.5px}
.lane .tt .sub{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:6px; font-size:14px; color:var(--ink3)}
.dots{display:inline-flex; gap:4px; align-items:center}
.lane .rt{display:flex; gap:14px; align-items:center}
.lane .rt .bar{width:90px}
.lane .rt .ct{font:500 12.5px/1 var(--f-mono); color:var(--ink3); min-width:74px; text-align:right}
.caret{width:24px; height:24px; border-radius:6px; border:1px solid var(--line2); display:grid; place-items:center; color:var(--ink3); font:500 14px/1 var(--f-mono); flex:none}
.lane .body{padding:0 12px 14px 56px; display:flex; flex-direction:column; gap:10px}
.prs{position:relative; display:flex; flex-direction:column; gap:2px}
.prrow{display:grid; grid-template-columns:14px max-content minmax(0,1fr) 96px minmax(120px,auto); gap:14px; align-items:center; padding:9px 12px; border-radius:10px; border:1px solid transparent; background:none; text-align:left; width:100%; color:var(--ink2)}
.prrow:hover{background:rgba(255,255,255,.04)}
.prrow.on{background:var(--hover); border-color:rgba(255,255,255,.18)}
.prrow .num{font:500 12.5px/1 var(--f-mono); color:var(--ink3)}
.prrow .tl{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px}
.prrow .tl .on{font:500 11px/1 var(--f-mono); color:var(--faint); margin-right:8px}
.lsegs{display:flex; gap:3px} .lsegs i{flex:1; height:3px; border-radius:2px; background:#3A3A3A} .lsegs i.exploring{background:var(--sky)} .lsegs i.verified{background:var(--mint)}
.prrow .pill{justify-content:flex-end}
.prmap{margin:6px 0 10px; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:var(--panel); display:flex; flex-direction:column; gap:12px}
.prmap .h{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.prmap p{margin:0; color:var(--ink3); font-size:14px; max-width:80ch}
.prmap .btn.pri{padding:8px 12px; font-size:11.5px}

/* the layer graph: one node per layer, an arrow where a layer builds on another */
.lg{overflow-x:auto; padding:4px 2px 8px}
.lg .cv{position:relative; flex:none}
.lg svg{position:absolute; inset:0; overflow:visible; pointer-events:none}
.lg path{fill:none; stroke:#7A7A7A; stroke-width:1.25; transition:opacity .2s var(--ease), stroke .2s var(--ease)}
.lg path.hit{stroke:#9C8FFB; stroke-width:1.75}
.lg path.dim{opacity:.3}
.nd{position:absolute; width:188px; height:80px; padding:9px 10px; border-radius:12px; border:1px solid transparent; background:var(--chip); text-align:left; display:flex; flex-direction:column; justify-content:space-between; gap:6px; color:var(--ink2); transition:opacity .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease)}
.nd:hover{border-color:var(--accent-line)}
.nd.on{background:#2A2640; border-color:var(--accent); box-shadow:0 0 0 3px rgba(121,104,250,.25); z-index:2}
.nd.near{border-color:rgba(156,143,251,.4)} .nd.dim{opacity:.4}
.nd .t{font-size:13px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.nd .t .no{font:500 11px/1 var(--f-mono); color:var(--faint); margin-right:5px}
.nd .f{display:flex; justify-content:space-between; align-items:center; font:600 10px/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
.lg .box{position:absolute; border:1px dashed rgba(255,255,255,.2); border-radius:12px}
.lg .box span{position:absolute; top:6px; left:10px; font:600 9.5px/1 var(--f-mono); letter-spacing:.1em; color:var(--faint)}

/* ---------- walkthrough ---------- */
.trail{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:14px; color:var(--ink3)}
.trail button{border:0; background:none; padding:0; color:var(--ink3)} .trail button:hover{color:#fff}
.trail .sep{color:var(--dim)}
.prhead{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px 24px; align-items:end; margin:22px 0 24px}
.prhead h1{font-size:28px; margin-top:10px; max-width:36ch}
.prhead .meta{margin-top:14px; font-size:13px}
.prhead .meta .a{color:var(--mint)} .prhead .meta .d{color:var(--pink)}
.pn{display:flex; gap:8px}
.ws{display:grid; grid-template-columns:clamp(220px,22vw,290px) minmax(0,1fr); gap:24px; align-items:start}
.ws.shut{grid-template-columns:48px minmax(0,1fr)}
.side{position:sticky; top:130px; max-height:calc(100vh - 150px); overflow:auto; background:var(--panel); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:14px; scrollbar-width:thin}
.side .h{display:flex; justify-content:space-between; align-items:center}
.side .tog{width:26px; height:26px; border-radius:7px; border:1px solid var(--line2); background:none; color:var(--ink3); display:grid; place-items:center; font:500 13px/1 var(--f-mono)}
.ws.shut .side{padding:10px; align-items:center}
.ws.shut .side > :not(.h){display:none}
.ws.shut .side .h .eb{display:none}
.rung{display:flex; flex-direction:column; gap:6px; padding:8px 10px; border-radius:8px; border:0; background:none; text-align:left; color:var(--ink2); width:100%}
.rung:hover{background:rgba(255,255,255,.04)}
.rung .eb{display:flex; gap:8px; align-items:center; font-size:10.5px}
.rung b{font-weight:500; font-size:13.5px; line-height:1.3; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rung.on{background:var(--accent-soft)} .rung.on .eb{color:var(--accent-text)}
.rung.l1{margin-left:12px; border-left:1px solid var(--line2); border-radius:0 8px 8px 0}
.rung.l2{margin-left:24px; border-left:1px solid var(--line2); border-radius:0 8px 8px 0}
.path{display:flex; flex-direction:column; border-top:1px solid var(--line); padding-top:12px}
.path > summary{list-style:none; cursor:pointer; padding-bottom:10px} .path > summary::-webkit-details-marker{display:none}
.path[open] > summary .more{display:none} .path > summary .more{color:var(--accent-text); margin-left:8px}
.path > div{display:flex; flex-direction:column}
.path .grp{font:600 10.5px/1.3 var(--f-mono); letter-spacing:.1em; color:var(--accent-text); padding:10px 0 8px}
.path .grp:first-child{padding-top:0}
.stp{display:grid; grid-template-columns:22px minmax(0,1fr); gap:10px; border:0; background:none; text-align:left; padding:0; color:var(--ink3)}
.stp .rail{display:flex; flex-direction:column; align-items:center}
.stp .dot{width:22px; height:22px; border-radius:999px; border:1.5px solid #4A4A4A; display:grid; place-items:center; font:600 11px/1 var(--f-mono); color:var(--faint); transition:background .24s var(--ease), border-color .24s var(--ease)}
.stp .ln{width:1.5px; flex:1; min-height:12px; background:rgba(255,255,255,.10)}
.stp.done .dot{background:var(--mint); border-color:var(--mint); color:var(--bg)} .stp.done .ln{background:rgba(135,245,216,.45)}
.stp.on .dot{background:var(--accent); border-color:var(--accent); color:#fff; animation:ring 1.4s ease-out 2}
.stp .lb{padding:2px 0 14px; display:flex; flex-direction:column; gap:5px; min-width:0}
.stp .lb span{font-size:14px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.stp.on .lb span{color:#fff} .stp.done .lb span{color:var(--muted)}
.stp .lb small{font:600 10px/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
.stp:last-child .ln{background:transparent}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(121,104,250,.55)}100%{box-shadow:0 0 0 9px rgba(121,104,250,0)}}
.ptabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; overflow-x:auto; scrollbar-width:none}
.ptabs button{font:500 14px/1 var(--f-body); padding:12px 14px; border:0; border-bottom:2px solid transparent; margin-bottom:-1px; background:none; color:var(--muted); white-space:nowrap}
.ptabs button[aria-selected="true"]{color:#fff; border-bottom-color:var(--accent)}
.ptabs .c{font:500 11px/1 var(--f-mono); color:var(--faint); margin-left:6px}
.strip{background:var(--panel); border-radius:14px; padding:12px 14px; margin-bottom:16px}
.card{position:relative; background:var(--panel); border:1px solid var(--line2); border-radius:16px; padding:22px 22px 20px; display:flex; flex-direction:column; gap:16px; animation:cardin .42s var(--ease) both}
@keyframes cardin{from{opacity:0; transform:translateY(18px) scale(.98)} to{opacity:1; transform:none}}
.card h2{font-size:22px}
.card .sec{display:flex; flex-direction:column; gap:8px}
.card .sec > p{margin:0; font-size:15px; line-height:1.55; color:var(--ink2); max-width:78ch}
.hold{border:1px solid rgba(210,229,52,.45); border-radius:12px; padding:12px 14px; display:grid; grid-template-columns:auto minmax(0,1fr); gap:8px 16px; align-items:baseline; background:rgba(210,229,52,.04)}
.hold .eb{font-size:10.5px}
.hold ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; font-size:14.5px; color:var(--ink)}
.hold li .where{font:500 11.5px/1 var(--f-mono); color:var(--faint); margin-left:6px}
.rel{display:grid; grid-template-columns:110px minmax(0,1fr); gap:8px 14px; padding:10px 6px; border-top:1px solid var(--line); font-size:14px}
.rel:first-of-type{border-top:0}
.rel button{border:0; background:none; padding:0; text-align:left; color:var(--ink)} .rel button:hover{color:var(--accent-text)}
.rel .no{font:500 11.5px/1 var(--f-mono); color:var(--faint); margin-right:6px}
.via{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px} .via code{font-size:11.5px; background:var(--chip); border:1px solid var(--line)}
.code-split{display:grid; grid-template-columns:minmax(150px,210px) minmax(0,1fr); border:1px solid var(--line2); border-radius:12px; overflow:hidden; background:var(--bg)}
.tree{border-right:1px solid var(--line); padding:10px 6px; display:flex; flex-direction:column; gap:2px; max-height:520px; overflow:auto; scrollbar-width:thin}
.tree .k{font:600 10.5px/1 var(--f-mono); letter-spacing:.1em; color:var(--accent-text); padding:8px 8px 6px}

<script>
(() => {
const { esc, md, cases, caseIds, base, codeHtml, store, sevRank } = KIT;
const C = cases[caseIds[0]];
const $ = (s) => document.querySelector(s);
const SKEY = "console:" + C.session;
const S = Object.assign({ view: "map", pr: null, tab: "guide", lf: null, step: {}, read: {}, done: {}, visited: {}, weigh: {}, conf: {}, verdict: {}, picks: {}, notes: [], file: {}, lane: {}, openPr: null, side: true, nk: "note" }, store.get(SKEY, {}));
S.notesOpen = false;
const save = () => { const { notesOpen, ...rest } = S; store.set(SKEY, rest); };
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); };
const strip = (t) => String(t || "").replace(/^(feat|fix|chore|refactor|docs|test)(\([^)]*\))?!?:\s*/i, "");
const multiRepo = new Set(C.prs.map((p) => p.repo)).size > 1;
const shortPr = (k) => (multiRepo ? k.split("/")[1].replace("#", " #") : "#" + k.split("#")[1]);
const P = Object.fromEntries(C.prs.map((p) => [p.key, p]));
const isOpen = (f) => !f.status || f.status === "open";
const story = C.story || [];
const beat = (kind) => story.find((b) => b.kind === kind);
const NOTICE = beat("notice"), BRIEF = beat("brief"), VIEWS = beat("views"), SCOPE = beat("scope");
/* the decisions: the session's questions, then each PR chapter's; an answer is keyed by its story, since beat ids
   are only unique within one story */
const QS = story.filter((b) => b.kind === "question").map((q) => ({ q, key: "s|" + q.id, pr: null }))
  .concat(C.prs.flatMap((p) => (p.story || []).filter((b) => b.kind === "question").map((q) => ({ q, key: p.key + "|" + q.id, pr: p.key }))));
const ADDS = Object.fromEntries(((BRIEF && BRIEF.contributions) || []).map((x) => [x.pr, x.adds]));
const pl = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const ST = { unexplored: "Not started", exploring: "In progress", waiting: "Almost verified", verified: "Verified", concern: "Blocked by concern" };
const glyph = (st, sz = "") => `<i class="g ${sz} ${st}" aria-hidden="true"></i>`;
const pill = (st) => `<span class="pill ${st}">${glyph(st, "sm")}${st === "verified" ? "✓ " : ""}${ST[st]}</span>`;
const bar = (a, b) => `<span class="bar" aria-hidden="true"><i style="width:${b ? (100 * a) / b : 0}%"></i></span>`;
const isTest = (p, path) => { const f = p.files.find((x) => x.path === path); return (f && f.role === "test") || /(^|\/)(tests?|__tests__|spec)\/|(^|\/)test_[^/]*$|_test\.\w+$|\.(test|spec)\.\w+$/.test(path); };
const bkey = (p, b) => p.key + "|" + b.id;

/* ---------- layers: each PR's layers (from the skill), each holding the blocks of code to read ---------- */
function layersOf(p) {
  const L = p.layers || [], rest = { title: L.length ? "Other changes" : "The changes", summary: "", layer: null, blocks: [] };
  const us = L.map((l) => ({ title: l.title, summary: l.summary, layer: l, blocks: [] }));
  (p.attention.blocks || []).filter((b) => b.tier === "deep" || b.tier === "review").forEach((b) => (us[b.layer] || rest).blocks.push(b));
  us.push(rest);
  const kept = us.filter((u) => u.blocks.length);
  kept.forEach((u, k) => {
    const at = ((u.layer && u.layer.ranges) || []).map((r) => r.path), pos = (b) => at.indexOf(b.path) + 1 || 1e3;
    u.blocks.sort((a, b) => pos(a) - pos(b) || a.path.localeCompare(b.path) || a.from - b.from);
    Object.assign(u, { p, k, id: p.key + "|" + k, files: [...new Set(u.blocks.map((b) => b.path))],
      holds: ((u.layer && u.layer.ranges) || []).filter((r) => r.note).map((r) => ({ text: r.note, where: `${base(r.path)}:${r.from}` })) });
  });
  // links: a layer that depends on another builds on it (the skill's depends_on)
  const idx = Object.fromEntries(kept.filter((u) => u.layer && u.layer.id).map((u) => [u.layer.id, u.k]));
  const links = [];
  kept.forEach((u) => ((u.layer && u.layer.depends_on) || []).forEach((d) => { if (idx[d] != null && idx[d] !== u.k) links.push({ from: idx[d], to: u.k }); }));
  return { units: kept, links };
}
const LAY = Object.fromEntries(C.prs.map((p) => [p.key, layersOf(p)]));
const units = (p) => LAY[p.key].units;
const lRead = (u) => [u.blocks.filter((b) => S.read[bkey(u.p, b)]).length, u.blocks.length];
const lSt = (u) => { const [a, b] = lRead(u); return a && a === b ? "verified" : a ? "exploring" : "unexplored"; };
const highs = (p) => p.findings.filter((f) => isOpen(f) && (f.severity === "high" || f.severity === "critical"));
const weighed = (p) => highs(p).every((f) => S.weigh[f.id]);
const blocked = (k) => S.notes.some((n) => n.kind === "blocking" && n.target === k);
function pSt(p) {
  if (blocked(p.key)) return "concern";
  const us = units(p), all = us.length ? us.every((u) => lSt(u) === "verified") : !!S.visited[p.key];
  if (all) return weighed(p) ? "verified" : "waiting";
  return S.visited[p.key] || us.some((u) => lSt(u) !== "unexplored") ? "exploring" : "unexplored";
}
const rollup = (ks) => ks.includes("concern") ? "concern" : ks.length && ks.every((x) => x === "verified") ? "verified" : ks.length && ks.every((x) => x === "verified" || x === "waiting") ? "waiting" : ks.some((x) => x !== "unexplored") ? "exploring" : "unexplored";
const count = (ps) => ps.reduce((a, p) => { units(p).forEach((u) => { a[1]++; if (lSt(u) === "verified") a[0]++; }); return a; }, [0, 0]);

/* ---------- merge lanes: each stack is a lane merged bottom-up; lanes merge in parallel; the rest any order ---------- */
const LANES = (() => {
  const at = (k) => C.prs.findIndex((p) => p.key === k), parent = {}, kids = {};
  (C.stacks || []).forEach((st) => st.forEach((k, i) => { if (i && P[k] && !parent[k]) { parent[k] = st[i - 1]; const c = (kids[st[i - 1]] = kids[st[i - 1]] || []); if (!c.includes(k)) c.push(k); } }));
  const seen = new Set();
  const walk = (k, out) => { if (seen.has(k) || !P[k]) return out; seen.add(k); out.push(P[k]); (kids[k] || []).sort((x, y) => at(x) - at(y)).forEach((c) => walk(c, out)); return out; };
  const roots = [...new Set((C.stacks || []).map((st) => st.find((k) => P[k])).filter(Boolean))].filter((r) => !parent[r]).sort((x, y) => at(x) - at(y));
  const L = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const lanes = roots.map((r) => walk(r, [])).filter((l) => l.length > 0).map((prs, i) => ({ id: "lane" + i, label: "Lane " + (L[i] || i + 1), prs, stacked: true }));
  const lone = C.prs.filter((p) => !lanes.some((l) => l.prs.includes(p)));
  if (lone.length) lanes.push({ id: "free", label: lanes.length ? "Independent" : "Pull requests", prs: lone, stacked: false });
  lanes.forEach((l) => { l.parent = parent; l.title = l.stacked ? strip(l.prs[0].title) : lanes.length > 1 ? "Not stacked on another PR" : "No stack between these PRs"; });
  return lanes;
})();
const laneOf = (p) => LANES.find((l) => l.prs.includes(p));
const ORDER = LANES.flatMap((l) => l.prs);
const lSum = (l) => count(l.prs), laneSt = (l) => rollup(l.prs.map(pSt));

/* ---------- the walkthrough path of one PR ---------- */
function steps(p) {
  const us = units(p), s = [{ k: "intent", label: "Intent", g: "o" }];
  if (us.length > 1 && LAY[p.key].links.length) s.push({ k: "connect", label: "How the layers connect", g: "o" });
  us.forEach((u) => s.push({ k: "L" + u.k, u, label: u.title, g: "l" }));
  if (p.findings.some(isOpen)) s.push({ k: "findings", label: "Findings", g: "w" });
  s.push({ k: "next", label: "Next", g: "w" });
  return s;
}
const stepDone = (p, x) => x.u ? lSt(x.u) === "verified" : x.k === "findings" ? weighed(p) && !!S.done[p.key + ":findings"] : x.k === "next" ? false : !!S.done[p.key + ":" + x.k];
const curStep = (p) => Math.min(S.step[p.key] || 0, steps(p).length - 1);
const firstOpen = () => ORDER.find((p) => pSt(p) !== "verified") || ORDER[0];

function openPr(p, k) {
  S.visited[p.key] = true;
  if (k != null) { const i = steps(p).findIndex((x) => x.k === k); if (i >= 0) S.step[p.key] = i; }
  Object.assign(S, { view: "pr", pr: p.key, tab: "guide", lf: null }); save();
  try { history.replaceState(null, "", "#walk"); } catch (_) {}
  render(); window.scrollTo({ top: 0 });
}
const go = (view) => { S.view = view; save(); try { history.replaceState(null, "", "#" + (view === "pr" ? "walk" : view)); } catch (_) {} render(); window.scrollTo({ top: 0 }); };
const keep = (fn) => { const y = window.scrollY; fn(); save(); render(); window.scrollTo(0, y); };

/* where a "look here first" item leads: the layer holding the code it names, else its PR */
function lookTarget(it) {
  const chapter = (it.pr && P[it.pr] && P[it.pr].story) || [];
