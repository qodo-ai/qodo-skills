<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: calm. One column, one tab at a time. The overview holds the brief, the reading-plan bar, the Impact card (findings and tests per tool, then what the change reaches) and up to three places to start; everything else waits in its tab. Detail opens on demand. */
:root{
  --ty-cfirst:var(--bad); --ty-contract:var(--accent-line); --ty-none:var(--line-strong);   /* Group by Contract; they follow each theme's own colours */
  /* Colors, type and the tab bar follow Qodo's design system (qodo-design-system: purple scale, its neutrals,
     Inter and IBM Plex Mono), so a review reads like a page of the Qodo platform. */
  --bg:#F4F4F4; --surface:#FFFFFF; --sunk:#EDEDED; --ink:#111111; --muted:#565656; --faint:#6E6E6E; --line:#DFDFDF; --line-strong:#C3C3C3;
  --accent:#634FD1; --accent-ink:#FFFFFF; --accent-soft:#DDDCFF; --accent-line:#7968FA; --accent-text:#39277F; --accent-fill:#634FD1; --accent-fill-hover:#7968FA; --hl:#F4FCC0;
  --deep:#634FD1; --review:#B3A8F5; --on-review:#111111; --skim:#4A9BE0; --skip:#C3C3C3;
  --add-bg:#E6F7F1; --add:#206B58; --del-bg:#EEF0F3; --del:#4A5263; --chg-bg:#E8F0FC; --chg:#2F5FA8;
  --ok:#206B58; --warn:#855614; --bad:#CC315D;
  --fx-radius:#0E8F71; --fx-damage:#7B3FC4; --fx-complexity:#1F7FB8;
  --tag-high-bg:#FFE0E9; --tag-high-line:#FC86A8; --tag-high:#611D30;
  --tag-med-bg:#FFF2E0; --tag-med-line:#E5BB7A; --tag-med:#57340A;
  --tag-low-bg:#DFDFDF; --tag-low-line:#C3C3C3; --tag-low:#2A2A2A;
  --ty-logic:#7968FA; --ty-tests:#2BA383; --ty-config:#D88A12; --ty-docs:#4A9BE0; --ty-migrations:#E0457B; --ty-generated:#C3C3C3;
  --tab:#2A2A2A; --tab-hover:#111111; --tab-active:#261657;
  --ring:#7968FA80;   /* 50% purple; a hex alpha, since a var() holding an unsupported color-mix() would drop the outline */
  --shadow:0 1px 2px rgba(9,10,11,.05), 0 8px 24px rgba(9,10,11,.06);
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#090A0B; --surface:#111111; --sunk:#1A1A1A; --ink:#F4F4F4; --muted:#C3C3C3; --faint:#989898; --line:#222222; --line-strong:#3D3D3D;
  --accent:#9084FC; --accent-ink:#FFFFFF; --accent-soft:#261657; --accent-line:#7968FA; --accent-text:#A8A1FD; --accent-fill:#4D3BA8; --accent-fill-hover:#634FD1; --hl:#2C3012;
  --deep:#5B4FB5; --review:#9084FC; --on-review:#111111; --skim:#4A9BE0; --skip:#3D3D3D;
  --add-bg:#1A2925; --add:#68D9BD; --del-bg:#1C1F24; --del:#AEB4C0; --chg-bg:#132033; --chg:#8AB4F8;
  --ok:#4EC2A4; --warn:#CCA05A; --bad:#E55C83;
  --fx-radius:#87F5D8; --fx-damage:#C9A6FF; --fx-complexity:#89CDF3;
  --tag-high-bg:#471422; --tag-high-line:#611D30; --tag-high:#E55C83;
  --tag-med-bg:#3D2000; --tag-med-line:#57340A; --tag-med:#CCA05A;
  --tag-low-bg:#222222; --tag-low-line:#2A2A2A; --tag-low:#C3C3C3;
  --ty-logic:#9084FC; --ty-tests:#4EC2A4; --ty-config:#CCA05A; --ty-docs:#4A9BE0; --ty-migrations:#E55C83; --ty-generated:#3D3D3D;
  --tab:#C3C3C3; --tab-hover:#DFDFDF; --tab-active:#A8A1FD;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#090A0B; --surface:#111111; --sunk:#1A1A1A; --ink:#F4F4F4; --muted:#C3C3C3; --faint:#989898; --line:#222222; --line-strong:#3D3D3D;
  --accent:#9084FC; --accent-ink:#FFFFFF; --accent-soft:#261657; --accent-line:#7968FA; --accent-text:#A8A1FD; --accent-fill:#4D3BA8; --accent-fill-hover:#634FD1; --hl:#2C3012;
  --deep:#5B4FB5; --review:#9084FC; --on-review:#111111; --skim:#4A9BE0; --skip:#3D3D3D;
  --add-bg:#1A2925; --add:#68D9BD; --del-bg:#1C1F24; --del:#AEB4C0; --chg-bg:#132033; --chg:#8AB4F8;
  --ok:#4EC2A4; --warn:#CCA05A; --bad:#E55C83;
  --fx-radius:#87F5D8; --fx-damage:#C9A6FF; --fx-complexity:#89CDF3;
  --tag-high-bg:#471422; --tag-high-line:#611D30; --tag-high:#E55C83;
  --tag-med-bg:#3D2000; --tag-med-line:#57340A; --tag-med:#CCA05A;
  --tag-low-bg:#222222; --tag-low-line:#2A2A2A; --tag-low:#C3C3C3;
  --ty-logic:#9084FC; --ty-tests:#4EC2A4; --ty-config:#CCA05A; --ty-docs:#4A9BE0; --ty-migrations:#E55C83; --ty-generated:#3D3D3D;
  --tab:#C3C3C3; --tab-hover:#DFDFDF; --tab-active:#A8A1FD;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark }

/* your own style (a recipe): an accent and a density, over either theme */
:root[data-accent="blue"]{--A:#3B82F6} :root[data-accent="green"]{--A:#10A37F} :root[data-accent="amber"]{--A:#D88A12} :root[data-accent="rose"]{--A:#E0457B}
:root[data-accent="blue"], :root[data-accent="green"], :root[data-accent="amber"], :root[data-accent="rose"]{
  --accent:var(--A); --accent-fill:var(--A); --accent-fill-hover:color-mix(in srgb, var(--A) 82%, var(--ink)); --accent-line:color-mix(in srgb, var(--A) 70%, var(--bg));
  --accent-soft:color-mix(in srgb, var(--A) 16%, var(--bg)); --accent-text:color-mix(in srgb, var(--A) 72%, var(--ink)); --tab-active:color-mix(in srgb, var(--A) 80%, var(--ink)); --ring:color-mix(in srgb, var(--A) 45%, transparent)}
:root[data-density="compact"] body{font-size:14px; line-height:1.5}
:root[data-density="compact"] .card{padding:12px 16px}
:root[data-density="compact"] .start{padding:10px 14px} :root[data-density="compact"] .panel, :root[data-density="compact"] .rpart{gap:14px}
.blkh{font-size:13px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin:18px 0 -8px; padding-top:16px; border-top:1px solid var(--line)}
.rpart{display:flex; flex-direction:column; gap:22px; scroll-margin-top:120px} .rpart:empty{display:none}   /* one block of the recipe; the panel's own gap spaces them */
#wz{position:fixed; top:0; right:0; bottom:0; width:380px; z-index:60; overflow-y:auto; overscroll-behavior:contain; background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow); padding:16px 18px calc(24px + env(safe-area-inset-bottom,0px)); font-size:14px}
body.wz-open .wrap, body.wz-open header.top{margin-right:380px}
@media (max-width:900px){ #wz{top:auto; left:0; width:auto; max-height:72vh; border-left:0; border-top:1px solid var(--line); border-radius:12px 12px 0 0} body.wz-open .wrap, body.wz-open header.top{margin-right:0} body.wz-open .wrap{padding-bottom:74vh} }
.wz-h{display:flex; align-items:center; gap:8px; margin-bottom:12px} .wz-h b{flex:1; font-size:15px}
.wz-ic{border:0; background:none; color:var(--muted); cursor:pointer; padding:3px 6px; border-radius:5px; font:inherit} .wz-ic:hover{background:var(--sunk); color:var(--ink)} .wz-ic[disabled]{opacity:.3; cursor:default}
.wz-p, .wz-fine{color:var(--muted); margin:0 0 12px; line-height:1.5} .wz-fine{font-size:12.5px; margin-top:12px}
.wz-l{display:block; font-weight:600; margin:12px 0 6px} .wz-l select, .wz-l input{display:block; width:100%; margin-top:6px; font:inherit; font-weight:400; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink)}
#wz textarea{width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); resize:vertical}
.wz-card{display:block; width:100%; text-align:left; margin-top:10px; padding:12px 14px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); cursor:pointer; font:inherit}
.wz-card:hover, .wz-card:focus-visible{border-color:var(--accent-line)} .wz-card b{display:block; font-size:14.5px} .wz-card span{color:var(--muted); font-size:13px}
.wz-chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 12px} .wz-chip{border:1px solid var(--line); background:none; color:var(--muted); border-radius:999px; padding:3px 10px; font:12.5px/1.4 var(--f-body); cursor:pointer} .wz-chip:hover{color:var(--ink); border-color:var(--line-strong)}
.wz-row{display:flex; gap:8px; align-items:center; margin-top:10px} .wz-foot{position:sticky; bottom:-24px; background:var(--surface); padding:12px 0; margin-top:16px; border-top:1px solid var(--line)}
.wz-msg{background:var(--sunk); border-radius:6px; padding:8px 10px; margin:10px 0; line-height:1.5}
.wz-ask{display:flex; gap:8px; align-items:center; background:var(--sunk); border:1px solid var(--line); border-radius:6px; padding:6px 6px 6px 10px; margin:8px 0} .wz-ask code{flex:1; min-width:0; font:12px/1.4 var(--f-mono); overflow-wrap:anywhere; user-select:all}
.wz-k{font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin:16px 0 6px}
.wz-seg{margin-top:0}
.wz-tab{border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-top:10px; background:var(--bg)}
.wz-th{display:flex; gap:6px; align-items:center} .wz-th input{flex:1; font:600 13.5px var(--f-body); border:0; border-bottom:1px dashed var(--line); background:none; color:var(--ink); padding:3px 0}
.wz-tab ol{list-style:none; margin:6px 0 0; padding:0} .wz-tab li{display:flex; align-items:center; gap:2px; padding:3px 0; border-top:1px solid var(--line)} .wz-tab li:first-child{border-top:0}
.wz-tab li span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap} .wz-tab li select{max-width:84px; font:12px var(--f-body); background:var(--surface); color:var(--muted); border:1px solid var(--line); border-radius:5px}
.wz-add{margin-top:6px; width:100%; font:12.5px var(--f-body); padding:4px 6px; border:1px dashed var(--line); border-radius:6px; background:none; color:var(--accent-text)}
.wz-more{margin-top:8px; border:1px dashed var(--line); background:none; color:var(--accent-text); border-radius:7px; padding:6px 10px; font:600 13px var(--f-body); cursor:pointer; width:100%}
.wz-sw{display:flex; gap:8px} .wz-sw button{width:24px; height:24px; border-radius:50%; border:2px solid transparent; background:var(--c); cursor:pointer; box-shadow:inset 0 0 0 2px var(--surface)} .wz-sw button[aria-pressed="true"]{border-color:var(--ink)}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font:15px/1.6 var(--f-body); margin:0; letter-spacing:.005em}
a{color:var(--accent-text)}
button,input,textarea,select{font:inherit; color:inherit}
code{font:.86em var(--f-mono); background:var(--sunk); padding:.05em .32em; border-radius:4px}
h1,h2,h3{margin:0; line-height:1.2; text-wrap:balance; letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--ring); outline-offset:1px}
.lbl{font:600 11.5px/1.2 var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
.muted{color:var(--muted)}
.n{font-variant-numeric:tabular-nums}
.wrap{max-width:960px; margin:0 auto; padding-inline:20px}
body.tab-system main.wrap{max-width:1480px}   /* the System tab: the map and a wide reading view need the room */
.btn{border:1px solid var(--line-strong); background:var(--surface); border-radius:6px; padding:6px 14px; cursor:pointer; font-weight:500; font-size:14px}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent-fill); border-color:transparent; color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-fill-hover)}
.btn.sm{padding:2px 10px; font-size:13px}
.chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:0 9px; font-size:13px; line-height:1.7; background:var(--surface); white-space:nowrap}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex:none}
.t-deep{background:var(--deep)} .t-review{background:var(--review)} .t-skim{background:var(--skim)} .t-skip{background:var(--skip)}

/* ---------- header and tabs ---------- */
header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.hrow{display:flex; align-items:center; gap:14px; padding-block:12px 4px; flex-wrap:wrap}
.hrow .t{flex:1 1 260px; min-width:0}
.hrow .t h1{display:block; margin:0; font-size:21px; font-weight:700; line-height:1.3; letter-spacing:-.005em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hrow .t span{font-size:13px; color:var(--muted)}
.prsel{border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); padding:5px 12px; font-size:14px; max-width:260px}
nav.tabs{display:flex; gap:16px; overflow-x:auto; scrollbar-width:none; margin-bottom:-1px}
nav.tabs::-webkit-scrollbar{display:none}
/* Qodo's tab bar: regular weight, a 1px purple underline that sits on the row's border */
.tab{border:0; background:none; padding:14px 0; cursor:pointer; color:var(--tab); font-weight:400; font-size:14px; line-height:1.5; letter-spacing:.01em; border-bottom:1px solid transparent; white-space:nowrap; transition:color .15s, border-color .15s; display:inline-flex; align-items:center; gap:6px}
.tab:hover{color:var(--tab-hover)}
.tab[aria-selected="true"]{color:var(--tab-active); border-bottom-color:var(--accent-line)}
.tab .c{font:11px/1 var(--f-body); letter-spacing:.2px; color:var(--muted); border:1px solid var(--line-strong); border-radius:6px; padding:2px 6px; margin:0}
.tab[aria-selected="true"] .c{color:var(--tab-active); border-color:var(--accent-line); background:var(--accent-soft)}
main{padding-block:28px 120px}
.panel{display:flex; flex-direction:column; gap:22px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:18px 20px}
.sub{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.sub h2{font-size:19px}

/* ---------- the plan bar ---------- */
.plan{display:flex; flex-direction:column; gap:10px}
.pbar{display:flex; height:16px; border-radius:8px; overflow:hidden; background:var(--sunk)}
.pbar button{border:0; padding:0; cursor:pointer; min-width:0; box-shadow:inset 1px 0 0 color-mix(in srgb, var(--surface) 75%, transparent)}
.pbar button:first-child, .pbar button.first{box-shadow:none}
.pbar button.first{margin-left:3px}
.pbar button.mini{min-width:4px}   /* a tier's merged remainder stays visible; nothing else gets a minimum, so widths are the lines */
.pbar button:hover, .pbar button:focus-visible{filter:brightness(1.2) saturate(1.1); outline:none}
.pbar button.on{filter:brightness(1.2) saturate(1.1)}
.seglist{margin-top:8px; padding:8px 12px; border:1px solid var(--line); border-radius:8px; font-size:13.5px} .seglist ul{list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:2px; max-height:220px; overflow:auto} .seglist .dfile{font:12.5px var(--f-mono)}
.segslot:empty{display:none}   /* nothing listed: no extra gap under the hint line */
.phint{font-size:13px; color:var(--faint); min-height:1.3em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:opacity .4s}
.phint.fade{opacity:0}
.tip ul.tw{margin:4px 0 0; padding-left:16px} .tip ul.tw li{margin:1px 0}
.pmap-tog{border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font:500 13px/1 var(--f-body); cursor:pointer; padding:5px 10px; margin-left:10px; border-radius:6px; vertical-align:2px}
.tools{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:13px}
.tools .lbl{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-right:4px}
.tl{font:500 13px/1.2 var(--f-body); padding:3px 9px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); text-decoration:none; cursor:pointer; white-space:nowrap}
.tl:hover{border-color:var(--accent-line); background:var(--sunk)}
.tl.ok{color:var(--ok); border-color:transparent; background:transparent; padding-inline:4px}
.tl.ok:hover{background:var(--sunk)}
.tl.bad{color:var(--bad); border-color:currentColor}
.tl.wait{color:var(--warn)}
.tl.none{color:var(--faint); border-style:dashed; cursor:default}
.tl .n{font-weight:700} .tl .hi{color:var(--bad); font-weight:600}
.tools.tests{margin-top:6px; padding-top:0; border-top:0} .tl.gapc{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 45%, transparent)}
.tgl{list-style:none; margin:6px 0 0; padding:0 0 0 64px; font-size:13px; display:flex; flex-direction:column; gap:3px} .tgl code{font:12.5px var(--f-mono)}
.impact .ih{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px} .impact .ih b{font-size:15px}
.impact .isum{font-size:13.5px} .impact .isum .rk{font-size:13.5px}
/* a card's title line: what it says on the left, its toggle at the right edge, the same place on every card */
.chead{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 12px} .chead .pmap-tog{margin-left:auto}
.impact .isw{display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; margin:14px 0 6px} .impact .isw .bviews{margin-top:0} .impact .isw .muted{font-size:13px}
.ir{display:grid; grid-template-columns:92px minmax(0,1.3fr) minmax(0,1fr); gap:4px 14px; padding:9px 0; border-top:1px solid var(--line); font-size:14px; align-items:start} .ir:first-of-type{border-top:0}
.rk{font-size:12.5px; font-weight:600; white-space:nowrap} .rk.high{color:var(--bad)} .rk.medium{color:var(--warn)} .rk.low{color:var(--muted)}
.ib .ia{color:var(--muted); font-size:13.5px; margin-top:2px} .ib .iw{color:var(--muted); font-size:13px; margin-top:2px}
.ie{font-size:13px; display:flex; flex-direction:column; gap:2px} .okv{color:var(--ok)} .gap{color:var(--warn)}
.iwf + .iwf{margin-top:10px} .iwh{font-size:14px; padding:4px 0}
.door{font-size:13px; font-weight:600; white-space:nowrap} .door.one{color:var(--bad)} .door.two{color:var(--ok)} .door.sm{font-size:11.5px; font-weight:500}
.dsum{font-size:14px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap} .dsum > span:last-child{min-width:0}
.drow{display:grid; grid-template-columns:130px minmax(0,1fr); gap:4px 12px; padding:8px 0; border-top:1px solid var(--line); font-size:14px} .dsum + .drow{margin-top:10px}
.drow .iw, .deploy .iw, .dsum > span:last-child{color:var(--muted); font-size:13.5px; margin-top:2px} .dsum > span:last-child{margin-top:0}
.deploy{margin:6px 0 0; padding-left:22px; font-size:14px;} .deploy b{font-weight:500} .deploy{ display:flex; flex-direction:column; gap:6px}
.dwrap{overflow-x:auto; margin-top:6px} .dom{border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums}
.dom th, .dom td{padding:5px 12px; border-bottom:1px solid var(--line); text-align:center} .dom tbody th{text-align:left; font-weight:500; color:var(--muted); white-space:nowrap}
.dom td.on{font-weight:600} .dom td.hot{color:var(--bad); box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--bad) 45%, transparent); border-radius:5px}
@media (max-width:640px){ .drow{grid-template-columns:1fr} }
.ievid{margin-top:14px}
.checks-line{margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:13.5px}
.dacts{display:inline-flex; gap:8px; margin-left:auto} .dacts .pmap-tog{margin-left:0; text-decoration:none}
.declist{list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:5px; font-size:13.5px}
.srow{display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; margin-top:4px; font-size:13.5px}
.checks-line .ctitle{font-size:15px; margin-right:2px} .cl{font:inherit; background:none; border:0; padding:0; color:var(--ink); white-space:nowrap} button.cl{cursor:pointer} button.cl:hover{text-decoration:underline}

/* ---------- overview ---------- */
.hero p{font-size:17px; color:var(--muted); max-width:62ch; margin:10px 0 0}
.btext{max-width:62ch; margin-top:12px; font-size:16px; line-height:1.6; color:var(--ink)} .btext p{margin:0 0 8px; color:inherit; font-size:inherit}
.btext .adds{display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 12px; margin:8px 0 0; align-items:baseline} .btext .adds b{font:600 13px/1.6 var(--f-mono); color:var(--muted)}

.start{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 14px; align-items:start; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:12px 16px; cursor:pointer}

.start .go{color:var(--accent-text); font-size:13.5px; white-space:nowrap; align-self:center}
.contracts{display:flex; flex-direction:column; gap:8px}
.hero .bmerged p{font-size:14px; line-height:1.55; color:var(--ink); max-width:74ch; margin:0}   /* the merged brief sets its own scale, not the hero's */

.hero .bmerged p.bhead, .rhead{margin:8px 0 0; font-size:16.5px; font-weight:500; line-height:1.5; color:var(--ink); max-width:72ch; text-wrap:balance}   /* readable length; balanced lines, no one-word last line */

.hero .bmerged p.bintro, .hero .bmerged .fl-hd{color:var(--muted)} .hero .bmerged .fl-hd{font-size:13px} .hero .bmerged .bfbody > p{margin:0 0 8px}
.hero .bmerged .bdecs p{margin:3px 0 0} .bdecs .binst{display:block; margin-top:2px; font-size:13px; color:var(--muted)}
.hero .bmerged p.src{font-size:13px; color:var(--muted)}
#kdock{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); z-index:40; width:max-content; max-width:224px; padding:8px; border:1px solid var(--line); border-radius:12px;

@media (hover:hover) and (min-width:721px){ body:has(#kdock .kd-h) main.wrap{padding-bottom:200px} }   /* the page's end scrolls clear of the dock */
.kd-ask{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; margin:0 0 6px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--muted); font:inherit; cursor:text; text-align:left}

  border:1px solid var(--line); border-radius:14px; background:var(--surface); box-shadow:0 12px 40px rgba(0,0,0,.35); font-size:14px}

}

/* ---------- plan tab ---------- */

/* walkthrough: PR streams > units > chunks; each level shows its own progress */

.stream{border:1px solid var(--line); background:var(--surface); border-radius:8px}

/* ---------- changes ---------- */
.split{display:grid; grid-template-columns:minmax(200px, 270px) minmax(0,1fr); gap:18px; align-items:start}

/* ---------- quality: how the change was checked, then what the tools found; the overview's row, in full ---------- */
const qVerdict = (p, path) => (((p.quality || {}).tests || []).find((x) => x.path === path) || {}).verdict;

/* ---------- findings: open ones by severity, everything folded ---------- */

        <div class="body">${md(f.body || "")}${f.why ? `<p class="muted" style="margin:8px 0 0"><b>Agent:</b> ${md(f.why)}</p>` : ""}${f.url ? `<p style="margin:8px 0 0"><a href="${esc(f.url)}" target="_blank" rel="noopener">Open in ${esc(f.scanner ? f.scanner.name : "Qodo")} ↗</a></p>` : ""}

  W.open = true; W.step = "start"; W.base = RECIPE.id; W.draft = null; W.msg = ""; W.ask = ""; W.busy = false;
  sampler().then((s) => { W.canSample = !!s; if (W.open) drawWz(); });
  drawWz();
}
function closeWizard() {
  if (W.ctl) W.ctl.abort(); clearInterval(W.poll); W.open = false; DRAFT = null;
  const el = $("#wz"); if (el) el.remove(); document.body.classList.remove("wz-open");
  render(); $("#cknav").innerHTML = KIT.navHtml();
}
function preview() { const r = cleanRecipe(W.draft); if (r) DRAFT = r; keepScroll(() => {}); }
const seg = (key, opts, cur) => `<div class="bviews wz-seg" role="group">${opts.map(([v, t]) => `<button class="bv" data-wz="set:${key}:${v}" aria-selected="${cur === v}">${t}</button>`).join("")}</div>`;
function wzHtml() {
  const head = (back) => `<div class="wz-h">${back ? `<button class="wz-ic" data-wz="${back}" aria-label="Back">←</button>` : ""}<b>Create your style</b><button class="wz-ic" data-wz="close" aria-label="Close">✕</button></div>`;
  const msg = W.msg ? `<p class="wz-msg">${md(W.msg)}</p>` : "";
  const ask = W.ask ? `<div class="wz-ask"><code>${esc(W.ask)}</code><button class="btn sm" data-wz="copy">Copy</button></div>` : "";
  if (W.step === "start") {
    const bases = [FOCUS].concat(KIT.recipes().map(cleanRecipe).filter(Boolean));
    return head() + `<p class="wz-p">A style picks which parts of a review you see, in what order, in tabs or on one page. It works on every review.</p>
      <label class="wz-l">Start from <select data-wz-base>${bases.map((r) => `<option value="${esc(r.id)}"${r.id === W.base ? " selected" : ""}>${esc(r.name)}</option>`).join("")}</select></label>
      <button class="wz-card" data-wz="describe"><b>Describe it</b><span>Say how you like to review, and Claude arranges the parts.</span></button>
      <button class="wz-card" data-wz="remix"><b>Arrange it</b><span>Pick the parts, put them in order, group them into tabs.</span></button>`;
  }
  if (W.step === "describe") {
    const how = W.canSample ? "Claude answers right here, on your own Claude account." : KIT.served ? "Claude Code makes it: you get one line to paste, and this page picks up the result." : "You get one line to paste into Claude Code, where this review was made.";
    return head("start") + `<label class="wz-l" for="wz-text">How do you like to review?</label>
      <textarea id="wz-text" data-wz-text rows="5" placeholder="e.g. Risk first: what blocks the merge, then the findings, then the code. No stories.">${esc(W.text)}</textarea>
      <div class="wz-chips">${EXAMPLES.map((x, i) => `<button class="wz-chip" data-wz="ex:${i}">${esc(x)}</button>`).join("")}</div>
      <div class="wz-row"><button class="btn pri" data-wz="make"${W.busy ? " disabled" : ""}>${W.busy ? "Thinking…" : "Make it"}</button>${W.busy && W.ctl ? `<button class="btn" data-wz="stop">Stop</button>` : ""}</div>
      ${msg}${ask}<p class="wz-fine">${how}</p>`;
  }
  if (W.step === "saved") return head() + msg + ask + `<div class="wz-row"><button class="btn pri" data-wz="close">Done</button></div>`;
  const d = W.draft, page = d.layout === "page", used = new Set(d.tabs.flatMap((t) => t.blocks)), unused = Object.keys(BLOCKS).filter((b) => !used.has(b));
  const tabHtml = (t, i) => `<div class="wz-tab">${page ? "" : `<div class="wz-th"><input data-wz-tlabel="${i}" value="${esc(t.label)}" aria-label="Tab name"><button class="wz-ic" data-wz="tdel:${i}" aria-label="Remove tab" title="Remove tab">✕</button></div>`}
    <ol>${t.blocks.map((b, j) => `<li><span title="${esc(BLOCKS[b].what)}">${esc(BLOCKS[b].label)}</span>
      <button class="wz-ic" data-wz="mv:${i}:${j}:-1" aria-label="Up"${j ? "" : " disabled"}>↑</button><button class="wz-ic" data-wz="mv:${i}:${j}:1" aria-label="Down"${j < t.blocks.length - 1 ? "" : " disabled"}>↓</button>
      ${!page && d.tabs.length > 1 ? `<select data-wz-move="${i}:${j}" aria-label="Move to tab"><option value="">Move…</option>${d.tabs.map((x, k) => k === i ? "" : `<option value="${k}">${esc(x.label)}</option>`).join("")}</select>` : ""}
      <button class="wz-ic" data-wz="rm:${i}:${j}" aria-label="Hide ${esc(BLOCKS[b].label)}">✕</button></li>`).join("")}</ol>
    ${unused.length ? `<select class="wz-add" data-wz-add="${i}"><option value="">＋ Add a part</option>${unused.map((b) => `<option value="${b}">${esc(BLOCKS[b].label)}</option>`).join("")}</select>` : ""}</div>`;
  return head("start") + msg + `<label class="wz-l">Name <input data-wz-name value="${esc(d.name)}"></label>
    <div class="wz-k">Layout</div>${seg("layout", [["tabs", "Tabs"], ["page", "One page"]], d.layout)}
    ${d.tabs.map(tabHtml).join("")}${!page && d.tabs.length < 6 ? `<button class="wz-more" data-wz="tadd">＋ Add a tab</button>` : ""}
    <div class="wz-k">Density</div>${seg("density", [["calm", "Calm"], ["compact", "Compact"]], d.density)}
    <div class="wz-k">Accent</div><div class="wz-sw">${Object.entries(ACCENTS).map(([k, c]) => `<button data-wz="set:accent:${k}" aria-label="${k}" aria-pressed="${d.accent === k}" style="--c:${c}"></button>`).join("")}</div>
    <div class="wz-k">The brief opens on</div>${seg("brief", [["line", "One line"], ["why", "Why"], ["what", "What"], ["how", "How"]], d.brief)}
    <div class="wz-row wz-foot"><button class="btn pri" data-wz="save">Save style</button><button class="btn" data-wz="close">Cancel</button></div>`;
}
function drawWz() {
  let el = $("#wz");
  if (!el) { el = document.createElement("aside"); el.id = "wz"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Create your style"); document.body.appendChild(el); }
  const f = document.activeElement && document.activeElement.closest && document.activeElement.closest("#wz") ? (document.activeElement.dataset.wz || null) : null;
  el.innerHTML = wzHtml(); document.body.classList.add("wz-open");
  const back = f && el.querySelector(`[data-wz="${CSS.escape(f)}"]`); if (back) back.focus();
}
function describePrompt(text) {
  const base = cleanRecipe(W.draft) || findRecipe(W.base) || FOCUS;
  return `You arrange a code-review page from parts. Reply with only one JSON object, no other text:
{"name": "2-4 word name", "about": "one sentence: who it is for and what it puts first", "layout": "tabs" or "page",
 "tabs": [{"label": "short tab label", "blocks": ["block ids"]}], "density": "calm" or "compact",
 "accent": "purple" | "blue" | "green" | "amber" | "rose", "brief": "line" | "why" | "what" | "how"}
The parts (use each at most once, in reading order; leave out what the reader doesn't want):
${Object.entries(BLOCKS).map(([k, b]) => `- ${k}: ${b.what}`).join("\n")}
Rules: 1-6 tabs; with "page", put every part in one tab. Keep "review" unless the reader asks to drop it. "brief" is the
opening sentence the page leads with. Name it after how it reads, not after this review.
The arrangement to start from: ${JSON.stringify({ layout: base.layout, tabs: base.tabs, density: base.density, accent: base.accent, brief: base.brief })}
What the reader wants: ${text.slice(0, 1500)}`;
}
const SAMPLE_MSG = { not_granted: "Claude wasn't allowed for this page. Arrange it yourself instead.", sampling_disabled: "Claude isn't available on this account. Arrange it yourself instead.",
  rate_limited: "Too many asks for now. Try again in a little while.", refused: "Claude declined that one. Try saying it differently.", invalid_json: "Claude's answer wasn't a style. Try again, or say it more simply.",
  session_expired: "Sign in to Claude again, then try.", cancelled: "" };
async function make() {
  const text = W.text.trim(); if (!text) { W.msg = "Say how you like to review first."; return drawWz(); }
  W.msg = ""; W.ask = "";
  const sample = await sampler();
  if (sample) {
    const ctl = (W.ctl = new AbortController()); W.busy = true; drawWz();
    try {
      const r = cleanRecipe(await sample.json(describePrompt(text), { signal: ctl.signal }));
      if (!W.open || W.ctl !== ctl) return;   // closed or asked again while Claude answered
      if (!r) throw { code: "invalid_json" };
      W.draft = r; W.editing = null; W.step = "remix"; W.msg = `Claude's arrangement${r.about ? `: ${r.about.replace(/\.$/, "")}` : ""}. Change anything, then save.`; preview();
    } catch (e) { if (!W.open || W.ctl !== ctl) return; W.msg = SAMPLE_MSG[e && e.code] ?? "Something went wrong asking Claude. Try again."; }
    W.busy = false; W.ctl = null; return drawWz();
  }
  if (KIT.served) {
    try {
      const res = await (await fetch("/api/recipe-request", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, base: findRecipe(W.base) || FOCUS }) })).json();
      if (res.error) throw new Error(res.error);
      W.ask = res.ask; W.req = res.request.id; W.msg = "Paste this into Claude Code. This page picks up the style when it's ready.";
      clearInterval(W.poll); W.poll = setInterval(async () => {
        if (!W.open) return clearInterval(W.poll);
        try { const j = await (await fetch("/api/recipes")).json(); const hit = (j.recipes || []).find((r) => r.request === W.req);
          if (hit) { clearInterval(W.poll); W.draft = cleanRecipe(hit); W.editing = { id: hit.id, name: hit.name, draft: true }; W.step = "remix"; W.ask = ""; W.msg = `Claude Code's arrangement${hit.about ? `: ${hit.about.replace(/\.$/, "")}` : ""}. Change anything, then save.`; preview(); drawWz(); } } catch (_) {}
      }, 4000);
    } catch (e) { W.msg = `Couldn't send it: ${e.message}`; }
    return drawWz();
  }
  W.ask = `/review-prs make my review style for review session ${C.session || ""}: ${text}`; W.msg = "Paste this into Claude Code, where this review was made.";
  drawWz();
}
function styleId(r) {   // editing keeps the style's id (a Claude Code draft keeps it through a rename); anything else gets its own
  const ed = W.editing, taken = new Set(["focus", "merge-risk"].concat(KIT.recipes().map((x) => x.id)));
  if (ed && (ed.draft || ed.name === r.name)) return ed.id;
  let id = rslug(r.name), n = 2; while (taken.has(id)) id = `${rslug(r.name)}-${n++}`;
  return id;
}
async function saveStyle() {
  let r = cleanRecipe(W.draft); if (!r) { W.msg = "A style needs a name and at least one part."; return drawWz(); }
  r = { ...r, id: styleId(r) };
  let where = "in this browser", kept = false;
  if (KIT.served) {   // the server's copy is the one: a browser copy would hide later updates from Claude Code
    try { const j = await (await fetch("/api/recipes", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ recipe: r }) })).json();
      if (j.error) throw new Error(j.error); r = cleanRecipe(j.recipe) || r; kept = true; where = "with your reviews, for every review";
      KIT.host.recipes = (KIT.host.recipes || []).filter((x) => x.id !== r.id).concat([r]); } catch (e) { where = `in this browser (the server said: ${e.message})`; }
  }
  if (!kept) { const local = store.get(KIT.RECIPES, []).filter((x) => x && x.id !== r.id); local.push(r); store.set(KIT.RECIPES, local); }
  S.bview = undefined; save();
  RECIPE = r; DRAFT = null; store.set(KIT.ACTIVE, r.id);
  W.step = "saved"; W.msg = `**${r.name}** is saved ${where}. It's in the Style menu.`;
  W.ask = kept ? "" : `/review-prs save my review style: ${JSON.stringify(r)}`;
  if (W.ask) W.msg += " To keep it for every review, paste this into Claude Code:";
  render(); $("#cknav").innerHTML = KIT.navHtml(); drawWz();
}
function wzAct(a) {
  const d = W.draft, [k, x, y, z] = a.split(":");
  if (k === "close") return closeWizard();
  if (k === "start") { W.step = "start"; W.msg = ""; W.ask = ""; DRAFT = null; render(); return drawWz(); }
  if (k === "describe") { W.step = "describe"; W.editing = null; W.draft = clone(findRecipe(W.base) || FOCUS); drawWz(); const t = $("#wz-text"); if (t) t.focus(); return; }
  if (k === "remix") { const b = clone(findRecipe(W.base) || FOCUS); W.editing = b.id === "focus" ? null : { id: b.id, name: b.name }; W.draft = b.id === "focus" ? { ...b, id: undefined, name: "My style" } : b; W.step = "remix"; W.msg = ""; preview(); return drawWz(); }
  if (k === "ex") { W.text = EXAMPLES[+x]; drawWz(); const t = $("#wz-text"); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } return; }
  if (k === "make") return make();
  if (k === "stop") { if (W.ctl) W.ctl.abort(); return; }
  if (k === "copy") { try { navigator.clipboard.writeText(W.ask).then(() => { W.msg = "Copied. Paste it into Claude Code."; drawWz(); }); } catch (_) {} return; }
  if (k === "save") return saveStyle();
  if (!d) return;
  if (k === "set") {
    if (x === "layout" && y !== d.layout) {
      d.tabs = y === "page" ? [{ label: d.name, blocks: d.tabs.flatMap((t) => t.blocks) }]
        : (() => { const all = d.tabs.flatMap((t) => t.blocks), ov = all.filter((b) => OVERVIEWISH.includes(b));
            return (ov.length ? [{ label: "Overview", blocks: ov }] : []).concat(all.filter((b) => !OVERVIEWISH.includes(b)).map((b) => ({ label: BLOCKS[b].label, blocks: [b] }))); })();
    }
    d[x] = y;
    if (x === "brief") { S.bview = undefined; save(); }   // preview the style's opening reading, not the last one picked
  }
  if (k === "mv") { const t = d.tabs[+x], j = +y, n = j + +z; [t.blocks[j], t.blocks[n]] = [t.blocks[n], t.blocks[j]]; }
  if (k === "rm") { d.tabs[+x].blocks.splice(+y, 1); d.tabs = d.tabs.filter((t) => t.blocks.length); if (!d.tabs.length) d.tabs = [{ label: "Overview", blocks: ["brief"] }]; }
  if (k === "tdel") { const [gone] = d.tabs.splice(+x, 1); if (!d.tabs.length) d.tabs = [{ label: "Overview", blocks: [] }]; d.tabs[0].blocks.push(...gone.blocks); }
  if (k === "tadd") d.tabs.push({ label: "New tab", blocks: [] });
  preview(); drawWz();
}
document.addEventListener("click", (e) => { const b = e.target.closest("#wz [data-wz]"); if (b && !b.disabled) { e.preventDefault(); wzAct(b.dataset.wz); } });
document.addEventListener("change", (e) => {
  const t = e.target; if (!t.closest || !t.closest("#wz")) return; const d = W.draft;
  if (t.dataset.wzBase !== undefined) { W.base = t.value; return; }
  if (!d) return;
  if (t.dataset.wzMove && t.value !== "") { const [i, j] = t.dataset.wzMove.split(":").map(Number), [b] = d.tabs[i].blocks.splice(j, 1); d.tabs[+t.value].blocks.push(b); d.tabs = d.tabs.filter((x) => x.blocks.length); }
  else if (t.dataset.wzAdd !== undefined && t.value) d.tabs[+t.dataset.wzAdd].blocks.push(t.value);
  else return;
  preview(); drawWz();
});
document.addEventListener("input", (e) => {
  const t = e.target; if (!t.closest || !t.closest("#wz")) return;
  if (t.dataset.wzText !== undefined) { W.text = t.value; return; }
  if (!W.draft) return;
  if (t.dataset.wzName !== undefined) W.draft.name = t.value;
  else if (t.dataset.wzTlabel !== undefined) W.draft.tabs[+t.dataset.wzTlabel].label = t.value;
  else return;
  const r = cleanRecipe(W.draft); if (r) { DRAFT = r; keepScroll(() => {}); }   // the tabs above update; the field keeps focus
});
document.addEventListener("keydown", (e) => {
  if (!W.open) return;
  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); return closeWizard(); }
  if (e.key === "Enter" && !e.shiftKey && e.target.dataset && e.target.dataset.wzText !== undefined) { e.preventDefault(); make(); }
}, true);
window.addEventListener("ck:create", openWizard);
window.addEventListener("ck:recipe", (e) => { RECIPE = findRecipe(e.detail) || FOCUS; store.set(KIT.ACTIVE, RECIPE.id === "focus" ? null : RECIPE.id); S.bview = undefined; save(); render(); $("#cknav").innerHTML = KIT.navHtml(); window.scrollTo({ top: 0 }); });
const h0 = ((location.hash || "").slice(1) || "").replace(/^plan$/, "walk");
if (S.tab === "plan") S.tab = "walk";
if (/^style-/.test(h0)) { const r = findRecipe(h0.slice(6)); if (r) { RECIPE = r; store.set(KIT.ACTIVE, r.id); } }   // a link from another style's menu
else if (TABS.some(([id]) => id === h0) || Object.hasOwn(BLOCKS, h0)) S.tab = h0;   // render() finds the tab holding a block
else if (C.system && /^[cn]-/.test(h0) && TABS.some((t) => t[2].includes("system"))) S.tab = "system";   // a link to one contract or part; render() finds the tab holding System
render();
$("#cknav").innerHTML = KIT.navHtml(); KIT.liveBanner(document.querySelector("header.top"));
if (h0 === "create") openWizard();
})();
</script>
