<style>
/* Layout: calm. One column, one tab at a time. The overview holds the brief, the reading-plan bar, the Impact card (findings and tests per tool, then what the change reaches) and up to three places to start; everything else waits in its tab. Detail opens on demand. */
:root{
  /* Colors, type and the tab bar follow Qodo's design system (qodo-design-system: purple scale, its neutrals,
     Inter and IBM Plex Mono), so a review reads like a page of the Qodo platform. */
  --bg:#F4F4F4; --surface:#FFFFFF; --sunk:#EDEDED; --ink:#111111; --muted:#565656; --faint:#6E6E6E; --line:#DFDFDF; --line-strong:#C3C3C3;
  --accent:#634FD1; --accent-ink:#FFFFFF; --accent-soft:#DDDCFF; --accent-line:#7968FA; --accent-text:#39277F; --accent-fill:#634FD1; --accent-fill-hover:#7968FA; --hl:#F4FCC0;
  --deep:#D92D20; --review:#F38A1F; --on-review:#111111; --skim:#F9C846; --skip:#FCEBB0; --on-deep:#FFFFFF; --on-heat:#1A1A1A; --on-skip:#1A1A1A;   /* a heat scale: pale yellow (skip) to red (must read) */
  --ty-logic:#7968FA; --ty-tests:#2BA383; --ty-config:#D88A12; --ty-docs:#4A9BE0; --ty-migrations:#E0457B; --ty-generated:#C3C3C3;
  --add-bg:#E6F7F1; --add:#206B58; --del-bg:#EEF0F3; --del:#4A5263; --chg-bg:#E8F0FC; --chg:#2F5FA8;
  --ok:#206B58; --warn:#855614; --bad:#CC315D;
  --fx-radius:#0E8F71; --fx-damage:#7B3FC4; --fx-complexity:#1F7FB8;
  --tag-high-bg:#FFE0E9; --tag-high-line:#FC86A8; --tag-high:#611D30;
  --tag-med-bg:#FFF2E0; --tag-med-line:#E5BB7A; --tag-med:#57340A;
  --tag-low-bg:#DFDFDF; --tag-low-line:#C3C3C3; --tag-low:#2A2A2A;
  --tab:#2A2A2A; --tab-hover:#111111; --tab-active:#261657;
  --ring:#7968FA80;   /* 50% purple; a hex alpha, since a var() holding an unsupported color-mix() would drop the outline */
  --shadow:0 1px 2px rgba(9,10,11,.05), 0 8px 24px rgba(9,10,11,.06);
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#090A0B; --surface:#111111; --sunk:#1A1A1A; --ink:#F4F4F4; --muted:#C3C3C3; --faint:#989898; --line:#222222; --line-strong:#3D3D3D;
  --accent:#9084FC; --accent-ink:#FFFFFF; --accent-soft:#261657; --accent-line:#7968FA; --accent-text:#A8A1FD; --accent-fill:#4D3BA8; --accent-fill-hover:#634FD1; --hl:#2C3012;
  --deep:#E5484D; --review:#EE8436; --on-review:#111111; --skim:#E3BA45; --skip:#5E5228; --on-deep:#FFFFFF; --on-heat:#141414; --on-skip:#EDE4C6;
  --ty-logic:#9084FC; --ty-tests:#4EC2A4; --ty-config:#CCA05A; --ty-docs:#4A9BE0; --ty-migrations:#E55C83; --ty-generated:#3D3D3D;
  --add-bg:#1A2925; --add:#68D9BD; --del-bg:#1C1F24; --del:#AEB4C0; --chg-bg:#132033; --chg:#8AB4F8;
  --ok:#4EC2A4; --warn:#CCA05A; --bad:#E55C83;
  --fx-radius:#87F5D8; --fx-damage:#C9A6FF; --fx-complexity:#89CDF3;
  --tag-high-bg:#471422; --tag-high-line:#611D30; --tag-high:#E55C83;
  --tag-med-bg:#3D2000; --tag-med-line:#57340A; --tag-med:#CCA05A;
  --tag-low-bg:#222222; --tag-low-line:#2A2A2A; --tag-low:#C3C3C3;
  --tab:#C3C3C3; --tab-hover:#DFDFDF; --tab-active:#A8A1FD;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --dlg:#171717; --dlg-tile:#202020; --dlg-sk:#111111; --dlg-line:#383838;   /* the widget gallery and page dialog stand off the page */
  --bg:#090A0B; --surface:#111111; --sunk:#1A1A1A; --ink:#F4F4F4; --muted:#C3C3C3; --faint:#989898; --line:#222222; --line-strong:#3D3D3D;
  --accent:#9084FC; --accent-ink:#FFFFFF; --accent-soft:#261657; --accent-line:#7968FA; --accent-text:#A8A1FD; --accent-fill:#4D3BA8; --accent-fill-hover:#634FD1; --hl:#2C3012;
  --deep:#E5484D; --review:#EE8436; --on-review:#111111; --skim:#E3BA45; --skip:#5E5228; --on-deep:#FFFFFF; --on-heat:#141414; --on-skip:#EDE4C6;
  --ty-logic:#9084FC; --ty-tests:#4EC2A4; --ty-config:#CCA05A; --ty-docs:#4A9BE0; --ty-migrations:#E55C83; --ty-generated:#3D3D3D;
  --add-bg:#1A2925; --add:#68D9BD; --del-bg:#1C1F24; --del:#AEB4C0; --chg-bg:#132033; --chg:#8AB4F8;

/* your own style (a recipe): an accent and a density, over either theme */
:root[data-accent="blue"]{--A:#3B82F6} :root[data-accent="green"]{--A:#10A37F} :root[data-accent="amber"]{--A:#D88A12} :root[data-accent="rose"]{--A:#E0457B}
:root[data-accent="blue"], :root[data-accent="green"], :root[data-accent="amber"], :root[data-accent="rose"]{
  --accent:var(--A); --accent-fill:var(--A); --accent-fill-hover:color-mix(in srgb, var(--A) 82%, var(--ink)); --accent-line:color-mix(in srgb, var(--A) 70%, var(--bg));
  --accent-soft:color-mix(in srgb, var(--A) 16%, var(--bg)); --accent-text:color-mix(in srgb, var(--A) 72%, var(--ink)); --tab-active:color-mix(in srgb, var(--A) 80%, var(--ink)); --ring:color-mix(in srgb, var(--A) 45%, transparent)}
:root[data-density="compact"] body{font-size:14px; line-height:1.5}
:root[data-density="compact"] .card{padding:12px 16px}
:root[data-density="compact"] .start{padding:10px 14px} :root[data-density="compact"] .panel, :root[data-density="compact"] .rpart{gap:14px}
.blkh{font-size:13px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin:18px 0 -8px; padding-top:16px; border-top:1px solid var(--line)}
.rpart{display:flex; flex-direction:column; gap:22px; scroll-margin-top:calc(var(--hh,110px) + 12px)} .rpart:empty{display:none}   /* one block of the recipe; the panel's own gap spaces them */
#wz{position:fixed; top:0; right:0; bottom:0; width:380px; z-index:60; overflow-y:auto; overscroll-behavior:contain; background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow); padding:16px 18px calc(24px + env(safe-area-inset-bottom,0px)); font-size:14px}
body.wz-open .wrap, body.wz-open header.top{margin-right:380px}
@media (max-width:900px){ #wz{top:auto; left:0; width:auto; max-height:72vh; border-left:0; border-top:1px solid var(--line); border-radius:12px 12px 0 0} body.wz-open .wrap, body.wz-open header.top{margin-right:0} body.wz-open .wrap{padding-bottom:74vh} }
.wz-h{display:flex; align-items:center; gap:8px; margin-bottom:12px} .wz-h b{flex:1; font-size:15px}
.wz-ic{border:0; background:none; color:var(--muted); cursor:pointer; padding:3px 6px; border-radius:5px; font:inherit} .wz-ic:hover{background:var(--sunk); color:var(--ink)} .wz-ic[disabled]{opacity:.3; cursor:default}
.wz-p, .wz-fine{color:var(--muted); margin:0 0 12px; line-height:1.5} .wz-fine{font-size:12.5px; margin-top:12px}
.wz-l{display:block; font-weight:600; margin:12px 0 6px} .wz-l select, .wz-l input{display:block; width:100%; margin-top:6px; font:inherit; font-weight:400; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink)}
#wz textarea{width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); resize:vertical}
.wz-card{display:block; width:100%; text-align:left; margin-top:10px; padding:12px 14px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); cursor:pointer; font:inherit}
.wz-card:hover, .wz-card:focus-visible{border-color:var(--accent-line)} .wz-card b{display:block; font-size:14.5px} .wz-card span{color:var(--muted); font-size:13px}
.wz-chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 12px} .wz-chip{border:1px solid var(--line); background:none; color:var(--muted); border-radius:999px; padding:3px 10px; font:12.5px/1.4 var(--f-body); cursor:pointer} .wz-chip:hover{color:var(--ink); border-color:var(--line-strong)}
.wz-row{display:flex; gap:8px; align-items:center; margin-top:10px} .wz-foot{position:sticky; bottom:-24px; background:var(--surface); padding:12px 0; margin-top:16px; border-top:1px solid var(--line)}
.wz-msg{background:var(--sunk); border-radius:6px; padding:8px 10px; margin:10px 0; line-height:1.5}
.wz-ask{display:flex; gap:8px; align-items:center; background:var(--sunk); border:1px solid var(--line); border-radius:6px; padding:6px 6px 6px 10px; margin:8px 0} .wz-ask code{flex:1; min-width:0; font:12px/1.4 var(--f-mono); overflow-wrap:anywhere; user-select:all}
.wz-k{font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin:16px 0 6px}
.wz-seg{margin-top:0}

.pkg{display:flex; flex-direction:column; gap:16px}

.pkm{min-width:0; display:flex; flex-direction:column; gap:4px}

.pkt-w{border:1px solid var(--line); border-radius:10px} .pkt-tab{width:100%; border-collapse:collapse; font-size:13.5px}
.pkt-tab th > span{display:inline-flex; align-items:center; gap:6px} .pkt-hi{width:14px; height:14px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; color:var(--faint)}
.pkt-tab th{padding:10px 14px; text-align:left; font-weight:500; font-size:12.5px; color:var(--muted); background:var(--whead); border-bottom:1px solid var(--line); white-space:nowrap} .pkt-tab th:not(:first-child), .pkt-tab td:not(:first-child){text-align:center}   /* names left, facts centred */
.pkt-tab td{padding:12px 14px; border-top:1px solid var(--line); vertical-align:middle; white-space:nowrap} .pkt-tab tbody:first-of-type tr:first-child td{border-top:0}
.pkt-tab td:first-child, .pkt-tab th:first-child{width:100%; white-space:normal} .pkt-t{flex-wrap:wrap; row-gap:0}   /* the names take the room and wrap; the facts stay on one line */
.pkt-r{cursor:pointer} .pkt-r:hover td{background:color-mix(in srgb, var(--ink) 3%, var(--surface))} .pkt-r:focus-visible{outline:2px solid var(--ring); outline-offset:-2px}
.pkt-c td{background:color-mix(in srgb, var(--ink) 1.5%, var(--surface))} .pkt-c td:first-child{padding-left:30px}
.pkt-n{display:flex; align-items:flex-start; gap:10px; min-width:0} .pkt-n > .pkgh, .pkt-n > .pkt-cv, .pkt-n > .pkt-ar, .pkt-n > .pkst{margin-top:var(--pkt-m, 3px)} .pkt-n > .pkt-cv{margin-top:7px} .pkt-n > .pkst{margin-top:-1px} .pkt-n > .pkt-ar{margin-top:0}   /* icons sit on the name's line, not between the two lines */ .pkt-n > span:last-child{display:flex; flex-direction:column; gap:2px; min-width:0} .pkt-n em{font-style:normal; font-size:12.5px; color:var(--muted)}
.pkt-n b{font-weight:600} .pkt-t{display:flex; align-items:baseline; gap:8px; font-weight:600} .pkt-t a{color:var(--ink); text-decoration:none} .pkt-t a:hover{color:var(--accent-text); text-decoration:underline} .pkt-t .num{font:500 12.5px var(--f-mono); color:var(--muted)}
.pkt-cv{flex:none; width:7px; height:7px; border-right:1.5px solid var(--muted); border-bottom:1.5px solid var(--muted); transform:rotate(-45deg); transition:transform .15s} .pkt-r[aria-expanded="true"] .pkt-cv{transform:rotate(45deg)}
.pkt-ar{color:var(--faint)} .pkt-n .pkst{width:24px; height:24px} .pkt-n .pkst svg{width:14px; height:14px}
.pkd{display:inline-flex; align-items:center; gap:6px; color:var(--muted)} .pkd.bad::before, .pkd.warn::before, .pkd.ok::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--tag-high)} .pkd.warn::before{background:var(--tag-med)} .pkd.ok::before{background:var(--ok)}
.pkd.bad, .pkd.warn, .pkd.ok{color:var(--ink)} .pkln{display:inline-flex; align-items:center; gap:5px; font-variant-numeric:tabular-nums; color:var(--ink)}
.pklc{gap:5px} .pklc .sico{width:12px; height:12px; flex:none; fill:none; stroke:currentColor; stroke-width:2}   /* the lines chip's diff icon */
.pklane .pkb .on{color:var(--ink)}   /* Package contents in greys; the PR's merge status icon keeps its colour */
.pklane .pchip, .pklane .pchip.bad, .pklane .pchip.warn, .pklane .pchip.info, .pklane .pchip.ok{color:var(--muted); background:var(--surface); border-color:var(--line)}
.pklane .pchip.bad::before, .pklane .pchip.warn::before, .pklane .pchip.ok::before{content:""; flex:none; width:6px; height:6px; border-radius:50%; background:var(--tag-high)} .pklane .pchip.warn::before{background:var(--tag-med)} .pklane .pchip.ok::before{background:var(--ok)}   /* a dot keeps the signal */
.pkpr > .dstat{align-self:start; padding-top:3px}
/* a PR row with room to read: icon on the title's line, three spaced lines (title, branch, chips) */
.pklane{gap:12px; padding:0} .pkbody{gap:16px; padding:12px 0 0} .pkl{margin-bottom:-2px}
.pklane .pkpr{grid-template-columns:28px minmax(0,1fr); column-gap:14px; align-items:start; padding:16px 18px; background:color-mix(in srgb, var(--ink) 3.5%, var(--surface)); border-color:var(--wline)}   /* a step off the widget's background: lighter in dark mode, a faint grey in light */

/* ---------- plan tab ---------- */
.tier{display:flex; flex-direction:column; gap:8px}
.tier > h3{font-size:16px; display:flex; gap:8px; align-items:center}
.tier > h3 span:not(.sev){font-weight:400; color:var(--muted); font-size:14px}
.blk{border:1px solid var(--line); background:var(--surface); border-radius:8px}
.blk > summary{list-style:none; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:4px 12px; padding:11px 14px; cursor:pointer; align-items:start}
.blk > summary::-webkit-details-marker{display:none}
.blk .p{font:500 13.5px var(--f-mono); overflow-wrap:anywhere}
.blk .w{grid-column:2; font-size:14px; color:var(--muted)}
.blk .r{display:flex; gap:6px; align-items:center}
.blk .body{padding:0 14px 14px}
.blk.done > summary .p{text-decoration:line-through; color:var(--faint)}
.chk{width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line); background:var(--surface); cursor:pointer; display:grid; place-items:center; font-size:13px; margin-top:1px}
.chk[aria-pressed="true"]{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.grp{display:flex; justify-content:space-between; gap:10px; padding:9px 14px; border-top:1px solid var(--line); font-size:14px}
.grp:first-child{border-top:0}
/* walkthrough: PR streams > units > chunks; each level shows its own progress */
.wkhead{display:flex; flex-direction:column; gap:10px}
.wkhead .btn{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ubar{display:flex; gap:2px; height:8px}
.ubar i{background:var(--line); border-radius:2px; min-width:3px}
.ubar i.h{background:color-mix(in srgb, var(--accent-line) 45%, var(--line))}
.ubar i.d{background:var(--accent-line)}
.stream{border:1px solid var(--line); background:var(--surface); border-radius:8px}
.stream.solo{border:0; background:none}
.stream > summary, .unit > summary{list-style:none; cursor:pointer; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:4px 12px; align-items:start}
.stream > summary::-webkit-details-marker, .unit > summary::-webkit-details-marker{display:none}
.stream > summary{padding:14px 16px}
.stream[open] > summary{border-bottom:1px solid var(--line)}
.stream .st0, .unit .ut{display:flex; flex-direction:column; gap:2px; min-width:0}
.stream .st0 b{font-weight:600}
.stream .st0 b .n{font:500 13px var(--f-mono); color:var(--muted); margin-right:4px}
.us{color:var(--muted); font-size:14px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden}
details[open] > summary .us{-webkit-line-clamp:unset}
.stream .r, .unit .r{display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; font-size:13px; padding-top:2px}
.units{display:flex; flex-direction:column; gap:8px; padding:12px}
.stream.solo .units{padding:0}
.unit{border:1px solid var(--line); background:var(--surface); border-radius:8px}
.unit > summary{grid-template-columns:auto auto minmax(0,1fr) auto; padding:11px 14px}
.unit .un{font:500 13px/22px var(--f-mono); color:var(--faint); min-width:2.2em}
.unit .ut b{font-weight:600}
.unit.done .ut b{color:var(--muted)}
.unit[open]{border-color:var(--line-strong)}
.unit .body{display:flex; flex-direction:column; gap:8px; padding:0 14px 14px}
.unit .blk{background:var(--bg)}
.unext{display:flex; justify-content:flex-end}
.udec{border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; gap:6px; font-size:14px; background:var(--surface)}
.udec.high{border-left-color:var(--bad)} .udec p{margin:0}
.dcalls{display:inline-flex; flex-wrap:wrap; gap:6px} .call{border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:3px 10px; font:500 13px var(--f-body); cursor:pointer; color:var(--ink)}
.call:hover{border-color:var(--accent-line)} .call.accept[aria-pressed="true"]{color:var(--ok); border-color:var(--ok)} .call.ask[aria-pressed="true"]{color:var(--warn); border-color:var(--warn)} .call.fix[aria-pressed="true"]{color:var(--bad); border-color:var(--bad)}
.tag.dec{color:var(--bad)} .udecs{display:flex; flex-direction:column; gap:8px; margin-bottom:6px} .ulink{border:0; background:none; padding:0; font:inherit; color:var(--accent-text); text-decoration:underline; cursor:pointer}
.drow2{display:grid; grid-template-columns:18px minmax(0,1fr) auto; gap:4px 10px; align-items:baseline; border-top:1px solid var(--line); padding-top:10px; font-size:14px}
.steps2{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:10px; font-size:14px} .steps2 li{display:flex; flex-direction:column; gap:4px} .steps2 label{display:flex; gap:8px; align-items:baseline; cursor:pointer}
@media (max-width:640px){ .drow2{grid-template-columns:18px minmax(0,1fr)} .drow2 .dcalls{grid-column:2} }
.ring{width:22px; height:22px; border-radius:50%; margin-top:1px; background:conic-gradient(var(--accent-line) calc(var(--p) * 1%), var(--line) 0); -webkit-mask:radial-gradient(circle, transparent 7px, #000 7.5px); mask:radial-gradient(circle, transparent 7px, #000 7.5px)}
.tag.must{font:500 11px/1.4 var(--f-body); letter-spacing:.2px; border:1px solid var(--accent-line); border-radius:6px; padding:1px 6px; white-space:nowrap; background:var(--accent-soft); color:var(--accent-text)}
.pass{display:flex; flex-wrap:wrap; gap:4px 14px; align-items:center; padding:4px 2px 0; font-size:13.5px; color:var(--muted)}
.pass > span{display:inline-flex; gap:6px; align-items:center}

.ptests{padding:6px 2px 0; font-size:13.5px; color:var(--muted)} .ptests summary{cursor:pointer; list-style:none} .ptests summary::-webkit-details-marker{display:none}

.ptf{margin-top:8px} .ptf b{font-weight:600; color:var(--ink); font-size:13px} .ptf p{margin:2px 0 0 18px; font-size:13px}
.ptests ul{margin:4px 0 0; padding-left:18px; columns:2 280px; column-gap:24px} .ptests li{break-inside:avoid; overflow-wrap:anywhere; margin:1px 0}
.pass details > summary{cursor:pointer; color:var(--accent-text); list-style:none}

.pass details[open] > summary .l{display:inline}
.pass details[open]{display:flex; flex-direction:column-reverse; gap:6px; align-items:flex-start}
.pass details > .pass{padding:0}
.grp span:last-child{color:var(--muted); white-space:nowrap}

/* ---------- code ---------- */

/* ---------- architecture ---------- */
.seg{display:flex; gap:6px; flex-wrap:wrap}

.tw{overflow-x:auto; margin-top:14px}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{text-align:left; padding:8px 10px; border-top:1px solid var(--line); vertical-align:top}

table.scope th:first-child{min-width:240px}
.scopeline{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 14px; align-items:center; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:12px 16px; cursor:pointer}

.split{display:grid; grid-template-columns:minmax(200px, 270px) minmax(0,1fr); gap:18px; align-items:start}

.files button{display:flex; gap:8px; align-items:center; width:100%; border:0; background:none; text-align:left; padding:6px 8px; border-radius:8px; cursor:pointer; font-size:13.5px}
