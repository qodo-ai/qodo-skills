<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: one PR, one reading column. The point first (the chapter's lead beat), then the story in its own
   shapes and tables, the evidence (tests and checks), how dangerous the merge is, and your outcome. */
:root{
  --bg:#f6f7f8; --surface:#ffffff; --fg:#1c2329; --muted:#5b6670; --line:#dde2e6;
  --accent:#1f6f8b; --accent-soft:#e2eff4; --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#b23a3a; --bad-soft:#fbe6e6;
  --ok:#2a7a46; --ok-soft:#e3f2e8; --add:#2a7a46; --del:#b23a3a; --code-bg:#eef1f3; --add-bg:#e7f4ec; --del-bg:#fbeaea;
  /* the names kit.js styles its switcher and diagram explorer with */
  --ink:var(--fg); --sunk:var(--code-bg); --faint:#76818a; --hl:#fdf6d8; --shadow:0 1px 2px rgba(20,30,40,.06), 0 8px 24px rgba(20,30,40,.08);
  --f-display:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171b; --surface:#1a2126; --fg:#e3e8ec; --muted:#95a1ab; --line:#2b343b;
  --accent:#6fb7d1; --accent-soft:#19323d; --warn:#e3a64a; --warn-soft:#3a2c14; --bad:#ec8a8a; --bad-soft:#3a1c1c;
  --ok:#6fc28c; --ok-soft:#17321f; --add:#6fc28c; --del:#ec8a8a; --code-bg:#20282e; --add-bg:#16291e; --del-bg:#2e1a1a;
  --faint:#7d8992; --hl:#33300f; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12171b; --surface:#1a2126; --fg:#e3e8ec; --muted:#95a1ab; --line:#2b343b;
  --accent:#6fb7d1; --accent-soft:#19323d; --warn:#e3a64a; --warn-soft:#3a2c14; --bad:#ec8a8a; --bad-soft:#3a1c1c;
  --ok:#6fc28c; --ok-soft:#17321f; --add:#6fc28c; --del:#ec8a8a; --code-bg:#20282e; --add-bg:#16291e; --del-bg:#2e1a1a;
  --faint:#7d8992; --hl:#33300f; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--fg); font:15px/1.6 var(--f-body); margin:0; padding-inline:16px; padding-block:0 64px}
main{max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:40px; padding-top:32px}
h1,h2,h3{font-family:var(--f-display); font-weight:600; text-wrap:balance; margin:0}
h1{font-size:30px; line-height:1.2}
h2{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding-bottom:8px; border-bottom:1px solid var(--line)}
h3{font-size:19px; line-height:1.3}
p{margin:0; max-width:68ch}
code,.mono{font-family:var(--f-mono); font-size:.9em}
p code, li code, td code, .chip code, h3 code{background:var(--code-bg); padding:1px 5px; border-radius:4px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button,textarea,select{font:inherit; color:inherit}
section{display:flex; flex-direction:column; gap:16px; min-width:0}
.n{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* the session bar: which PR of the set, and the style switcher */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; margin-inline:-16px; padding:10px 16px; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.bar .in{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,820px) minmax(0,1fr); gap:10px 16px; align-items:center}
.bar .l{grid-column:2; display:flex; flex-direction:column; gap:6px; min-width:0}
.bar #cknav{grid-column:3; justify-self:end; align-self:start}
@media (max-width:1240px){ .bar .in{grid-template-columns:minmax(0,1fr) auto} .bar .l{grid-column:1} .bar #cknav{grid-column:2} }
.nb.ov{font-family:var(--f-body); font-weight:600}
.bar .t{min-width:0; font-size:13.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar .t b{color:var(--fg); font-weight:600}
.nav{display:flex; gap:6px; align-items:center; min-width:0}
/* one row: the arrows stay put, the chips between them scroll sideways when they don't fit */
.nav .chips{display:flex; gap:6px; min-width:0; overflow-x:auto; scrollbar-width:none; overscroll-behavior-x:contain; scroll-padding-inline:24px; -webkit-mask:linear-gradient(90deg, transparent, #000 12px, #000 calc(100% - 12px), transparent); mask:linear-gradient(90deg, transparent, #000 12px, #000 calc(100% - 12px), transparent); padding-inline:8px}
.nav .chips::-webkit-scrollbar{display:none}
.nav .nb{flex:none}
.nb{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:3px 10px; font:500 13px/1.5 var(--f-mono); cursor:pointer; white-space:nowrap}
.nb:hover{border-color:var(--accent)}
.nb[aria-current="true"]{background:var(--accent); border-color:var(--accent); color:var(--surface)}
.nb:disabled{opacity:.4; cursor:default}

.head{display:flex; flex-direction:column; gap:12px}
.crumb{font-family:var(--f-mono); font-size:13px; color:var(--muted); overflow-wrap:anywhere}
.meta{display:flex; flex-wrap:wrap; gap:8px; font-size:13px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:var(--surface); white-space:nowrap; font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-soft); border-color:transparent; color:var(--ok)}
.pill.warn{background:var(--warn-soft); border-color:transparent; color:var(--warn)}
.pill.bad{background:var(--bad-soft); border-color:transparent; color:var(--bad)}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor}
.add{color:var(--add)} .del{color:var(--del)}
.lede{font-size:17px; color:var(--muted)}

/* beats */
.beat{display:flex; flex-direction:column; gap:12px; min-width:0}
.beat + .beat{padding-top:8px}
.beat > p{color:var(--fg)}
pre{margin:0; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; overflow-x:auto; font:13px/1.7 var(--f-mono)}
pre .a{color:var(--add)} pre .d{color:var(--del)} pre .c{color:var(--muted)}
.notes{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:14px; color:var(--muted)}
.notes li{display:grid; grid-template-columns:auto 1fr; gap:10px}
.notes li b{font:500 12px/1.9 var(--f-mono); color:var(--accent)}
.tw{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{text-align:left; padding:9px 12px; vertical-align:top; border-top:1px solid var(--line)}
thead th{border-top:0; font:500 12px/1.4 var(--f-body); letter-spacing:.04em; color:var(--muted)}
.code{font:12.5px/1.6 var(--f-mono); background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow-x:auto; padding:6px 0}
.cl{display:flex; white-space:pre}
.cl .ln{width:52px; flex:none; text-align:right; padding-right:12px; color:var(--faint); user-select:none}
.cl .sg{width:16px; flex:none; color:var(--faint)}
.cl .tx{padding-right:14px}
.cl.add{background:var(--add-bg)} .cl.add .sg{color:var(--add)}
.cl.del{background:var(--del-bg)} .cl.del .sg{color:var(--del)}
.cl.hl .tx{background:var(--hl)}
.cl.cut .tx{color:var(--faint); font-style:italic}
.where{font:12.5px var(--f-mono); color:var(--muted); overflow-wrap:anywhere}
.mbox{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px; text-align:center}
.mbox pre{border:0; padding:0; text-align:left; color:var(--muted); white-space:pre-wrap; font-size:12px}
.mbox svg{max-width:100%; height:auto}
.callout{border-left:3px solid var(--accent); padding:4px 0 4px 14px; font-size:15px}
.callout.risk{border-left-color:var(--bad)} .callout.risk strong{color:var(--bad)}
.callout.warn,.callout.gap{border-left-color:var(--warn)} .callout.warn strong,.callout.gap strong{color:var(--warn)}
.callout.good{border-left-color:var(--ok)} .callout.good strong{color:var(--ok)}

.question{background:var(--accent-soft); border-radius:10px; padding:16px 18px; display:flex; flex-direction:column; gap:12px}
.question strong{font-weight:600}
.forms{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px}
.form{background:var(--surface); border:1px solid transparent; border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; min-width:0; text-align:left; cursor:pointer; font-size:14px}
.form:hover{border-color:var(--accent)}
.form[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.form .label{font-size:12px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
.form[aria-pressed="true"] .label{color:var(--accent)}

.ba{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; display:flex; flex-direction:column; gap:10px; min-width:0}
.card .tag{font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.tests{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:13.5px}
.tests li{display:grid; grid-template-columns:18px minmax(0,1fr); gap:6px}
.tests li::before{content:"✓"; color:var(--ok); font-weight:600}
.tests li.file::before{content:"▸"; color:var(--accent); font-size:11px; padding-top:3px}
.tests li.failed::before{content:"✗"; color:var(--bad)}
.tests li.skip::before{content:"–"; color:var(--muted)}
.tests small{color:var(--muted); font-family:var(--f-mono); font-size:12px; overflow-wrap:anywhere}
.legend{font-size:12px; color:var(--muted)}

.danger{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px}
.danger .big{font-family:var(--f-display); font-size:22px; font-weight:600; line-height:1.2}
.danger .card p{font-size:14px; color:var(--muted)}

.fnd{display:flex; flex-direction:column; gap:8px}
.fnd .sev{font:600 11px/1.4 var(--f-body); letter-spacing:.06em; text-transform:uppercase}
.fnd.high .sev,.fnd.critical .sev{color:var(--bad)} .fnd.medium .sev{color:var(--warn)} .fnd.low .sev,.fnd.info .sev{color:var(--muted)}
.fnd.high,.fnd.critical{border-color:color-mix(in srgb, var(--bad) 45%, var(--line))}
.fnd b{font-weight:600}
.fnd .body{font-size:14px; color:var(--muted)}
.fnd .agent{font-size:14px} .fnd .agent em{font-style:normal; font-weight:600}
.fnd .agent.agree em{color:var(--ok)} .fnd .agent.disagree em{color:var(--bad)} .fnd .agent.partial em{color:var(--warn)}
details.rest > summary{cursor:pointer; color:var(--accent); font-size:14px}
details.rest[open] > summary{margin-bottom:12px}

.verdict{display:flex; flex-wrap:wrap; gap:8px}
.vb{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:8px 14px; cursor:pointer; font-weight:500; font-size:14px}
.vb:hover{border-color:var(--accent)}
.vb[aria-pressed="true"]{border-color:transparent}
.vb.approve[aria-pressed="true"]{background:var(--ok-soft); color:var(--ok)}
.vb.comment[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent)}
.vb.changes[aria-pressed="true"]{background:var(--bad-soft); color:var(--bad)}
textarea{width:100%; min-height:84px; resize:vertical; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.row{display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 14px; cursor:pointer; font-weight:500; font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:var(--surface)}
.mynotes{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.mynotes li{display:flex; justify-content:space-between; gap:12px; align-items:flex-start; font-size:14px; border-left:3px solid var(--accent); padding:2px 0 2px 12px}
.mynotes li.blocking{border-left-color:var(--bad)} .mynotes li.question{border-left-color:var(--warn)}
.mynotes button{border:0; background:none; color:var(--muted); cursor:pointer; font-size:13px; padding:0}
#toast{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); z-index:50; background:var(--fg); color:var(--bg); padding:8px 16px; border-radius:999px; font-size:14px}
@media (max-width:600px){ h1{font-size:25px} .bar .in{grid-template-columns:minmax(0,1fr)} .bar #cknav{grid-column:1; grid-row:1} .bar .l{grid-column:1; grid-row:2} }
</style>

<div class="bar"><div class="in"><div class="l"><span class="t" id="sess"></span><span class="nav" id="nav"></span></div><span id="cknav"></span></div></div>
<main id="main"></main>
<div id="toast" hidden role="status"></div>

{{DATA}}
<script>
{{KIT}}
</script>
<script>
(() => {
const { esc, md, cases, caseIds, base, codeHtml, store, sevRank } = KIT;
const C = cases[caseIds[0]];
const $ = (s) => document.querySelector(s);
const SKEY = "onepage:" + C.session;
const S = Object.assign({ pr: null, picks: {}, verdict: {}, notes: [], nk: "note" }, store.get(SKEY, {}));
const save = () => store.set(SKEY, S);
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); };
const strip = (t) => String(t || "").replace(/^(feat|fix|chore|refactor|docs|test)(\([^)]*\))?!?:\s*/i, "");
const multiRepo = new Set(C.prs.map((p) => p.repo)).size > 1;
const shortPr = (k) => (multiRepo ? k.split("/")[1].replace("#", " #") : "#" + k.split("#")[1]);
const isOpen = (f) => !f.status || f.status === "open";
const P = Object.fromEntries(C.prs.map((p) => [p.key, p]));
const pl = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const story = C.story || [];
const BRIEF = story.find((b) => b.kind === "brief");
const ADDS = Object.fromEntries(((BRIEF && BRIEF.contributions) || []).map((x) => [x.pr, x.adds]));
const ORDER = (() => { const c = ((BRIEF && BRIEF.contributions) || []).map((x) => x.pr); return C.prs.slice().sort((a, b) => { const i = c.indexOf(a.key), j = c.indexOf(b.key); return (i < 0 ? 1e3 : i) - (j < 0 ? 1e3 : j); }); })();
const slug = (p) => "pr-" + p.number + (multiRepo ? "-" + p.repo.replace(/[^\w-]/g, "-") : "");   // the whole owner/repo: two owners can share a repo name
const isTest = (p, path) => { const f = p.files.find((x) => x.path === path); return (f && f.role === "test") || /(^|\/)(tests?|__tests__|spec)\/|(^|\/)test_[^/]*$|_test\.\w+$|\.(test|spec)\.\w+$/.test(path); };
const human = (s) => { const t = s.replace(/^test_?/, "").replace(/_/g, " ").trim(); return t ? t[0].toUpperCase() + t.slice(1) : s; };

/* ---------- beats: each chapter beat in its own form ---------- */
function shapePre(text, notes) {
  return `<pre>${String(text).split("\n").map((l) => { const ci = l.search(/\s#\s/), body = ci > 0 ? l.slice(0, ci) : l, cm = ci > 0 ? l.slice(ci) : "";
    const k = l[0] === "+" ? "a" : l[0] === "-" ? "d" : ""; return `${k ? `<span class="${k}">` : ""}${esc(body)}${k ? "</span>" : ""}${cm ? `<span class="c">${esc(cm)}</span>` : ""}`; }).join("\n")}</pre>${notesHtml(notes)}`;
}
const notesHtml = (notes) => (notes || []).length ? `<ul class="notes">${notes.map((n) => `<li><b>${esc(n.line != null ? "L" + n.line : "·")}</b><span>${md(n.text)}</span></li>`).join("")}</ul>` : "";
/* media: the view inlines a session file (or keeps its URL); a video gets a link, not a player */
function mediaHtml(src, caption, type) {
  const m = (C.media || []).find((x) => x.file === src || x.src === src), url = m ? m.src : /^https:\/\//.test(src || "") ? src : null;
  if (!url) return `<p class="muted" style="font-size:14px">${esc(src || "media")} is not in this page.</p>`;
  return type === "video" || /\.(mp4|webm|mov)$/i.test(src || "") ? `<p><a href="${esc(url)}" target="_blank" rel="noopener">Watch: ${esc(caption || src)} ↗</a></p>`
    : `<figure style="margin:0"><img src="${esc(url)}" alt="${esc(caption || (m && m.title) || "")}" style="border:1px solid var(--line);border-radius:10px">${caption ? `<figcaption class="legend">${md(caption)}</figcaption>` : ""}</figure>`;
}
const refsLine = (b) => (b.refs || []).length ? `<span class="where">${b.refs.slice(0, 3).map((r) => esc(`${base(r.path)}${r.line ? ":" + r.line + (r.end_line && r.end_line !== r.line ? "–" + r.end_line : "") : ""}`)).join(" · ")}${b.refs.length > 3 ? ` · ${b.refs.length - 3} more` : ""}</span>` : "";
function beatHtml(p, b, opts = {}) {
  const head = `${opts.noTitle || !b.title ? "" : `<h3>${md(b.title)}</h3>`}${b.lede ? `<p>${md(b.lede)}</p>` : ""}`;
  let body = "";
  if (b.kind === "shape" && b.text) body = shapePre(b.text, b.notes);
  else if (b.kind === "code") { const c = p.code["beat:" + b.id]; body = `<span class="where">${esc(b.path)}:${b.from}–${b.to || b.from}</span>${c ? codeHtml(c, { hl: (b.notes || []).map((n) => n.line) }) : ""}${notesHtml(b.notes)}`; }
  else if (b.kind === "table") body = `<div class="tw"><table>${(b.columns || []).length ? `<thead><tr>${b.columns.map((c) => `<th>${md(c)}</th>`).join("")}</tr></thead>` : ""}<tbody>${(b.rows || []).map((r) => `<tr>${r.map((c) => `<td>${md(String(c))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  else if (b.kind === "diagram" && b.mermaid) body = KIT.mermaidBox(b.mermaid);
  else if (b.kind === "views") body = (b.views || []).map((v) => `<div class="card"><span class="tag">${esc(v.label || "")}</span>${v.question ? `<p style="color:var(--accent)">${md(v.question)}</p>` : ""}${v.lede ? `<p class="muted" style="font-size:14px">${md(v.lede)}</p>` : ""}${v.mermaid ? KIT.mermaidBox(v.mermaid) : v.shape && v.shape.text ? shapePre(v.shape.text) : ""}</div>`).join("");
  else if (b.kind === "media") body = mediaHtml(b.src, b.caption || "", b.type);
  else if (b.kind === "stat") body = `<div class="danger">${(b.items || []).map((x) => `<div class="card"><span class="tag" style="color:${x.tone === "good" ? "var(--ok)" : x.tone === "bad" ? "var(--bad)" : "var(--muted)"}">${md(x.label || "")}</span><span class="big">${md(String(x.value ?? ""))}</span></div>`).join("")}</div>`;
  else if (b.kind === "before_after") body = `<div class="ba">${["before", "after"].map((k) => { const s = b[k] || {}; return `<div class="card"><span class="tag" style="color:${k === "after" ? "var(--ok)" : "var(--muted)"}">${esc(s.label || (k === "before" ? "Before" : "After"))}</span>${s.mermaid ? KIT.mermaidBox(s.mermaid) : s.media ? mediaHtml(s.media, "") : s.code ? `<pre>${esc(s.code)}</pre>` : s.text ? `<p>${md(s.text)}</p>` : ""}</div>`; }).join("")}</div>`;
  else if (b.kind === "callout") return `<div class="beat"><p class="callout ${esc(b.tone || "")}">${b.title ? `<strong>${md(b.title)}.</strong> ` : ""}${md(b.text || b.lede || "")}</p></div>`;
  else if (b.text) body = `<p>${md(b.text)}</p>`;
  return `<div class="beat">${head}${body}${b.kind === "code" ? "" : refsLine(b)}</div>`;
}
/* an answer is keyed by its story ("s" for the session, else the PR): beat ids are unique only within one story */
const qkey = (scope, q) => scope + "|" + q.id;
function questionHtml(scope, q) {
  const key = qkey(scope, q), pick = S.picks[key];
  return `<div class="question"><p><strong>Open question for the reviewer.</strong> ${md(q.ask || q.title || "")}</p>${q.lede ? `<p class="muted" style="font-size:14px">${md(q.lede)}</p>` : ""}
    <div class="forms">${(q.options || []).map((o, i) => `<button class="form" data-pick="${esc(key)}|${i}" aria-pressed="${pick === i}"><span class="label">${pick === i ? "Your answer" : "Option " + (i + 1)}</span><span>${md(o)}</span></button>`).join("")}</div></div>`;
}

/* ---------- evidence: the tests this PR adds or changes, and the checks it ran ---------- */

  KIT.send([KIT.noteEvent({ id: n.id, pr: n.pr, type: n.kind === "note" ? null : n.kind, text: n.text, label: n.pr })])
    .then((ok) => { if (!KIT.served) return; n.unsent = !ok; keep(() => {}); toast(ok ? "Added to your Agent Session Review notes" : "Couldn't reach the Agent Session Review: the note is only in this browser"); });
}
async function loadRemote() {
  if (!KIT.served) return;
  try {
    const j = await (await fetch("/api/events")).json(), last = {};
    (j.events || []).forEach((e) => { if (e.type === "note" && e.note_id) last[e.note_id] = e.undo ? null : e; });
    const KINDS = { "🚫": "blocking", "❓": "question" };
    REMOTE = Object.values(last).filter(Boolean).filter((e) => e.text).map((e) => ({ id: e.note_id, pr: e.pr, kind: KINDS[e.emoji] || "note", text: e.text, from: e.source || "cockpit",
      where: e.path ? `${e.path}${e.line ? ":" + e.line : ""}` : (e.target && e.target.label) || "" }));
    render();
  } catch (_) {}
}

const MULTI = ORDER.length > 1;
const cur = () => (MULTI && (S.pr === "overview" || !S.pr) ? null : ORDER.find((p) => p.key === S.pr) || ORDER[0]);
const pageNo = () => { const p = cur(); return p ? ORDER.indexOf(p) : -1; };
function render() {
  const p = cur(), i = pageNo();
  $("#sess").innerHTML = MULTI ? `<b>${esc(C.title)}</b> · ${p ? `PR ${i + 1} of ${ORDER.length}` : `Overview of ${ORDER.length} PRs`}` : `<b>${esc(C.title)}</b>`;
  $("#nav").innerHTML = MULTI ? `<button class="nb" data-go="${i - 1}" ${i > -1 ? "" : "disabled"} aria-label="Previous page">←</button><span class="chips"><button class="nb ov" data-go="-1" aria-current="${!p}" title="The whole set on one page">Overview</button>${ORDER.map((q, j) => `<button class="nb" data-go="${j}" aria-current="${j === i}" title="${esc(strip(q.title))}">${esc(shortPr(q.key))}</button>`).join("")}</span><button class="nb" data-go="${i + 1}" ${i < ORDER.length - 1 ? "" : "disabled"} aria-label="Next page">→</button>` : "";
  const on = document.querySelector('.nav [aria-current="true"]');
  if (on) { const box = on.parentNode, l = on.offsetLeft - box.offsetLeft; if (l < box.scrollLeft + 24 || l + on.offsetWidth > box.scrollLeft + box.clientWidth - 24) box.scrollLeft = l - (box.clientWidth - on.offsetWidth) / 2; }
  $("#main").innerHTML = p ? prPage(p) : overviewPage();
  if ($("#main").querySelector("[data-mermaid]")) loadMermaid();
}
let mm = false;
function loadMermaid() {
  if (window.mermaid) return KIT.mermaid($("#main"));
  if (mm) return; mm = true;
  const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"; s.onload = () => KIT.mermaid($("#main")); document.head.appendChild(s);
}
const keep = (fn) => { const y = window.scrollY; fn(); save(); render(); window.scrollTo(0, y); };
function goPr(j) { if (j === -1 && MULTI) { S.pr = "overview"; } else { const p = ORDER[j]; if (!p) return; S.pr = p.key; } save(); try { history.replaceState(null, "", "#" + (cur() ? slug(cur()) : "overview")); } catch (_) {} render(); window.scrollTo({ top: 0 }); }
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.go !== undefined) return goPr(+d.go);
  if (d.pick) { const j = d.pick.lastIndexOf("|"), q = d.pick.slice(0, j), i = +d.pick.slice(j + 1); return keep(() => { S.picks[q] = S.picks[q] === i ? null : i; }); }
  if (d.verdict) { const [k, v] = d.verdict.split("|"); return keep(() => { S.verdict[k] = S.verdict[k] === v ? null : v; }); }
  if (d.addnote) {
    const ta = $("#nt"), text = ta.value.trim(); if (!text) return ta.focus();
    const n = { id: "op-" + Date.now(), pr: d.addnote, kind: $("#nk").value, text }; S.nk = n.kind;
    keep(() => S.notes.push(n));
    sync(n);
    return;
  }
  if (d.resync) { const n = S.notes.find((x) => x.id === d.resync); return n && sync(n); }
  if (d.unnote) {
    const n = S.notes.find((x) => x.id === d.unnote), drop = () => keep(() => { S.notes = S.notes.filter((x) => x !== n); });
    if (!n) return;
    if (!KIT.served || n.unsent) return drop();
    KIT.send([KIT.undoNote(n.id, n.pr)]).then((ok) => ok ? drop() : toast("Couldn't reach the Agent Session Review: the note is still there. Try again."));
    return;
  }
  if (d.copy !== undefined) {
    const text = reviewMd(), fallback = () => { const o = $("#mdout"); o.hidden = false; o.textContent = text; const r = document.createRange(); r.selectNodeContents(o); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected: copy it with your keyboard"); };
    try { navigator.clipboard.writeText(text).then(() => toast("Review copied as Markdown"), fallback); } catch (_) { fallback(); }
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select")) return;
  const i = pageNo();
  if (e.key === "ArrowRight" || e.key === "]") goPr(i + 1); else if (e.key === "ArrowLeft" || e.key === "[") goPr(i - 1);
});
const h0 = (location.hash || "").slice(1), hp = ORDER.find((p) => slug(p) === h0);
if (hp) S.pr = hp.key; else if (h0 === "overview") S.pr = "overview";
render(); loadRemote();
$("#cknav").innerHTML = KIT.navHtml(); KIT.liveBanner(document.querySelector(".bar")); KIT.freshBar(document.querySelector(".bar"), C);
})();
</script>
