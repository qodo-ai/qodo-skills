<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..110,400..800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a route. A sticky bar carries the three stages (Brief, Read, Decide) as stops on one line; under it the active stage fills the page. Brief is a stepped stage; Read is a plan strip over a workbench shaped by the work package, with a code drawer; Decide is a rail plus one card, then the review. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --sunk:#E8ECF0; --ink:#121820; --muted:#556172; --faint:#8893A1; --line:#D5DBE2;
  --accent:#0E7268; --accent-ink:#FFFFFF; --accent-soft:#DCEEEB; --hl:#FFF0B8;
  --deep:#A3241C; --review:#E0A526; --skim:#5B8DB8; --skip:#C3CBD4;
  --add-bg:#E5F3E8; --del-bg:#FBE8E5; --add:#1D6A33; --del:#9B2C22;
  --ok:#2A7643; --warn:#9A5B00; --bad:#A3241C;
  --shadow:0 1px 2px rgba(18,24,32,.06), 0 8px 24px rgba(18,24,32,.07);
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1216; --surface:#141B21; --sunk:#1A232B; --ink:#E3E9EF; --muted:#97A4B2; --faint:#6A7785; --line:#25303A;
  --accent:#3DB4A6; --accent-ink:#05201C; --accent-soft:#12302C; --hl:#3B3212;
  --deep:#D9483B; --review:#F2B950; --skim:#6E9BCB; --skip:#4A5361;
  --add-bg:#12281A; --del-bg:#321819; --add:#7DD19A; --del:#F09A8F;
  --ok:#5EC27F; --warn:#E8A33A; --bad:#E5685B; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1216; --surface:#141B21; --sunk:#1A232B; --ink:#E3E9EF; --muted:#97A4B2; --faint:#6A7785; --line:#25303A;
  --accent:#3DB4A6; --accent-ink:#05201C; --accent-soft:#12302C; --hl:#3B3212;
  --deep:#D9483B; --review:#F2B950; --skim:#6E9BCB; --skip:#4A5361;
  --add-bg:#12281A; --del-bg:#321819; --add:#7DD19A; --del:#F09A8F;
  --ok:#5EC27F; --warn:#E8A33A; --bad:#E5685B; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font:16px/1.55 var(--f-body); margin:0}
a{color:var(--accent)}
button{font:inherit; color:inherit}
code{font:.86em var(--f-mono); background:var(--sunk); padding:.08em .35em; border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display); font-stretch:88%; text-wrap:balance; margin:0; line-height:1.15; letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.lbl{font:600 11px/1.2 var(--f-mono); letter-spacing:.09em; text-transform:uppercase; color:var(--faint)}
.muted{color:var(--muted)}
.wrap{max-width:1240px; margin:0 auto; padding-inline:20px}

/* ---------- route bar ---------- */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.bar .wrap{display:flex; align-items:center; gap:18px; padding-block:10px; flex-wrap:wrap}
.brand{display:flex; flex-direction:column; min-width:0}
.brand .lbl{color:var(--accent)}
.brand b{font:700 17px/1.2 var(--f-display); font-stretch:85%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.route{flex:1; display:flex; align-items:center; gap:0; min-width:280px; justify-content:center}
.stop{display:flex; align-items:center; gap:10px; background:none; border:0; padding:6px 10px; border-radius:10px; cursor:pointer; text-align:left}
.stop:hover{background:var(--sunk)}
.stop .dot{width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font:700 12px var(--f-mono); color:var(--muted); background:var(--surface); flex:none}
.stop .t{display:flex; flex-direction:column; line-height:1.15}
.stop .t b{font:700 15px var(--f-display); font-stretch:90%}
.stop .t span{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.stop[aria-current="step"] .dot{border-color:var(--accent); background:var(--accent); color:var(--accent-ink)}
.stop.done .dot{border-color:var(--accent); color:var(--accent)}
.leg{flex:0 1 56px; height:2px; background:var(--line); min-width:16px}
.leg.on{background:var(--accent)}
.tools{display:flex; gap:8px}
.ghost{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:6px 11px; cursor:pointer; font-size:14px}
.ghost:hover{border-color:var(--faint)}
.primary{background:var(--accent); color:var(--accent-ink); border:0; border-radius:9px; padding:9px 16px; font-weight:700; cursor:pointer}
.primary:hover{filter:brightness(1.06)}
main{padding-block:26px 80px}

/* ---------- tier bits ---------- */
.tb{display:flex; height:8px; border-radius:4px; overflow:hidden; background:var(--sunk); min-width:40px}
.tb i{display:block; height:100%}
.t-deep{background:var(--deep)} .t-review{background:var(--review)} .t-skim{background:var(--skim)} .t-skip{background:var(--skip)}
.td{width:9px; height:9px; border-radius:2px; display:inline-block; flex:none}
.chip{display:inline-flex; align-items:center; gap:5px; font:600 12px/1 var(--f-body); padding:4px 8px; border-radius:999px; background:var(--sunk); color:var(--muted); white-space:nowrap}
.chip.high{background:color-mix(in srgb, var(--bad) 16%, transparent); color:var(--bad)}
.chip.medium{background:color-mix(in srgb, var(--review) 22%, transparent); color:var(--warn)}
.chip.ok{background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok)}
.chip.acc{background:var(--accent-soft); color:var(--accent)}

/* ---------- code ---------- */
.code{font:12.5px/1.55 var(--f-mono); background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:auto; max-height:520px}
.cl{display:grid; grid-template-columns:48px 18px 1fr; white-space:pre; min-width:max-content}
.cl .ln{color:var(--faint); text-align:right; padding-right:8px; user-select:none}
.cl .sg{color:var(--faint); user-select:none}
.cl.add{background:var(--add-bg)} .cl.add .sg{color:var(--add)}
.cl.del{background:var(--del-bg)} .cl.del .sg{color:var(--del)}
.cl.hl{box-shadow:inset 3px 0 0 var(--deep); background:var(--hl)}
.cl.cut .tx{color:var(--faint); font-style:italic}
.shape{font:12.5px/1.6 var(--f-mono); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; overflow:auto; white-space:pre; margin:0}
.shape .a{color:var(--add)} .shape .d{color:var(--del)}
.mbox{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; overflow:auto}
.mbox pre{font:12px var(--f-mono); color:var(--muted); white-space:pre-wrap; margin:0}
.mbox svg{max-width:100%; height:auto}

/* ---------- BRIEF ---------- */
.brief{display:grid; grid-template-columns:220px 1fr; gap:28px; align-items:start}
.toc{position:sticky; top:96px; display:grid; gap:2px}
.toc button{display:grid; grid-template-columns:22px 1fr; gap:8px; text-align:left; background:none; border:0; padding:7px 8px; border-radius:8px; cursor:pointer; color:var(--muted); font-size:14px; line-height:1.3}
.toc button span:first-child{font:600 11px/1.6 var(--f-mono); color:var(--faint)}
.toc button[aria-current="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.toc button[aria-current="true"] span:first-child{color:var(--accent)}
.screen{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:34px 38px; min-height:540px; display:flex; flex-direction:column; gap:18px; min-width:0}
.screen h2{font-size:clamp(26px, 3.2vw, 38px)}
.screen .lede{font-size:18.5px; color:var(--muted); max-width:68ch; margin:0}
.screen .sfoot{margin-top:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding-top:14px; border-top:1px solid var(--line)}
.screen .sfoot .sp{flex:1}
.prog{display:flex; gap:4px} .prog i{width:22px; height:4px; border-radius:2px; background:var(--line)} .prog i.on{background:var(--accent)}
.say{font-size:13.5px; color:var(--muted); font-style:italic; max-width:60ch}
.facts{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px}
.fact{border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.fact b{display:block; font:700 26px/1.1 var(--f-display); font-variant-numeric:tabular-nums}
.fact span{font-size:13px; color:var(--muted)}
.prlist{display:grid; gap:6px}
.prrow{display:grid; grid-template-columns:72px minmax(0,1fr) 120px auto; gap:12px; align-items:center; font-size:14.5px; padding:6px 0; border-bottom:1px dashed var(--line)}
.prrow .n{font:600 13px var(--f-mono); color:var(--muted)}
.prrow .ti{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.notice{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:14px}
.ncard{border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px}
.ncard.risk{border-top-color:var(--deep)} .ncard.decision{border-top-color:var(--review)}
.ncard h3{font-size:19px}
.ncard p{margin:0; color:var(--muted); font-size:15px}
.ncard button{align-self:flex-start; margin-top:auto}
.paras{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px 24px}
.paras p{margin:0; font-size:15.5px} .paras b{display:block; font:700 13px var(--f-display); letter-spacing:.04em; text-transform:uppercase; color:var(--accent); margin-bottom:2px}
.contrib{display:grid; gap:4px; font-size:14.5px}
.contrib div{display:grid; grid-template-columns:72px 1fr; gap:10px}
.contrib span{font:600 13px var(--f-mono); color:var(--muted)}
.tabs{display:flex; gap:6px; flex-wrap:wrap}
.tabs button{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 12px; cursor:pointer; font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.journey{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; counter-reset:j}
.jstep{border:1px solid var(--line); border-radius:12px; padding:12px; font-size:14.5px; position:relative}
.jstep::before{counter-increment:j; content:counter(j); font:700 12px var(--f-mono); color:var(--accent)}
.jstep .a{font-weight:700; display:block}
.jstep.new{border-color:color-mix(in srgb, var(--accent) 50%, var(--line))}
.moment{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:20px; align-items:start}
.side{display:grid; gap:10px; font-size:15px}
.side .card{border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.fnd{border-left:3px solid var(--review); padding:8px 12px; background:var(--sunk); border-radius:0 8px 8px 0; font-size:14px}
.fnd.high,.fnd.critical{border-left-color:var(--deep)} .fnd.low{border-left-color:var(--skim)}
.fnd b{display:block}
.fnd p{margin:4px 0 0; color:var(--muted)}
.gallery{display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:18px; align-items:start}
.shot{margin:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--sunk)}
.shot img{display:block; width:100%; height:auto}
.shot figcaption{padding:12px 14px; font-size:14.5px; background:var(--surface); border-top:1px solid var(--line)}
.shot figcaption b{display:block; font-family:var(--f-display); font-size:17px}
.thumbs{display:grid; gap:8px}
.pshot{display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.pshot figcaption{border-top:0; border-left:1px solid var(--line)}
.thumbs button{display:grid; grid-template-columns:76px 1fr; gap:8px; align-items:center; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:5px; cursor:pointer; font-size:13px; line-height:1.25}
.thumbs button[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.thumbs img{width:76px; height:48px; object-fit:cover; object-position:top; border-radius:6px; display:block}
.qs{display:grid; gap:12px}
.q{border:1px solid var(--line); border-radius:12px; padding:14px 16px}
.q h3{font-size:19px} .q p{margin:6px 0; color:var(--muted)}
.opts{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.opts button{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:7px 12px; cursor:pointer; font-size:14px}
.opts button[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:700}
.rt{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:14px}
.rt .card{border:1px solid var(--line); border-radius:12px; padding:14px}

/* ---------- READ ---------- */
.strip{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 18px; display:grid; gap:12px; box-shadow:var(--shadow)}
.strip .row{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.strip .big{flex:1; min-width:260px}
.strip .big b{font:700 18px var(--f-display); font-stretch:90%}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.seg button{border:0; background:var(--surface); padding:6px 11px; cursor:pointer; font-size:13.5px; border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.cutbar{position:relative; display:flex; height:14px; border-radius:7px; overflow:hidden; background:var(--sunk)}
.cutbar i{display:block; height:100%}
.cutbar i.out{opacity:.25}
.cutmark{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink)}
.risknote{font-size:14.5px; flex:1; min-width:260px}
.risknote.bad{color:var(--bad)} .risknote.ok{color:var(--ok)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
.legend span{display:inline-flex; gap:6px; align-items:center; font-variant-numeric:tabular-nums}
.layoutbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:22px 0 14px}
.layoutbar h2{font-size:24px; margin-right:auto}
.why{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:16px; font-size:14px}
.why ul{list-style:none; margin:8px 0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:4px 18px}
.why li{display:flex; justify-content:space-between; gap:10px; border-bottom:1px dotted var(--line); padding:2px 0}
.why .hit{color:var(--accent); font-weight:700} .why .miss{color:var(--faint)}
.sect{margin-top:26px}
.sect > h3{font-size:19px; margin-bottom:8px}
.sub{color:var(--muted); margin:0 0 10px; max-width:75ch}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
.blks{display:grid; gap:6px}
.blk{display:grid; grid-template-columns:12px minmax(0,1fr) auto; gap:4px 10px; align-items:center; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer; width:100%}
.blk:hover{border-color:var(--faint)}
.blk .p{font:12.5px var(--f-mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.blk .n{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.blk .w{grid-column:2 / 4; font-size:13px; color:var(--muted)}
.blk .mk{font-size:12px; font-weight:700}
.blk.m-read{border-color:color-mix(in srgb, var(--ok) 45%, var(--line))} .blk.m-read .mk{color:var(--ok)}
.blk.m-flag{border-color:var(--deep)} .blk.m-flag .mk{color:var(--deep)}
.stackgrid{display:grid; grid-template-columns:300px minmax(0,1fr); gap:22px; align-items:start}
.rail{display:flex; flex-direction:column-reverse; gap:6px; position:sticky; top:96px}
.rail .base{font:12px var(--f-mono); color:var(--faint); padding:4px 10px}
.rl{display:grid; grid-template-columns:22px minmax(0,1fr); gap:8px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 10px; cursor:pointer}
.rl[aria-current="true"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.rl .o{font:700 12px var(--f-mono); color:var(--faint); padding-top:2px}
.rl .t{font-size:13.5px; line-height:1.3; display:block}
.rl .m{display:flex; gap:6px; align-items:center; margin-top:5px; flex-wrap:wrap}
.rl .cov{font:600 11px var(--f-mono); color:var(--muted)}
.prhead h2{font-size:24px; margin:4px 0 6px}
.meta{display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:13.5px; color:var(--muted); margin-bottom:8px}
.two{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:18px}
.seam{display:flex; justify-content:space-between; gap:8px; font-size:13px; padding:5px 0; border-bottom:1px dashed var(--line)}
.seam .p{font-family:var(--f-mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.seam button{border:1px solid var(--line); background:none; border-radius:999px; padding:1px 7px; font-size:12px; cursor:pointer}
.cols{display:grid; grid-template-columns:repeat(var(--n), minmax(0,1fr)); gap:16px}
.col{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px}
.col .role{font:600 11px var(--f-mono); letter-spacing:.09em; text-transform:uppercase; color:var(--accent)}
.col h3{font-size:20px; margin:4px 0 10px}
.col .pr{border-top:1px solid var(--line); padding-top:12px; margin-top:12px}
.col h4{font-size:16px; margin-bottom:6px}
.layer{font-size:14px; margin:6px 0} .layer p{margin:2px 0 0; color:var(--muted)}
.fix{display:grid; gap:0}
.step{display:grid; grid-template-columns:120px minmax(0,1fr); gap:18px; padding:20px 0; border-top:1px solid var(--line)}
.step > .k{font:700 13px var(--f-display); letter-spacing:.08em; text-transform:uppercase; color:var(--accent); padding-top:4px}
.step h3{font-size:21px; margin-bottom:6px}
.step p{margin:0 0 8px; max-width:75ch}
.inline{margin:12px 0}
.inline .cap{display:flex; justify-content:space-between; gap:10px; font:12px var(--f-mono); color:var(--muted); margin-bottom:5px; flex-wrap:wrap}
details.rest{margin-top:22px; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
details.rest summary{padding:12px 16px; cursor:pointer; font-weight:700}
details.rest > div{padding:0 16px 16px}
.tree{list-style:none; margin:0; padding:0; font:12.5px var(--f-mono)}
.tree li{display:grid; grid-template-columns:minmax(0,1fr) 90px 50px; gap:10px; align-items:center; padding:2px 0}
.tree li .p{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tree li.dir{display:block; color:var(--faint); margin-top:6px}
.tree .c{text-align:right; color:var(--muted)}
.scope{border-collapse:collapse; font-size:14px; width:100%}
.scope th,.scope td{border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top}
.scope th{font:600 12px var(--f-mono); color:var(--muted)}
.st{font:600 11px var(--f-mono); padding:2px 6px; border-radius:4px; background:var(--sunk)}
.st.done{background:color-mix(in srgb, var(--ok) 18%, transparent); color:var(--ok)}
.st.partial{background:color-mix(in srgb, var(--review) 25%, transparent); color:var(--warn)}
.st.missing{background:color-mix(in srgb, var(--bad) 16%, transparent); color:var(--bad)}
.tw{overflow-x:auto}
.route-list{display:grid; gap:4px; margin-top:6px}
.rstop{display:grid; grid-template-columns:54px 12px minmax(0,1fr) 64px 70px; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:7px 12px; cursor:pointer; text-align:left; width:100%; font-size:14px}
.rstop .tm{font:600 12px var(--f-mono); color:var(--faint)}
.rstop .p{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rstop .mn{font:12px var(--f-mono); color:var(--muted); text-align:right}
.rstop .mk{font-size:12px; font-weight:700; text-align:right}
.rstop.m-read .mk{color:var(--ok)} .rstop.m-flag .mk{color:var(--deep)}

<script>
(() => {
const { esc, md, cases, short, repoShort, base, TIERS, TIER_NAME, codeHtml, store } = KIT;
const C = cases[KIT.caseIds[0]];

const isOpen = (f) => !f.status || f.status === "open";
const prBy = (k) => C.prs.find((p) => p.key === k);

/* ---------- shared data views ---------- */

}
const ORDER = stackOrder();
function findingsOn(p, b) {

}
function codeForRange(p, path, from, to, beatId) {

}

}
const fileSum = (f) => ({ ...f.tiers });
function findingChip(p) {

}

}

  return `<div class="fnd ${esc(f.severity)}"><b>${esc(f.severity)} · ${md(f.title)}</b><p>${f.path ? `<code>${esc(base(f.path))}:${f.line ?? ""}</code> ` : ""}${md(body.slice(0, n))}${body.length > n ? "…" : ""}${KIT.localTag(f)}${f.stance ? ` <span class="chip">agent: ${esc(f.stance)}</span>` : ""}</p></div>`;
}
const totals = KIT.totals(C);

const allBlocks = C.prs.flatMap((p) => p.attention.blocks.map((b) => ({ p, b })));

const hasDeep = deepAll.length > 0;
function focusBlocks(p, n) {
  const pick = (t) => p.attention.blocks.filter((b) => b.tier === t && p.code[b.id]).sort((a, b) => (b.score || 0) - (a.score || 0));

}
const markOf = (p, b) => S.marks[mkey(p, b)] || null;

}

/* ---------- classifier (from v3.4) ---------- */
const UI_RE = /\.(tsx?|jsx?|css|scss|html|vue|svelte)$/;
const RECIPES = {
  stack: { name: "Stack", line: "Many PRs in one repo. Read the stack bottom-up, one PR at a time, and watch the seams where PRs touch the same files." },
  contract: { name: "Contract", line: "PRs across repos. Each repo is one side of a contract; the journey runs across them." },
  fix: { name: "Fix", line: "One focused change. Problem, the code that decides it, the tests that prove it, the risk; the rest stays folded." },

  C.prs.forEach((p) => p.files.forEach((f) => { const n = f.add + f.del; if (UI_RE.test(f.path)) ui += n; if (f.role === "test") tests += n; if (f.role === "migration") mig++; }));
  return { prs: C.prs.length, repos: repos.length, repoNames: repos, total, uiShare: total ? ui / total : 0, testShare: total ? tests / total : 0, migrations: mig,
    media: (C.media || []).length, highs: openAll.filter(isHigh).length, deep: totals.deep || 0, journey: C.story.some((b) => b.kind === "journey") };

const RULES = [
  { id: "contract", test: (s) => s.repos > 1, text: (s) => `${s.repos} repos (needs 2 or more)` },
  { id: "stack", test: (s) => s.prs >= 4, text: (s) => `${s.prs} PRs in one repo (needs 4 or more)` },

  { id: "fix", test: () => true, text: () => "otherwise" },

const SIG = signals();
const AUTO = RULES.find((r) => r.test(SIG)).id;
const recipe = () => S.recipe || AUTO;

/* ---------- time box (from v3.7) ---------- */
const sevW = { critical: 400, high: 300, medium: 150, low: 40 };
function buildStops() {
  const out = [];
  C.prs.forEach((p) => {
    const open = p.findings.filter(isOpen), placed = new Set();
    const mustIdx = new Map((p.attention.must_read || []).map((id, i) => [id, i]));

      if (b.tier !== "deep" && b.tier !== "review") return;
      const fs = open.filter((f) => f.path === b.path && f.line != null && f.line >= b.from && f.line <= b.to);

      out.push({ id: mkey(p, b), kind: "block", p, b, tier: b.tier, min: Math.max(0.5, b.lines / RATE[b.tier]), pri, findings: fs });
    });

    const loose = open.filter((f) => !placed.has(f.id));
    if (sk || loose.length) out.push({ id: p.key + "|skim", kind: "skim", p, tier: "skim", min: Math.max(0.5, sk / RATE.skim + loose.length * 0.5), pri: 60 + loose.reduce((a, f) => a + (sevW[f.severity] || 20) / 10, 0), findings: loose, lines: sk });

const STOPS = buildStops();
const fullMin = STOPS.reduce((a, s) => a + s.min, 0);
function cut(budget) {
  const fits = [], out = []; let used = 0;

}

/* ---------- route bar ---------- */
const STAGES = [["brief", "Brief"], ["read", "Read"], ["decide", "Decide"]];
function coverage() {
  const r = readable.filter(({ p, b }) => markOf(p, b));

}

/* =========================================================== BRIEF */
function pickMoments() {

    add({ p, title: bt.title, lede: bt.lede, path: bt.path, from: bt.from, to: bt.to, block: codeForRange(p, bt.path, bt.from, bt.to, bt.id), notes: bt.notes || [], hl: (bt.notes || []).map((n) => n.line) }); });

const NOTICE = C.story.find((b) => b.kind === "notice");

    ["Brief", [["← →", "previous / next screen"], ["Space", "play or stop the narrated walk"]]],
    ["Read", [["j k", "next / previous stop (in the code panel)"], ["r", "mark the block read"], ["f", "flag it"], ["n", "write a note"]]],
    ["Decide", [["j k", "next / previous card"], ["a q b d", "approve, ask, block, defer"], ["1–4", "pick an option on a decision"], ["u", "undo"], ["v", "review draft"]]]];
  return `<div role="dialog" aria-label="Keyboard shortcuts"><h3>Keyboard</h3><table>${rows.map(([h, rs]) => `<tr><th colspan="2">${h}</th></tr>${rs.map(([k, t]) => `<tr><td>${k.split(" ").map((x) => `<kbd>${esc(x)}</kbd>`).join(" ")}</td><td>${esc(t)}</td></tr>`).join("")}`).join("")}</table><p class="muted" style="font-size:14px">Marks, notes and decisions stay in this browser only. Nothing is sent anywhere.</p><button class="primary" id="help-close">Close</button></div>`;
}
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button,[data-mod]"); if (!t) return;
  const d = t.dataset;
  if (d.stage) return goStage(d.stage);
  if (t.id === "help-btn") { $("#help").innerHTML = helpHtml(); $("#help").hidden = false; $("#help-close").focus(); return; }
  if (t.id === "help-close") { $("#help").hidden = true; return; }
  if (d.bi) { S.bi = +d.bi; save(); return render(); }
  if (d.bstep) { S.bi = Math.max(0, Math.min(SCREENS.length - 1, S.bi + +d.bstep)); save(); return render(); }
  if (t.id === "play") return playing ? stopPlay() : startPlay();
  if (d.gotoScreen) { const i = SCREENS.findIndex((s) => s.id === d.gotoScreen); if (i >= 0) { S.bi = i; save(); render(); } return; }
  if (d.gotoPr) { S.sel = d.gotoPr; if (S.stage !== "read") { S.stage = "read"; } save(); closeDrawer(); render(); window.scrollTo({ top: 0 }); return; }
  if (d.shot) { S.shot = +d.shot; save(); return render(); }
  if (d.pick) { S.picks[d.pick] = S.picks[d.pick] === +d.oi ? null : +d.oi; save(); return render(); }
  if (d.budget !== undefined && t.closest(".seg")) { S.budget = +d.budget; save(); return render(); }
  if (d.recipe) { S.recipe = d.recipe === AUTO ? null : d.recipe; save(); return render(); }
  if (t.id === "why-btn") { S.why = !S.why; save(); return render(); }
  if (t.id === "route-btn") { S.route = !S.route; save(); return render(); }
  if (t.id === "map-btn") { S.map = !S.map; save(); return render(); }
  if (d.mod !== undefined) return openModule(+d.mod);
  if (d.sel) { S.sel = d.sel; save(); render(); window.scrollTo({ top: 0 }); return; }
  if (d.blk) return openBlock(d.pr, d.blk);
  if (d.mark) { const p = prBy(d.pr), b = p.attention.blocks.find((x) => x.id === d.blkM); setMark(p, b, d.mark); QCACHE = null; renderRoute(); if (drawerCtx) openBlock(p.key, b.id); if (S.stage === "read") { const y = window.scrollY; renderRead(); window.scrollTo({ top: y }); } return; }
  if (d.dnav) { saveNote(); const list = stopList(), i = list.findIndex((s) => drawerCtx && s.p === drawerCtx.p && s.b === drawerCtx.b), n = list[i + +d.dnav]; if (n) openBlock(n.p.key, n.b.id); return; }
  if (t.id === "dr-close") { saveNote(); closeDrawer(); if (S.stage === "read") { const y = window.scrollY; renderRead(); window.scrollTo({ top: y }); } return; }
  if (d.qi) { S.cur = +d.qi; reviewView = false; save(); return render(); }
  if (d.a) return act(d.a);
  if (d.opt) return act("o", +d.opt);
  if (d.qstep) { S.cur = Math.max(0, Math.min(queue().length - 1, S.cur + +d.qstep)); save(); return render(); }
  if (t.id === "undo") return undo();
  if (t.id === "to-review") { reviewView = true; return render(); }
  if (t.id === "back-queue") { reviewView = false; return render(); }
  if (t.id === "send-notes") { sendNotes(); return; }
  if (t.id === "copy-md") { const txt = reviewMd(); try { await navigator.clipboard.writeText(txt); toast("Copied. Paste it into the PR."); } catch (_) { const ta = $("#mdout"); ta.hidden = false; ta.focus(); ta.select(); toast("Select-all is ready: press Cmd/Ctrl+C"); } return; }
});
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const inField = /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
  if (e.key === "Escape") { if (!$("#help").hidden) { $("#help").hidden = true; return; } if (!$("#drawer").hidden) { saveNote(); closeDrawer(); if (S.stage === "read") renderRead(); return; } if (inField) document.activeElement.blur(); return; }
  if (inField) return;
  const k = e.key;
  if (k === "?") { $("#help").innerHTML = helpHtml(); $("#help").hidden = false; return; }
  if (k === "]" || k === "[") { const i = STAGES.findIndex(([s]) => s === S.stage) + (k === "]" ? 1 : -1); if (STAGES[i]) goStage(STAGES[i][0]); return; }
  if (!$("#drawer").hidden && drawerCtx) {
    if (k === "r" || k === "f") { setMark(drawerCtx.p, drawerCtx.b, k === "r" ? "read" : "flag"); QCACHE = null; renderRoute(); openBlock(drawerCtx.p.key, drawerCtx.b.id); e.preventDefault(); return; }
    if (k === "n") { $("#mnote").focus(); e.preventDefault(); return; }
    if (k === "j" || k === "k") { saveNote(); const list = stopList(), i = list.findIndex((s) => s.p === drawerCtx.p && s.b === drawerCtx.b), n = list[i + (k === "j" ? 1 : -1)]; if (n) openBlock(n.p.key, n.b.id); return; }
    return;
  }
  if (S.stage === "brief") {
    if (k === "ArrowRight" || k === "j") { if (S.bi < SCREENS.length - 1) { S.bi++; save(); render(); } }
    else if (k === "ArrowLeft" || k === "k") { if (S.bi > 0) { S.bi--; save(); render(); } }
    else if (k === " ") { e.preventDefault(); playing ? stopPlay() : startPlay(); }
    return;
  }
  if (S.stage === "decide" && !reviewView) {
    if (k === "j" || k === "k") { S.cur = Math.max(0, Math.min(queue().length - 1, S.cur + (k === "j" ? 1 : -1))); save(); render(); }
    else if ("aqbd".includes(k) && k.length === 1) act(k);
    else if (/^[1-4]$/.test(k)) { const q = curCard(); if (q.kind === "decision" && q.options[+k - 1]) act("o", +k - 1); }
    else if (k === "u") undo();
    else if (k === "v") { reviewView = true; render(); }
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.closest && e.target.closest("[data-mod]")) openModule(+e.target.closest("[data-mod]").dataset.mod); });
{ const h = (location.hash || "").slice(1); if (h === "brief" || h === "read" || h === "decide") S.stage = h; if (h === "review") { S.stage = "decide"; reviewView = true; } if (h === "map") { S.stage = "read"; S.map = true; } { const si = SCREENS.findIndex((x) => x.id === h); if (si >= 0) { S.stage = "brief"; S.bi = si; } } if (h === "route") { S.stage = "read"; S.route = true; } }
window.addEventListener("error", (ev) => { const m = document.createElement("pre"); m.id = "jserr"; m.textContent = "JS error: " + ev.message; m.style.cssText = "position:fixed;bottom:0;left:0;background:#a00;color:#fff;z-index:99;padding:6px"; document.body.appendChild(m); });
render();
$("#cknav").innerHTML = KIT.navHtml(); KIT.liveBanner(document.querySelector(".bar")); KIT.freshBar(document.querySelector(".bar"), C);
setTimeout(() => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"; s.onload = () => KIT.mermaid(document); document.head.appendChild(s); }, 60);
document.addEventListener("click", (e) => { const t = e.target.closest("[data-lens-btn]"); if (!t) return; const box = t.closest("[data-lens]"); box.querySelectorAll("[data-lens-btn]").forEach((b) => b.setAttribute("aria-pressed", b === t)); box.querySelectorAll("[data-lens-pane]").forEach((p) => (p.hidden = p.dataset.lensPane !== t.dataset.lensBtn)); box.querySelectorAll(`[data-lens-pane="${t.dataset.lensBtn}"] [data-mlazy]`).forEach((el) => { el.dataset.mermaid = el.dataset.mlazy; el.removeAttribute("data-mlazy"); }); KIT.mermaid(box); });
})();
