<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Decision Review: what the coding agent decided, against the plan it was given. The decisions nobody planned come
   first, each with its code and three answers (accept, ask why, fix it); then what changed from the plan, what's
   missing, the rollout step by step, and the plan itself so the reader can check the source. */

:root{
  --bg:#f6f7f8; --surface:#ffffff; --fg:#1c2329; --muted:#5b6670; --line:#dde2e6;
  --accent:#6b4fbb; --accent-soft:#eeeafb; --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#b23a3a; --bad-soft:#fbe6e6;
  --ok:#2a7a46; --ok-soft:#e3f2e8; --add:#2a7a46; --del:#b23a3a; --code-bg:#eef1f3; --add-bg:#e7f4ec; --del-bg:#fbeaea;
  /* the names kit.js styles its switcher and diagram explorer with */
  --ink:var(--fg); --sunk:var(--code-bg); --faint:#76818a; --hl:#fdf6d8; --shadow:0 1px 2px rgba(20,30,40,.06), 0 8px 24px rgba(20,30,40,.08);
  --f-display:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171b; --surface:#1a2126; --fg:#e3e8ec; --muted:#95a1ab; --line:#2b343b;
  --accent:#b4a2f2; --accent-soft:#2a2342; --warn:#e3a64a; --warn-soft:#3a2c14; --bad:#ec8a8a; --bad-soft:#3a1c1c;
  --ok:#6fc28c; --ok-soft:#17321f; --add:#6fc28c; --del:#ec8a8a; --code-bg:#20282e; --add-bg:#16291e; --del-bg:#2e1a1a;
  --faint:#7d8992; --hl:#33300f; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12171b; --surface:#1a2126; --fg:#e3e8ec; --muted:#95a1ab; --line:#2b343b;
  --accent:#b4a2f2; --accent-soft:#2a2342; --warn:#e3a64a; --warn-soft:#3a2c14; --bad:#ec8a8a; --bad-soft:#3a1c1c;
  --ok:#6fc28c; --ok-soft:#17321f; --add:#6fc28c; --del:#ec8a8a; --code-bg:#20282e; --add-bg:#16291e; --del-bg:#2e1a1a;
  --faint:#7d8992; --hl:#33300f; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--fg); font:15px/1.6 var(--f-body); margin:0; padding-inline:16px; padding-block:0 64px}
main{max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:40px; padding-top:32px}
h1,h2,h3{font-family:var(--f-display); font-weight:600; text-wrap:balance; margin:0}
h1{font-size:30px; line-height:1.2}
h2{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding-bottom:8px; border-bottom:1px solid var(--line)}
h3{font-size:19px; line-height:1.3}
p{margin:0; max-width:68ch}
code,.mono{font-family:var(--f-mono); font-size:.9em}
p code, li code, td code, .chip code, h3 code{background:var(--code-bg); padding:1px 5px; border-radius:4px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button,textarea,select{font:inherit; color:inherit}
section{display:flex; flex-direction:column; gap:16px; min-width:0}
.n{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* the session bar: which PR of the set, and the style switcher */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; margin-inline:-16px; padding:10px 16px; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.bar .in{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,820px) minmax(0,1fr); gap:10px 16px; align-items:center}
.bar .l{grid-column:2; display:flex; flex-direction:column; gap:6px; min-width:0}
.bar #cknav{grid-column:3; justify-self:end; align-self:start}
@media (max-width:1240px){ .bar .in{grid-template-columns:minmax(0,1fr) auto} .bar .l{grid-column:1} .bar #cknav{grid-column:2} }
.nb.ov{font-family:var(--f-body); font-weight:600}
.bar .t{min-width:0; font-size:13.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar .t b{color:var(--fg); font-weight:600}
.nav{display:flex; gap:6px; align-items:center; min-width:0}
/* one row: the arrows stay put, the chips between them scroll sideways when they don't fit */
.nav .chips{display:flex; gap:6px; min-width:0; overflow-x:auto; scrollbar-width:none; overscroll-behavior-x:contain; scroll-padding-inline:24px; -webkit-mask:linear-gradient(90deg, transparent, #000 12px, #000 calc(100% - 12px), transparent); mask:linear-gradient(90deg, transparent, #000 12px, #000 calc(100% - 12px), transparent); padding-inline:8px}
.nav .chips::-webkit-scrollbar{display:none}
.nav .nb{flex:none}
.nb{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:3px 10px; font:500 13px/1.5 var(--f-mono); cursor:pointer; white-space:nowrap}
.nb:hover{border-color:var(--accent)}
.nb[aria-current="true"]{background:var(--accent); border-color:var(--accent); color:var(--surface)}
.nb:disabled{opacity:.4; cursor:default}

.head{display:flex; flex-direction:column; gap:12px}
.crumb{font-family:var(--f-mono); font-size:13px; color:var(--muted); overflow-wrap:anywhere}
.meta{display:flex; flex-wrap:wrap; gap:8px; font-size:13px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:var(--surface); white-space:nowrap; font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-soft); border-color:transparent; color:var(--ok)}
.pill.warn{background:var(--warn-soft); border-color:transparent; color:var(--warn)}
.pill.bad{background:var(--bad-soft); border-color:transparent; color:var(--bad)}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor}
.add{color:var(--add)} .del{color:var(--del)}
.lede{font-size:17px; color:var(--muted)}


.tw{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{text-align:left; padding:9px 12px; vertical-align:top; border-top:1px solid var(--line)}
thead th{border-top:0; font:500 12px/1.4 var(--f-body); letter-spacing:.04em; color:var(--muted)}
.counts{display:flex; flex-wrap:wrap; gap:8px}
.dlist{display:flex; flex-direction:column; gap:12px}
.dec{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; min-width:0}
.dec.unplanned{border-left-color:var(--bad)} .dec.changed{border-left-color:var(--warn)} .dec.missing{border-left-color:var(--warn)} .dec.planned{border-left-color:var(--ok)}
.dec.called{opacity:.72} .dec.called:hover{opacity:1}
.dec .top{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:baseline}
.dec .st{font:600 11px/1.4 var(--f-body); letter-spacing:.06em; text-transform:uppercase}
.dec.unplanned .st{color:var(--bad)} .dec.changed .st,.dec.missing .st{color:var(--warn)} .dec.planned .st{color:var(--ok)}
.dec .text{font-weight:600; font-size:15.5px}
.dec .plan{font-size:14px; border-left:2px solid var(--line); padding-left:10px; color:var(--muted)}
.dec .plan i{font-style:normal; font-weight:600; color:var(--fg)}
.dec .why{font-size:14px}
.dec .hu{font-size:13.5px; background:var(--warn-soft); border-radius:6px; padding:6px 10px} .dec .hu b{color:var(--warn); font-weight:600}
.dec .ntc{font-size:13.5px; color:var(--muted)} .dec .ntc.silent{color:var(--bad)}
.eff{font:500 11.5px/1.5 var(--f-mono); padding:1px 8px; border-radius:999px; background:var(--bad-soft); color:var(--bad)}
.src{font:12px var(--f-mono); color:var(--muted)}
.dec details > summary{cursor:pointer; color:var(--accent); font-size:13.5px}
.dec details[open] > summary{margin-bottom:8px}
.dec details .where{display:block; margin:6px 0 4px}
.calls{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.call{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:5px 12px; cursor:pointer; font-size:13.5px; font-weight:500}
.call:hover{border-color:var(--accent)}
.call.accept[aria-pressed="true"]{background:var(--ok-soft); border-color:transparent; color:var(--ok)}
.call.ask[aria-pressed="true"]{background:var(--warn-soft); border-color:transparent; color:var(--warn)}
.call.fix[aria-pressed="true"]{background:var(--bad-soft); border-color:transparent; color:var(--bad)}
.calls .legend{margin-left:auto}
details.rest > summary{cursor:pointer; color:var(--accent); font-size:14px}
details.rest[open] > summary{margin-bottom:12px}
.empty{background:var(--surface); border:1px dashed var(--line); border-radius:10px; padding:18px; color:var(--muted); font-size:14.5px}

.steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; counter-reset:st}
.steps li{display:grid; grid-template-columns:28px minmax(0,1fr); gap:4px 12px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
.steps .no{font:600 13px/24px var(--f-mono); color:var(--accent)}
.steps .s{font-weight:600}
.steps .w{font-size:14px; color:var(--muted)}
.steps label{display:flex; gap:8px; align-items:baseline; font-size:14px; grid-column:2; cursor:pointer}
.steps label input{accent-color:var(--ok)}
.steps li.done{border-color:color-mix(in srgb, var(--ok) 40%, var(--line))}
.door{font-weight:600} .door.one{color:var(--bad)} .door.two{color:var(--ok)}

.plandoc{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 18px; font-size:14px; display:flex; flex-direction:column; gap:6px; max-height:520px; overflow:auto}
.plandoc h4{font:600 13px/1.4 var(--f-body); letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:8px 0 0}
.plandoc ul{margin:0; padding-left:20px}
.plandoc p{max-width:none}
.code{font:12.5px/1.6 var(--f-mono); background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow-x:auto; padding:6px 0}
.cl{display:flex; white-space:pre}
.cl .ln{width:52px; flex:none; text-align:right; padding-right:12px; color:var(--faint); user-select:none}
.cl .sg{width:16px; flex:none; color:var(--faint)}
.cl .tx{padding-right:14px}
.cl.add{background:var(--add-bg)} .cl.add .sg{color:var(--add)}
.cl.del{background:var(--del-bg)} .cl.del .sg{color:var(--del)}
.cl.hl .tx{background:var(--hl)}
.cl.cut .tx{color:var(--faint); font-style:italic}
.where{font:12.5px var(--f-mono); color:var(--muted); overflow-wrap:anywhere}
textarea{width:100%; min-height:84px; resize:vertical; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.row{display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 14px; cursor:pointer; font-weight:500; font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:var(--surface)}
.mynotes{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.mynotes li{display:flex; justify-content:space-between; gap:12px; align-items:flex-start; font-size:14px; border-left:3px solid var(--accent); padding:2px 0 2px 12px}
.mynotes li.blocking{border-left-color:var(--bad)} .mynotes li.question{border-left-color:var(--warn)}
.mynotes button{border:0; background:none; color:var(--muted); cursor:pointer; font-size:13px; padding:0}
#toast{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); z-index:50; background:var(--fg); color:var(--bg); padding:8px 16px; border-radius:999px; font-size:14px}
@media (max-width:600px){ h1{font-size:25px} .bar .in{grid-template-columns:minmax(0,1fr)} .bar #cknav{grid-column:1; grid-row:1} .bar .l{grid-column:1; grid-row:2} }
</style>

<div class="bar"><div class="in"><div class="l"><span class="t" id="sess"></span><span class="nav" id="nav"></span></div><span id="cknav"></span></div></div>
<main id="main"></main>
<div id="toast" hidden role="status"></div>

{{DATA}}
<script>
{{KIT}}
</script>
<script>
(() => {
const { esc, md, cases, caseIds, base, codeHtml, store } = KIT;
const C = cases[caseIds[0]];
const $ = (s) => document.querySelector(s);
const SKEY = "decisions:" + C.session;
const S = Object.assign({ pr: null, calls: {}, done: {}, notes: [] }, store.get(SKEY, {}));
const save = () => store.set(SKEY, S);
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); };
const strip = (t) => String(t || "").replace(/^(feat|fix|chore|refactor|docs|test)(\([^)]*\))?!?:\s*/i, "");
const multiRepo = new Set(C.prs.map((p) => p.repo)).size > 1;
const shortPr = (k) => (multiRepo ? k.split("/")[1].replace("#", " #") : "#" + k.split("#")[1]);
const P = Object.fromEntries(C.prs.map((p) => [p.key, p]));
const pl = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const slug = (p) => "pr-" + p.number + (multiRepo ? "-" + p.repo.replace(/[^\w-]/g, "-") : "");
const ORDER = C.prs;
const ALL = ORDER.flatMap((p) => (p.decisions || []).map((d) => ({ ...d, pr: p.key, uid: p.key + "|" + d.id })));
const NOTICES = (C.notices || []).map((n) => ({ ...n, uid: "notice|" + n.id }));
const noticesOf = (d) => NOTICES.filter((n) => n.pr === d.pr && n.decision === d.id);
// what the reader sees: the skill's check against the code, unless the reviewer answered (an Accept closes it)
const nstate = (n) => n.state === "open" && S.calls[n.uid] === "accept" ? "accepted" : n.state;
const inScope = (n, keys) => !n.pr || keys.has(n.pr);
const NKIND = { pattern: "Departs from a pattern", duplicate: "Possible duplicate", plan: "Off the plan", risk: "Risk", other: "Heads-up" };
const NRESP = { none: "not answered", learn_more: "asked to learn more", knew: "“knew this already”", dismissed: "dismissed" };
const NSTATE = { open: ["Still open", "warn"], accepted: ["Accepted", "ok"], fixed: ["Fixed", "ok"], stale: ["No longer applies", "muted"] };

/* what each status means, in the reader's words; the order the page reads them in */
const ST = {
  unplanned: ["Decided on its own", "In the code, not in the plan: the choices nobody asked for. Accept each, ask why, or ask for a fix."],
  changed: ["Done differently", "The plan asked for something; the code does it another way."],
  missing: ["Planned, not in the code", "The plan asked for it and this code doesn't do it (yet)."],
  planned: ["As planned", "The code does what the plan said."] };
const SRC = { notes: "Qodo PR notes", track: "Qodo track notes", session: "the coding session", ticket: "the ticket", spec: "the spec", pr: "the PR description", inferred: "inferred from the code" };
const CALLS = { accept: ["Accept", null, "Accepted as decided"], ask: ["Ask why", "question", "Why this? The plan didn't ask for it"], fix: ["Fix it", "blocking", "Please change this"] };

const evWhere = (e) => `${e.path}:${e.from}${e.to !== e.from ? "–" + e.to : ""}${e.side === "old" ? " (before)" : ""}`;
function decHtml(d, opts = {}) {
  const call = S.calls[d.uid], sil = (d.effects || []).length;
  const code = (d.ev || []).length ? `<details${opts.open ? " open" : ""}><summary>The code · ${esc((d.ev || []).map(evWhere).map(base).join(", "))}</summary>${d.ev.map((e) => `<span class="where">${esc(evWhere(e))}</span>${e.lines ? codeHtml({ lines: e.lines, cut: e.cut }) : ""}`).join("")}</details>` : "";
  const ask = d.status === "planned" ? "" : `<div class="calls">${Object.entries(CALLS).map(([k, [t]]) => `<button class="call ${k}" data-call="${esc(d.uid)}|${k}" aria-pressed="${call === k}">${t}</button>`).join("")}${call ? `<span class="legend">${KIT.served ? "a note on the review" : "kept in this browser"}</span>` : ""}</div>`;
  return `<article class="dec ${esc(d.status)}${call ? " called" : ""}" id="d-${esc(d.uid.replace(/[^\w-]/g, "-"))}">
    <div class="top"><span class="st">${esc(ST[d.status][0])}</span>${opts.pr !== false ? `<button class="nb" data-go="${ORDER.indexOf(P[d.pr])}">${esc(shortPr(d.pr))}</button>` : ""}${(d.effects || []).map((x) => `<span class="eff" title="A change that won't fail, only behave differently">silent · ${esc(x)}</span>`).join("")}<span class="src">plan: ${esc(SRC[d.source] || d.source)}</span></div>
    <span class="text">${md(d.text)}</span>
    ${d.plan ? `<p class="plan"><i>The plan:</i> ${md(d.plan)}</p>` : d.status === "unplanned" ? `<p class="plan"><i>The plan:</i> says nothing about this.</p>` : ""}
    ${d.pattern ? `<p class="plan"><i>Departs from:</i> ${md(d.pattern)}</p>` : ""}
    ${d.why ? `<p class="why">${md(d.why)}</p>` : ""}
    ${noticesOf(d).map((n) => `<p class="hu"><b>⚑ Heads-up during coding</b> <span class="src">${esc(n.source)}</span>: ${md(n.text)} <span class="muted">· the author ${esc(NRESP[n.response])}</span></p>`).join("")}
    ${d.notice ? `<p class="ntc${sil && /^nothing/i.test(d.notice) ? " silent" : ""}"><b>We'd notice:</b> ${md(d.notice)}</p>` : ""}
    ${code}${ask}</article>`;
}
/* heads-ups raised while coding: answering one ("knew this already") is not accepting it, so each says what holds now */
function noticesHtml(ps) {
  const keys = new Set(ps.map((p) => p.key)), ns = NOTICES.filter((n) => ps.length > 1 || !n.pr || keys.has(n.pr));
  if (!ns.length) return "";
  const order = ["open", "accepted", "fixed", "stale"], sorted = ns.slice().sort((a, b) => order.indexOf(nstate(a)) - order.indexOf(nstate(b)));
  const open = ns.filter((n) => nstate(n) === "open").length;
  return `<section aria-label="Heads-ups from the coding session"><h2>Heads-ups from the coding session · ${ns.length}${open ? ` · ${open} still open` : ""}</h2>
    <p class="muted" style="font-size:14px">What the observer (Claude Code's “you should know”) or a teammate raised while the code was written, checked again against the code as it is. Seeing one isn't accepting it: it stays open until it is accepted, fixed, or no longer applies.</p>
    <div class="dlist">${sorted.map((n) => { const ns2 = nstate(n), [st, tone] = NSTATE[ns2], call = S.calls[n.uid], d = n.decision && ALL.find((x) => x.pr === n.pr && x.id === n.decision);
      const viaDecision = d && d.status !== "planned";   // a planned decision has no answers of its own
      return `<article class="dec ${ns2 === "open" ? "changed" : "planned"}${call ? " called" : ""}"><div class="top"><span class="st">${esc(NKIND[n.kind] || "Heads-up")}</span>${n.pr ? `<button class="nb" data-go="${ORDER.indexOf(P[n.pr])}">${esc(shortPr(n.pr))}</button>` : ""}<span class="pill ${tone}" style="padding:0 8px;font-size:12px">${esc(st)}</span><span class="src">${esc(n.source)} · the author ${esc(NRESP[n.response])}</span></div>
        <span class="text">${md(n.text)}</span>${n.why ? `<p class="why">${md(n.why)}</p>` : ""}${n.related ? `<p class="plan"><i>Related:</i> ${md(n.related)}</p>` : ""}
        ${d ? `<p class="plan"><i>${viaDecision ? "Answered with the decision" : "About the decision"}:</i> <a href="#d-${esc(d.uid.replace(/[^\w-]/g, "-"))}">${md(d.text)}</a></p>` : ""}
        ${!viaDecision && (n.state === "open") ? `<div class="calls">${Object.entries(CALLS).map(([k, [t]]) => `<button class="call ${k}" data-call="${esc(n.uid)}|${k}" aria-pressed="${call === k}">${t}</button>`).join("")}${n.pr ? "" : `<span class="legend">names no PR: the answer stays in this page</span>`}</div>` : ""}</article>`; }).join("")}</div></section>`;
}
/* the duplicate the observer warns about ("a teammate opened a PR for this same fix"): open work on the same code */
function elsewhereHtml(ps) {
  const keys = new Set(ps.map((p) => p.key)), rank = { lines: 0, function: 1 };
  const config = /\.(ya?ml|json|toml|ini|lock|md|txt)$|(^|\/)\.github\//i;   // CI and config overlap is common and rarely the same fix
  const hs = (C.other_work || []).filter((h) => keys.has(h.for) && h.source === "open_pr" && h.closeness in rank && !config.test(h.path || ""))
    .sort((a, b) => rank[a.closeness] - rank[b.closeness]).filter((h, i, a) => a.findIndex((x) => x.key === h.key) === i).slice(0, 6);
  if (!hs.length) return "";
  return `<section aria-label="Open work on the same code"><h2>Open work on the same code · ${hs.length}</h2><p class="muted" style="font-size:14px">Other open PRs that change the same lines or functions. Is any of them the same fix, or one these PRs should wait for?</p>
    <div class="tw"><table><thead><tr><th>PR</th><th>By</th><th>Touches</th><th>Here</th></tr></thead><tbody>${hs.map((h) => `<tr><td>${h.url ? `<a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(strip(h.title || h.key))}</a>` : esc(strip(h.title || h.key))}</td><td class="muted">${esc(h.author ? "@" + h.author : "")}</td><td><span class="src">${esc(h.closeness === "lines" ? "the same lines" : "the same function")}</span> <span class="where">${esc(base(h.path || ""))}</span></td><td><button class="nb" data-go="${ORDER.indexOf(P[h.for])}">${esc(shortPr(h.for))}</button></td></tr>`).join("")}</tbody></table></div></section>`;
}
function groups(list, opts = {}) {
  return ["unplanned", "changed", "missing"].map((st) => { const xs = list.filter((d) => d.status === st); if (!xs.length) return "";
    return `<section aria-label="${esc(ST[st][0])}"><h2>${esc(ST[st][0])} · ${xs.length}</h2><p class="muted" style="font-size:14px">${esc(ST[st][1])}</p><div class="dlist">${xs.map((d) => decHtml(d, opts)).join("")}</div></section>`; }).join("")
    + (() => { const xs = list.filter((d) => d.status === "planned"); return xs.length ? `<section aria-label="As planned"><details class="rest"><summary>${pl(xs.length, "decision")} as planned</summary><div class="dlist">${xs.map((d) => decHtml(d, opts)).join("")}</div></details></section>` : ""; })();
}
/* Qodo's own plan check: requirement-gap findings (from the ticket or the spec) are the "planned, missing" side too */
const gapsOf = (ps) => ps.flatMap((p) => p.findings.filter((f) => (!f.status || f.status === "open") && /requirement gap/i.test(f.qodo_type || "")).map((f) => ({ ...f, pr: p.key })));
const gapsHtml = (gs) => gs.length ? `<section aria-label="Qodo's requirement gaps"><h2>Qodo's requirement gaps · ${gs.length}</h2><p class="muted" style="font-size:14px">Qodo checked these PRs against their tickets and specs; it reports what the plan asked for and the code doesn't meet.</p><div class="dlist">${gs.map((f) => `<article class="dec missing"><div class="top"><span class="st">${esc(f.severity || "")} · Qodo</span><button class="nb" data-go="${ORDER.indexOf(P[f.pr])}">${esc(shortPr(f.pr))}</button></div><span class="text">${md(f.title)}</span><span class="where">${esc(f.path || "")}${f.line ? ":" + f.line : ""}</span>${f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener" style="font-size:13.5px">Open the finding ↗</a>` : ""}</article>`).join("")}</div></section>` : "";

/* the plan: Qodo's notes when the coding agent left them, else what the skill read */
function mdBlock(text) {   // the notes are Markdown: headings, bullets and paragraphs are enough to read them
  const out = [], lines = String(text || "").split("\n"); let ul = false;
  const close = () => { if (ul) { out.push("</ul>"); ul = false; } };
  lines.forEach((l) => { const h = l.match(/^#{1,6}\s+(.*)/), li = l.match(/^\s*[-*]\s+(.*)/);
    if (h) { close(); out.push(`<h4>${md(h[1])}</h4>`); } else if (li) { if (!ul) { out.push("<ul>"); ul = true; } out.push(`<li>${md(li[1])}</li>`); }
    else if (l.trim()) { close(); out.push(`<p>${md(l)}</p>`); } else close(); });
  close(); return out.join("");
}
const notesState = (p) => { const n = p.notes; if (!n) return ["muted", "not looked up"]; if (n.status === "ready") return ["ok", n.pr && n.pr.head_matches ? "Qodo notes, for this head" : "Qodo notes, for an earlier commit"];
  return ["muted", n.why || n.status]; };
function planHtml(ps) {
  const rows = ps.map((p) => { const [tone, what] = notesState(p); return `<tr><td><button class="nb" data-go="${ORDER.indexOf(p)}">${esc(shortPr(p.key))}</button></td><td><span class="${tone === "ok" ? "add" : "muted"}">${esc(what)}</span></td><td>${p.notes && p.notes.track ? esc(p.notes.track.title || "a track") : `<span class="muted">—</span>`}</td></tr>`; }).join("");
  const docs = ps.map((p) => { const n = p.notes || {}; return (n.pr && n.pr.markdown ? `<h3>${esc(shortPr(p.key))}: PR Review Notes</h3><div class="plandoc">${mdBlock(n.pr.markdown)}</div>` : "")
    + (n.track && n.track.markdown && !ps.slice(0, ps.indexOf(p)).some((q) => q.notes && q.notes.track && q.notes.track.id === n.track.id) ? `<h3>Track: ${esc(n.track.title || "")}</h3><div class="plandoc">${mdBlock(n.track.markdown)}</div>` : ""); }).join("");
  const srcs = (C.sources || []).filter((s) => ps.length > 1 || (s.prs || []).includes(ps[0].key));
  return `<section aria-label="The plan"><h2>The plan</h2><p class="muted" style="font-size:14px">Each decision says where its plan came from. Qodo's PR Review Notes and Development Track Notes come first: the coding agent writes them while it works. Without them the plan is the PR description, the tickets and the specs.</p>
    <div class="tw"><table><thead><tr><th>PR</th><th>Qodo notes</th><th>Track</th></tr></thead><tbody>${rows}</tbody></table></div>${docs}
    ${srcs.length ? `<p class="muted" style="font-size:14px">Also read: ${srcs.slice(0, 8).map((s) => /^https?:/.test(s.url || "") ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a>` : esc(s.title || "")).join(" · ")}</p>` : ""}</section>`;
}

/* the rollout one step at a time, each verified before the next: merge, release, test, move on */
function rolloutHtml(ps) {
  const keys = new Set(ps.map((p) => p.key)), steps = (C.deploy || []).filter((s) => ps.length > 1 || !(s.prs || []).length || s.prs.some((k) => keys.has(k)));
  const d = C.door, door = d ? `<p><span class="door ${d.verdict === "one-way" ? "one" : "two"}">${d.verdict === "one-way" ? "▲ One-way door." : "↺ Two-way door."}</span> ${md(d.why || "")}</p>` : "";
  if (!steps.length && !door) return "";
  const n = steps.filter((s) => S.done[(C.deploy || []).indexOf(s)]).length;
  return `<section aria-label="Rollout"><h2>Rollout${steps.length ? ` · ${n} of ${steps.length} verified` : ""}</h2>${door}${steps.length ? `<ol class="steps">${steps.map((s) => { const i = (C.deploy || []).indexOf(s); return `<li class="${S.done[i] ? "done" : ""}"><span class="no">${i + 1}</span><span><span class="s">${md(s.step)}</span>${(s.prs || []).length ? ` <span class="src">${esc(s.prs.map(shortPr).join(" "))}</span>` : ""}${s.why ? `<div class="w">${md(s.why)}</div>` : ""}</span><label><input type="checkbox" data-done="${i}"${S.done[i] ? " checked" : ""}> <span>${s.verify ? `<b>Verify:</b> ${md(s.verify)}` : "Done"}</span></label></li>`; }).join("")}</ol>` : ""}</section>`;
}

const COUNT = { unplanned: "decided on its own", changed: "done differently", missing: "planned, missing", planned: "as planned" };
const countPills = (list, keys) => `<div class="counts">${[["unplanned", "bad"], ["changed", "warn"], ["missing", "warn"], ["planned", "ok"]].map(([k, tone]) => { const n = list.filter((d) => d.status === k).length; return n ? `<span class="pill ${tone}"><span class="dot"></span>${n} ${COUNT[k]}</span>` : ""; }).join("")}${(() => { const open = list.filter((d) => d.status !== "planned"), left = open.filter((d) => !S.calls[d.uid]).length; return open.length ? `<span class="pill ${left ? "" : "ok"}">${left ? `${left} of ${open.length} still to answer` : "All answered"}</span>` : ""; })()}${(() => { const n = NOTICES.filter((x) => nstate(x) === "open" && inScope(x, keys)).length; return n ? `<span class="pill warn"><span class="dot"></span>${n} heads-up${n === 1 ? "" : "s"} still open</span>` : ""; })()}</div>`;
const empty = () => `<div class="empty">${md(KIT.host.missing || "The skill wrote no decisions for this review.")} The skill reads the plan (Qodo's notes, the tickets, the PR description) and the diff, and lists each decision the code makes against it.</div>`;
function overviewPage() {
  const silent = ALL.filter((d) => (d.effects || []).length && d.status !== "planned");
  let h = `<header class="head"><div class="crumb">${esc([...new Set(C.prs.map((p) => p.repo))].join(" · "))} · ${pl(C.prs.length, "PR")}</div><h1>${md(C.title)}</h1>
    ${ALL.length || NOTICES.length ? countPills(ALL, new Set(ORDER.map((p) => p.key))) : ""}<p class="lede">What the coding agent decided, against the plan it was given.${silent.length ? ` ${silent.length === 1 ? "One of them changes" : `${silent.length} of them change`} behavior without failing (${[...new Set(silent.flatMap((d) => d.effects))].join(", ")}): tests won't catch ${silent.length === 1 ? "it" : "them"}.` : ""}</p></header>`;
  h += ALL.length ? groups(ALL) : `<section>${empty()}</section>`;
  h += noticesHtml(ORDER) + gapsHtml(gapsOf(ORDER)) + elsewhereHtml(ORDER) + rolloutHtml(ORDER) + planHtml(ORDER) + reviewBox();
  return h;
}
function prPage(p) {
  const ds = ALL.filter((d) => d.pr === p.key);
  let h = `<header class="head"><div class="crumb">${esc(p.repo)} · ${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">#${esc(p.number)}</a>` : "#" + esc(p.number)}${p.base ? ` · into <code>${esc(p.base)}</code>` : ""}</div><h1>${md(strip(p.title))}</h1>
    ${ds.length || NOTICES.some((n) => inScope(n, new Set([p.key]))) ? countPills(ds, new Set([p.key])) : ""}${p.summary ? `<p class="lede">${md(p.summary)}</p>` : ""}</header>`;
  h += ds.length ? groups(ds, { pr: false }) : `<section>${empty()}</section>`;
  h += noticesHtml([p]) + gapsHtml(gapsOf([p])) + elsewhereHtml([p]) + rolloutHtml([p]) + planHtml([p]) + reviewBox();
  return h;
}
function reviewBox() {
  return `<section aria-label="Your answers"><h2>Your answers</h2><div class="row" style="justify-content:flex-start"><button class="btn pri" data-copy>Copy the answers as Markdown</button>${KIT.served ? KIT.publishHtml(ORDER.map((p) => p.key)) : ""}</div><pre id="mdout" hidden></pre>
    <span class="legend">${KIT.served ? `Each answer is also a note in your <a href="${esc(KIT.host.cockpit)}">Agent Session Review</a>, on the decision's first line; publish posts them to the PR.` : "Nothing posts from this page; your answers stay in this browser."}</span></section>`;
}
function reviewMd() {
  const out = [`## Decision review: ${C.title}`];
  ORDER.forEach((p) => { const ds = ALL.filter((d) => d.pr === p.key && d.status !== "planned"); if (!ds.length) return;
    out.push("", `### ${shortPr(p.key)} ${strip(p.title)}`);
    ds.forEach((d) => { const c = S.calls[d.uid]; out.push(`- **${ST[d.status][0]}:** ${d.text}${d.ev && d.ev[0] ? ` (\`${evWhere(d.ev[0])}\`)` : ""} → ${c ? CALLS[c][0] : "not answered"}`); }); });
  const hu = NOTICES.filter((n) => !(n.decision && ALL.some((d) => d.pr === n.pr && d.id === n.decision && d.status !== "planned")));
  if (hu.length) { out.push("", "### Heads-ups from the coding session");
    hu.forEach((n) => { const c = S.calls[n.uid]; out.push(`- **${NKIND[n.kind] || "Heads-up"}**${n.pr ? ` (${shortPr(n.pr)})` : " (no PR)"}: ${n.text} · ${NSTATE[nstate(n)][0]}${c ? ` → ${CALLS[c][0]}` : ""}`); }); }
  return out.join("\n");
}

/* an answer is a note on the decision's first changed line (or the PR), so it publishes with the review */
function sendCall(d, kind) {
  // one note id per answer: a changed answer is a new note (the old one may already be posted), and clearing or
  // changing undoes the others, whichever page (this one or Focus) made them; the same ids as Focus's
  const base0 = "dc-" + d.uid.replace(/[^\w-]/g, "-"), e = (d.ev || []).find((x) => x.side !== "old" && x.at);
  const go = Object.keys(CALLS).filter((k) => k !== kind).map((k) => KIT.undoNote(base0 + "-" + k, d.pr));
  if (kind) go.push(KIT.noteEvent({ id: base0 + "-" + kind, pr: d.pr, path: e && e.path, line: e && e.at, side: e && e.side, type: CALLS[kind][1],
    text: `${CALLS[kind][2]}: ${d.text}${d.status === "unplanned" ? "" : ` (the plan: ${d.plan})`}`, label: d.pr }));
  S.notes = S.notes.filter((n) => !n.id.startsWith(base0)).concat(kind ? [{ id: base0 + "-" + kind, pr: d.pr }] : []);
  if (go.length) KIT.send(go).then((ok) => { if (KIT.served && !ok) toast("Couldn't reach the Agent Session Review: the answer is only in this browser"); });
}

const MULTI = ORDER.length > 1;
const cur = () => (MULTI && (S.pr === "overview" || !S.pr) ? null : ORDER.find((p) => p.key === S.pr) || ORDER[0]);
const pageNo = () => { const p = cur(); return p ? ORDER.indexOf(p) : -1; };
function render() {
  const p = cur(), i = pageNo();
  const left = (k) => ALL.filter((d) => (!k || d.pr === k) && d.status === "unplanned" && !S.calls[d.uid]).length;
  $("#sess").innerHTML = `<b>${esc(C.title)}</b>${MULTI ? ` · ${p ? `PR ${i + 1} of ${ORDER.length}` : "Overview"}` : ""}`;
  $("#nav").innerHTML = MULTI ? `<button class="nb" data-go="${i - 1}" ${i > -1 ? "" : "disabled"} aria-label="Previous page">←</button><span class="chips"><button class="nb ov" data-go="-1" aria-current="${!p}">Overview${left() ? ` · ${left()}` : ""}</button>${ORDER.map((q, j) => `<button class="nb" data-go="${j}" aria-current="${j === i}" title="${esc(strip(q.title))}${left(q.key) ? ` · ${pl(left(q.key), "unplanned decision")} to answer` : ""}">${esc(shortPr(q.key))}${left(q.key) ? ` · ${left(q.key)}` : ""}</button>`).join("")}</span><button class="nb" data-go="${i + 1}" ${i < ORDER.length - 1 ? "" : "disabled"} aria-label="Next page">→</button>` : "";
  $("#main").innerHTML = p ? prPage(p) : overviewPage();
}
const keep = (fn) => { const y = window.scrollY; fn(); save(); render(); window.scrollTo(0, y); };
function goPr(j) { if (j === -1 && MULTI) S.pr = "overview"; else { const p = ORDER[j]; if (!p) return; S.pr = p.key; } save(); try { history.replaceState(null, "", "#" + (cur() ? slug(cur()) : "overview")); } catch (_) {} render(); window.scrollTo({ top: 0 }); }
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.go !== undefined) return goPr(+d.go);
  if (d.call) { const j = d.call.lastIndexOf("|"), uid = d.call.slice(0, j), k = d.call.slice(j + 1), n = NOTICES.find((x) => x.uid === uid),
      dec = ALL.find((x) => x.uid === uid) || (n && { uid, pr: n.pr, text: n.text, status: "unplanned", ev: [] }); if (!dec) return;
    return keep(() => { const next = S.calls[uid] === k ? null : k; S.calls[uid] = next; if (dec.pr) sendCall(dec, next); }); }
  if (d.copy !== undefined) {
    const text = reviewMd(), fallback = () => { const o = $("#mdout"); o.hidden = false; o.textContent = text; const r = document.createRange(); r.selectNodeContents(o); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected: copy it with your keyboard"); };
    try { navigator.clipboard.writeText(text).then(() => toast("Answers copied as Markdown"), fallback); } catch (_) { fallback(); }
  }
});
document.addEventListener("change", (e) => { const d = e.target.dataset; if (d.done !== undefined) keep(() => { S.done[d.done] = e.target.checked; }); });
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select")) return;
  const i = pageNo();
  if (e.key === "ArrowRight" || e.key === "]") goPr(i + 1); else if (e.key === "ArrowLeft" || e.key === "[") goPr(i - 1);
});
const h0 = (location.hash || "").slice(1), hp = ORDER.find((p) => slug(p) === h0);
if (hp) S.pr = hp.key; else if (h0 === "overview") S.pr = "overview";
render();
$("#cknav").innerHTML = KIT.navHtml(); KIT.liveBanner(document.querySelector(".bar")); KIT.freshBar(document.querySelector(".bar"), C);
})();
</script>
